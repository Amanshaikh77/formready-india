<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://quge5.com/88/tag.min.js" data-zone="284561" async data-cfasync="false"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FormReady India - 100% Private Offline Document & Form Toolbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0c0a08;
      --card-bg: #16120e;
      --card-border: rgba(217, 154, 63, 0.22);
      --card-hover-border: #f5a623;
      --amber: #f5a623;
      --paper: #f8f4ec;
      --muted: #a0907e;
      --green: #10b981;
      --panel: #130f0c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #261a0f 0%, #0c0a08 75%);
      color: var(--paper);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 24px 14px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* FULL-PAGE PROMINENT GLASS SHINE (CONTINUOUS BACK-TO-BACK LOOP) */
    .global-shine-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .global-shine-overlay::after {
      content: '';
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      background: linear-gradient(
        125deg,
        rgba(255, 255, 255, 0) 35%,
        rgba(255, 255, 255, 0.04) 43%,
        rgba(255, 255, 255, 0.24) 48%,
        rgba(255, 255, 255, 0.38) 50%,
        rgba(255, 255, 255, 0.24) 52%,
        rgba(255, 255, 255, 0.04) 57%,
        rgba(255, 255, 255, 0) 65%
      );
      transform: translate3d(-55%, -55%, 0);
      animation: continuousGlassSweep 4.8s linear infinite;
      will-change: transform;
    }

    /* Seamless Back-to-Back Loop Animation */
    @keyframes continuousGlassSweep {
      0% {
        transform: translate3d(-55%, -55%, 0);
      }
      100% {
        transform: translate3d(55%, 55%, 0);
      }
    }

    .container { width: 100%; max-width: 1140px; position: relative; z-index: 1; }

    /* Header */
    header { text-align: center; margin-bottom: 24px; }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff7eb 20%, #f5a623 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .tagline {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* Author Badge */
    .author-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: #1c150e;
      border: 1px solid rgba(245, 166, 35, 0.35);
      border-radius: 999px;
      font-size: 11.5px;
      color: var(--amber);
      font-weight: 700;
      box-shadow: 0 0 12px rgba(245, 166, 35, 0.12);
    }

    /* Search Box */
    .search-box {
      width: 100%;
      max-width: 580px;
      margin: 0 auto 18px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--card-border);
      padding: 13px 16px 13px 42px;
      border-radius: 12px;
      color: var(--paper);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .search-box input:focus {
      border-color: var(--amber);
      box-shadow: 0 0 14px rgba(245, 166, 35, 0.25);
    }
    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      fill: var(--muted);
      pointer-events: none;
    }

    /* Category Chips */
    .chips-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 24px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .chips-bar::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--panel);
      border: 1px solid var(--card-border);
      color: var(--muted);
      padding: 8px 15px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .chip.active, .chip:hover {
      background: var(--amber);
      color: #0c0a08;
      border-color: var(--amber);
    }

    /* Categories */
    .category-section { margin-bottom: 30px; }
    .cat-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--amber);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 980px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* Card */
    .tool-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      transform: translate3d(0, 0, 0);
      transition: border-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    @media (hover: hover) {
      .tool-card:hover {
        border-color: var(--card-hover-border);
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 16px rgba(245, 166, 35, 0.2);
      }
    }

    .tool-icon {
      font-size: 24px;
      min-width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tool-info { flex: 1; min-width: 0; }
    .tool-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }
    .tool-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--paper);
    }
    .tool-card:hover .tool-name {
      color: #ffbe53;
    }
    .tool-desc {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Badge */
    .badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge.active {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 36px;
      font-size: 11.5px;
      color: var(--muted);
      border-top: 1px solid var(--card-border);
      padding-top: 18px;
      width: 100%;
      max-width: 600px;
    }
  </style>
</head>
<body>

<!-- Full-Page Continuous Glass Shine Overlay -->
<div class="global-shine-overlay"></div>

<div class="container">
  <header>
    <h1>FormReady India</h1>
    <p class="tagline">⚡ Superfast, 100% Secure Offline Document & Form Toolbox</p>
    <div class="author-badge">✨ Made by Aman Shaikh</div>
  </header>

  <div class="search-box">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="searchInput" placeholder="Search tools (e.g. 50KB resize, signature, cutter, GST)..." oninput="filterTools()">
  </div>

  <div class="chips-bar">
    <button class="chip active" onclick="selectCategory('all', this)">All Tools (39)</button>
    <button class="chip" onclick="selectCategory('govt', this)">🇮🇳 Sarkari Form & IDs</button>
    <button class="chip" onclick="selectCategory('pdf', this)">📄 PDF Tools</button>
    <button class="chip" onclick="selectCategory('photo', this)">🖼️ Photo & Images</button>
    <button class="chip" onclick="selectCategory('text', this)">📝 Text & OCR</button>
    <button class="chip" onclick="selectCategory('calc', this)">🧮 Smart Calculators</button>
  </div>

  <main id="catalogContainer"></main>

  <footer>
    © 2026 FormReady India • Zero Server Uploads • Client-Side 100% Privacy
  </footer>
</div>

<script>
const TOOL_CATALOG = [
  {
    categoryId: "govt",

    tools: [
      { slug: "aadhaar-pan-resizer", name: "ID Card to A4 Print Maker", desc: "Auto-crop front & back sides into clean, top-aligned A4 print-ready PDF.", icon: "🪪", status: "active" },
      { slug: "signature-resizer", name: "Sign Resizer (10KB - 20KB)", desc: "Boost contrast & compress signature for official online exam portals.", icon: "✍️", status: "active" },
      { slug: "aadhaar-pan-cutter", name: "Aadhaar / PAN Card Cutter", desc: "Extract & crop standard wallet-size ID cards from e-Aadhaar & PAN PDF.", icon: "✂️", status: "active" },
      { slug: "signature-maker", name: "Digital Signature Draw Maker", desc: "Draw ultra-smooth signature on mobile/mouse and get transparent PNG.", icon: "🖊️", status: "active" },
      { slug: "passport-photo-maker", name: "Passport Size Photo Maker", desc: "Create single or multi-copy passport photos with plain white background.", icon: "👥", status: "active" },
      { slug: "photo-sign-card", name: "Photo + Signature Joiner", desc: "Merge photo & signature in a single standard box required for NTA/IBPS.", icon: "🔲", status: "active" },
      { slug: "photo-sheet", name: "Passport Photo Sheet (4x6 / A4)", desc: "Generate ready-to-print 6, 8 or 16 photo studio sheets in one click.", icon: "🖨️", status: "active" },
      { slug: "document-scanner", name: "HD Document Cam Scanner", desc: "Scan certificates via mobile camera with auto black & white filter.", icon: "📷", status: "active" },
      { slug: "govt-pdf-helper", name: "Sarkari PDF Compressor (Under 100KB)", desc: "Compress marksheet & caste certificate under 100KB/200KB upload limits.", icon: "📋", status: "active" }
    ]
  },
  {
    categoryId: "pdf",
    categoryTitle: "📄 PDF Tools & Utilities",
    tools: [
      { slug: "pdf-editor", name: "Online PDF Editor & Markup", desc: "Edit text, annotate, highlight and sign PDF files directly offline.", icon: "📝", status: "active" },
      { slug: "pdf-compressor", name: "Compress PDF (Lossless)", desc: "Reduce heavy PDF MBs down to KBs while preserving sharp text clarity.", icon: "🗜️", status: "active" },
      { slug: "merge-pdf", name: "Merge PDF (Join Multiple Files)", desc: "Combine multiple PDF documents and marksheets into one single file.", icon: "🔗", status: "active" },
      { slug: "split-pdf", name: "Split & Extract PDF Pages", desc: "Extract custom pages or break large PDF books into separate files.", icon: "✂️", status: "active" },
      { slug: "jpg-to-pdf", name: "JPG to PDF Converter", desc: "Convert multiple gallery images into a single printable high-res PDF.", icon: "🖼️", status: "active" },
      { slug: "pdf-to-jpg", name: "PDF to JPG / Image Extractor", desc: "Extract high-resolution JPG pictures from each page of your PDF file.", icon: "📷", status: "active" },
      { slug: "rotate-pdf", name: "Rotate PDF (90° / 180°)", desc: "Fix upside down and sideways scanned documents permanently.", icon: "🔄", status: "active" },
      { slug: "pdf-organizer", name: "PDF Page Organizer", desc: "Drag-and-drop to reorder, delete or arrange pages in any PDF document.", icon: "📑", status: "active" },
      { slug: "add-watermark", name: "Add Watermark to PDF", desc: "Stamp confidential, custom text or logos across your PDF pages.", icon: "💧", status: "active" }
    ]
  },
  {
    categoryId: "photo",
    categoryTitle: "🖼️ Photo & Image Optimization",
    tools: [
      { slug: "photo-resizer", name: "Photo Resizer (PX, CM, INCH)", desc: "Resize dimensions with custom DPI for online form upload requirements.", icon: "📐", status: "active" },
      { slug: "photo-compressor", name: "Photo Compressor (KB to MB)", desc: "Compress image file size up to 80% without losing quality or sharpness.", icon: "🗜️", status: "active" },
      { slug: "photo-cropper", name: "Photo Cropper (Custom Ratios)", desc: "Crop photos with custom aspect ratios (1:1, 3:4, 3.5x4.5cm) effortlessly.", icon: "✂️", status: "active" },
      { slug: "image-converter", name: "Image Format Converter", desc: "Instant lossless conversion between JPG, PNG, WEBP, and ICO formats.", icon: "🔄", status: "active" },
      { slug: "background-remover", name: "AI Background Remover", desc: "Make photo background white or transparent in 1-click for IDs & forms.", icon: "🪄", status: "active" }
    ]
  },
  {
    categoryId: "text",
    categoryTitle: "📝 Text & Generator Utilities",
    tools: [
      { slug: "image-to-text", name: "Image to Text (OCR Extractor)", desc: "Extract printed or handwritten text from photos, scans & books instantly.", icon: "🔍", status: "active" },
      { slug: "text-cleaner", name: "Text Cleaner & Space Fixer", desc: "Remove weird duplicate spaces, line breaks, and messy formatting.", icon: "🧹", status: "active" },
      { slug: "case-converter", name: "Case Converter (UPPER/lower)", desc: "Quickly convert text into UPPERCASE, lowercase, Title Case or camelCase.", icon: "🔠", status: "active" },
      { slug: "word-counter", name: "Word & Character Counter", desc: "Real-time character count, word density, reading time and essay stats.", icon: "📊", status: "active" },
      { slug: "text-to-pdf", name: "Text to PDF Generator", desc: "Convert raw notes, code, and text snippets into formatted clean PDFs.", icon: "📄", status: "active" },
      { slug: "lorem-generator", name: "Lorem Ipsum Dummy Generator", desc: "Generate sample placeholder text and paragraphs for design wireframes.", icon: "📜", status: "active" },
      { slug: "qr-generator", name: "HD QR Code Generator", desc: "Create colored high-res QR codes for URLs, WiFi logins, and UPI links.", icon: "📱", status: "active" },
      { slug: "barcode-generator", name: "Barcode Generator (Code128)", desc: "Generate Code128, EAN, and UPC retail barcodes ready to print.", icon: "🏷️", status: "active" }
    ]
  },
  {
    categoryId: "calc",
    categoryTitle: "🧮 Everyday Smart Calculators",
    tools: [
      { slug: "gst-calculator", name: "GST Calculator (CGST / SGST)", desc: "Calculate GST Inclusive & Exclusive amounts with 5%, 12%, 18% & 28% slabs.", icon: "💰", status: "active" },
      { slug: "age-calculator", name: "Sarkari Job Age Calculator", desc: "Calculate exact age in years, months & days against cut-off eligibility dates.", icon: "🎂", status: "active" },
      { slug: "emi-calculator", name: "Loan EMI & Interest Calculator", desc: "Calculate monthly installments, interest breakdown for Home & Car loans.", icon: "💳", status: "active" },
      { slug: "discount-calculator", name: "Discount & Percentage Calculator", desc: "Calculate festive shopping discounts, profit/loss margins, and savings.", icon: "🏷️", status: "active" },
      { slug: "bmi-calculator", name: "BMI & Fitness Calculator", desc: "Check Body Mass Index, healthy weight range, and fitness category.", icon: "⚖️", status: "active" },
      { slug: "date-gap-calculator", name: "Date Gap & Working Days", desc: "Count exact total days, weeks, months, and exclude public holidays.", icon: "📅", status: "active" },
      { slug: "unit-converter", name: "Land & Unit Converter", desc: "Convert regional land units (Bigha, Sq Ft, Acre), length, and weights.", icon: "📐", status: "active" },
      { slug: "currency-converter", name: "Live Currency Converter", desc: "Quick live conversion estimates for USD, EUR, GBP to INR rates.", icon: "💱", status: "active" }
    ]
  }
];

let activeCategory = 'all';

function renderTools() {
  const container = document.getElementById('catalogContainer');
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  container.innerHTML = '';

  TOOL_CATALOG.forEach(cat => {
    if (activeCategory !== 'all' && cat.categoryId !== activeCategory) return;

    const filtered = cat.tools.filter(t =>
      t.name.toLowerCase().includes(query) || 
      t.desc.toLowerCase().includes(query) ||
      t.slug.toLowerCase().includes(query)
    );

    if (filtered.length === 0) return;

    const section = document.createElement('div');
    section.className = 'category-section';

    const title = document.createElement('div');
    title.className = 'cat-title';
    title.innerText = cat.categoryTitle;
    section.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';

    filtered.forEach(tool => {
      const card = document.createElement('a');
      card.className = 'tool-card';
      card.href = `tools/${tool.slug}/index.html`;

      card.innerHTML = `
        <div class="tool-icon">${tool.icon}</div>
        <div class="tool-info">
          <div class="tool-title-row">
            <div class="tool-name">${tool.name}</div>
            <span class="badge active">ACTIVE</span>
          </div>
          <div class="tool-desc">${tool.desc}</div>
        </div>
      `;

      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

function selectCategory(catId, el) {
  activeCategory = catId;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderTools();
}

function filterTools() {
  renderTools();
}

document.addEventListener('DOMContentLoaded', renderTools);
renderTools();
</script>
</body>
</html>
