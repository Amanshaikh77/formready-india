<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FormReady India - All-in-One Offline Document &amp; Photo Toolbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #151210;
  --panel: #1e1a17;
  --panel-2: #262019;
  --line: #39322b;
  --amber: #d99a3f;
  --amber-bright: #f0b158;
  --paper: #f2ece2;
  --muted: #a89a89;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--paper);
  font-family: 'Inter', sans-serif;
  padding: 16px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  text-align: center;
  max-width: 800px;
  margin: 30px auto 20px;
}
header h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px;
  color: var(--amber);
  margin-bottom: 8px;
}
header p {
  font-size: 14px;
  color: var(--muted);
}
.search-container {
  max-width: 600px;
  margin: 0 auto 20px;
  padding: 0 16px;
}
.search-input {
  width: 100%;
  padding: 12px 18px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: #fff;
  border-radius: 12px;
  font-size: 14.5px;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--amber); }
.category-wrapper {
  max-width: 1100px;
  margin: 0 auto 24px;
  padding: 0 16px;
}
.category-tabs {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: none;
}
.category-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  background: var(--panel);
  color: var(--muted);
  border: 1px solid var(--line);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.tab-btn:hover { border-color: var(--amber); color: #fff; }
.tab-btn.active {
  background: var(--amber);
  border-color: var(--amber);
  color: #151210;
}
.category-section {
  max-width: 1100px;
  margin: 0 auto 36px;
  padding: 0 16px;
}
.category-header {
  margin-bottom: 16px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
}
.category-title { font-size: 18px; color: var(--paper); }
.category-desc { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.tool-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-decoration: none;
  transition: transform 0.2s, border-color 0.2s;
}
.tool-card:hover {
  transform: translateY(-2px);
  border-color: var(--amber);
}
.tool-card-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
}
.tool-icon {
  font-size: 20px;
  background: var(--panel-2);
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
}
.tool-info h3 { font-size: 15px; color: var(--paper); margin-bottom: 4px; }
.tool-info p { font-size: 12px; color: var(--muted); line-height: 1.4; }
.tool-badge {
  align-self: flex-start;
  margin-top: 10px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 6px;
}
.badge-ready { background: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.4); }
.badge-upcoming { background: rgba(217, 154, 63, 0.15); color: #f0b158; border: 1px solid rgba(217, 154, 63, 0.3); }
footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  margin-top: auto;
}
</style>
</head>
<body>
<header>
  <h1>FormReady India</h1>
  <p>Fast, Simple, Mobile-Friendly &amp; 100% Private Client-Side Toolbox</p>
</header>
<div class="search-container">
  <input type="search" id="searchInput" class="search-input" placeholder="🔍 Search any tool (e.g. Cropper, Resizer, PDF)...">
</div>
<div class="category-wrapper">
  <div class="category-tabs" id="categoryTabs">
    <button class="tab-btn active" data-filter="all">🌟 All Tools</button>
    <button class="tab-btn" data-filter="photo">📸 Image &amp; Photo</button>
    <button class="tab-btn" data-filter="govt">🪪 Govt Form &amp; ID</button>
    <button class="tab-btn" data-filter="pdf">📄 PDF Tools</button>
    <button class="tab-btn" data-filter="text">📝 Text Utilities</button>
    <button class="tab-btn" data-filter="calculators">🧮 Calculators</button>
  </div>
</div>
<div id="catalogContainer"></div>
<footer>
  &copy; 2026 FormReady India. Zero Server Uploads — 100% Secure Local Processing.
</footer>
<script>
const toolsCatalog = [
  {
    category: "photo",
    categoryTitle: "📸 Image & Photo Utilities",
    categoryDesc: "High-resolution photo editing, precision cropping, and background tools",
    tools: [
      { name: "Image Format Converter", desc: "Instant format swap: JPG, PNG, and WebP", icon: "🔄", status: "ready", link: "tools/image-converter/" },
      { name: "Photo Cropper", desc: "Touch-friendly precision aspect-ratio cropper", icon: "✂️", status: "ready", link: "tools/photo-cropper/" },
      { name: "Photo Resizer", desc: "Resize dimensions in pixels, cm, or mm directly", icon: "📐", status: "ready", link: "tools/photo-resizer/" },
      { name: "Photo Compressor", desc: "Shrink photo KB/MB size while maintaining resolution", icon: "🗜️", status: "ready", link: "tools/photo-compressor/" },
      { name: "Passport Photo Maker", desc: "Govt standard passport photos with clean backgrounds", icon: "👤", status: "ready", link: "tools/passport-photo/" },
      { name: "Photo Sheet Maker", desc: "Printable A4 grid sheets with multiple photo copies", icon: "🖨️", status: "ready", link: "tools/photo-sheet/" },
      { name: "Background Remover", desc: "Client-side transparent background cutter", icon: "🪄", status: "ready", link: "tools/background-remover/" },
      { name: "Signature Maker", desc: "Draw, smooth, and export transparent digital signatures", icon: "✍️", status: "ready", link: "tools/signature-maker/" },
      { name: "Image to Text (OCR)", desc: "Copy text directly from any picture or screenshot", icon: "👁️", status: "upcoming", link: "#" }
    ]
  },
  {
    category: "govt",
    categoryTitle: "🪪 Indian Govt Form & ID Utilities",
    categoryDesc: "Official Indian exam & recruitment portal formats (SSC, UPSC, State IDs)",
    tools: [
      { name: "Aadhaar / PAN Photo Resizer", desc: "Strict 200x230 px & size limit crop/resizer", icon: "🪪", status: "upcoming", link: "#" },
      { name: "Signature Resizer & Enhancer", desc: "Strict size limit with contrast booster for portal upload", icon: "✍️", status: "upcoming", link: "#" },
      { name: "Passport Photo + Sign Card", desc: "Merge identity photo and signature onto one frame", icon: "👥", status: "upcoming", link: "#" },
      { name: "Document Scanner", desc: "Camera scan with high-contrast B&W clean doc filter", icon: "📄", status: "upcoming", link: "#" },
      { name: "Govt Form PDF Helper", desc: "Compress and fit PDF strictly under required portal limits", icon: "📋", status: "upcoming", link: "#" }
    ]
  },
  {
    category: "pdf",
    categoryTitle: "📄 PDF Tools & Editors",
    categoryDesc: "Client-side private PDF manipulation, inspection, and redaction",
    tools: [
      { name: "PDF Text Inspector & Editor", desc: "Edit text, redactions, auto-font detect on digital & scanned PDFs", icon: "📝", status: "ready", link: "tools/pdf-editor/" },
      { name: "Merge PDF", desc: "Combine multiple PDF documents into one ordered file", icon: "📑", status: "ready", link: "tools/merge-pdf/" },
      { name: "Split PDF", desc: "Extract pages or custom page ranges into a new PDF", icon: "✂️", status: "ready", link: "tools/split-pdf/" },
      { name: "JPG to PDF", desc: "Convert photo image files into multi-page PDFs", icon: "🖼️", status: "ready", link: "tools/jpg-to-pdf/" },
      { name: "PDF to JPG", desc: "Extract high-resolution JPG images from PDF pages", icon: "📸", status: "ready", link: "tools/pdf-to-jpg/" },
      { name: "Compress PDF", desc: "Client-side file size compressor keeping clarity intact", icon: "🗜️", status: "upcoming", link: "#" },
      { name: "Rotate PDF", desc: "Fix orientation of 90°, 180°, or inverted pages", icon: "🔄", status: "upcoming", link: "#" },
      { name: "PDF Page Organizer", desc: "Drag to reorder pages or delete unwanted sheets", icon: "📑", status: "upcoming", link: "#" },
      { name: "Add Watermark", desc: "Stamp confidential or custom text/logo over PDF", icon: "💧", status: "upcoming", link: "#" }
    ]
  },
  {
    category: "text",
    categoryTitle: "📝 Text, Code & Content Tools",
    categoryDesc: "Quick string formatters, counters, and offline code utilities",
    tools: [
      { name: "Word & Character Counter", desc: "Real-time count of words, characters, and reading time", icon: "🔢", status: "upcoming", link: "#" },
      { name: "Case Converter", desc: "Toggle UPPERCASE, lowercase, Title Case & camelCase", icon: "🔤", status: "upcoming", link: "#" },
      { name: "Text Cleaner", desc: "Strip accidental double spaces, tabs, and blank lines", icon: "🧹", status: "upcoming", link: "#" },
      { name: "QR Code Generator", desc: "Create QR codes for links, UPI payments, and Wi-Fi", icon: "🏁", status: "upcoming", link: "#" },
      { name: "Barcode Generator", desc: "Generate standard barcodes easily", icon: "|||", status: "upcoming", link: "#" },
      { name: "Text to PDF / Image", desc: "Convert plain text notes into a printable document", icon: "📄", status: "upcoming", link: "#" },
      { name: "Lorem Ipsum Generator", desc: "Generate placeholder text for layouts and forms", icon: "📜", status: "upcoming", link: "#" }
    ]
  },
  {
    category: "calculators",
    categoryTitle: "🧮 Daily & Finance Calculators",
    categoryDesc: "Instant eligibility calculations, loan EMI, GST, and daily math tools",
    tools: [
      { name: "Govt Form Age Calculator", desc: "Calculate exact age as on notification date (Y/M/D)", icon: "🎂", status: "upcoming", link: "#" },
      { name: "GST Calculator", desc: "Breakdown CGST, SGST & total amount addition or removal", icon: "📊", status: "upcoming", link: "#" },
      { name: "EMI Calculator", desc: "Calculate monthly installments and total loan interest", icon: "💳", status: "upcoming", link: "#" },
      { name: "Percentage & Discount", desc: "Instant shopping discounts, markups, and margins", icon: "🏷️", status: "upcoming", link: "#" },
      { name: "BMI & Health Calculator", desc: "Body Mass Index calculation with health bracket indicators", icon: "⚖️", status: "upcoming", link: "#" },
      { name: "Date Gap Calculator", desc: "Exact days, weeks, and month gaps between two dates", icon: "📅", status: "upcoming", link: "#" },
      { name: "Unit Converter", desc: "Convert Land, Weight, Length & Units", icon: "📐", status: "upcoming", link: "#" },
      { name: "Currency Converter", desc: "Quick currency rate estimations and conversions", icon: "💱", status: "upcoming", link: "#" }
    ]
  }
];

function renderCatalog(filter = "all", query = "") {
  const container = document.getElementById("catalogContainer");
  container.innerHTML = "";
  const q = query.trim().toLowerCase();

  toolsCatalog.forEach(cat => {
    if (filter !== "all" && cat.category !== filter) return;
    const matchedTools = cat.tools.filter(t => 
      t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)
    );
    if (matchedTools.length === 0) return;

    const section = document.createElement("section");
    section.className = "category-section";
    section.innerHTML = `
      <div class="category-header">
        <h2 class="category-title">${cat.categoryTitle}</h2>
        <p class="category-desc">${cat.categoryDesc}</p>
      </div>
      <div class="tools-grid">
        ${matchedTools.map(t => `
          <a href="${t.link}" class="tool-card" ${t.link === '#' ? 'onclick="alert(\'This tool is coming soon in the next update!\'); return false;"' : ''}>
            <div class="tool-card-head">
              <span class="tool-icon">${t.icon}</span>
              <div class="tool-info">
                <h3>${t.name}</h3>
                <p>${t.desc}</p>
              </div>
            </div>
            <span class="tool-badge ${t.status === 'ready' ? 'badge-ready' : 'badge-upcoming'}">
              ${t.status === 'ready' ? 'Active Tool' : 'Coming Soon'}
            </span>
          </a>
        `).join("")}
      </div>
    `;
    container.appendChild(section);
  });
}

let activeFilter = "all";
const searchInput = document.getElementById("searchInput");

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    renderCatalog(activeFilter, searchInput.value);
  });
});

searchInput.addEventListener("input", (e) => {
  renderCatalog(activeFilter, e.target.value);
});

renderCatalog();
</script>
</body>
</html>
