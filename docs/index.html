let activeCategory = 'all';

function renderTools() {
  const container = document.getElementById('catalogContainer');
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  container.innerHTML = '';

  TOOL_CATALOG.forEach(cat => {
    if (activeCategory !== 'all' && cat.categoryId !== activeCategory) return;

    const filtered = cat.tools.filter(t =>
      t.name.toLowerCase().includes(query) || 
      t.desc.toLowerCase().includes(query) ||
      t.slug.toLowerCase().includes(query)
    );

    if (filtered.length === 0) return;

    const section = document.createElement('div');
    section.className = 'category-section';

    const title = document.createElement('div');
    title.className = 'cat-title';
    title.innerText = cat.categoryTitle;
    section.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';

    filtered.forEach(tool => {
      const card = document.createElement('a');
      const isActive = tool.status === 'active';
      card.className = `tool-card ${isActive ? 'active-tool' : 'coming-tool'}`;
      card.href = isActive ? `tools/${tool.slug}/index.html` : 'javascript:void(0);';

      card.innerHTML = `
        <div class="tool-icon">${tool.icon}</div>
        <div class="tool-info">
          <div class="tool-title-row">
            <div class="tool-name">${tool.name}</div>
            <span class="badge ${isActive ? 'active' : 'soon'}">${isActive ? 'ACTIVE' : 'SOON'}</span>
          </div>
          <div class="tool-desc">${tool.desc}</div>
        </div>
      `;

      // 3D Tilt Event Listener
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        const rotateX = -(y / 14);
        const rotateY = (x / 14);
        card.style.transform = `perspective(700px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-5px) scale(1.02)`;
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(700px) rotateX(0deg) rotateY(0deg) translateY(0) scale(1)';
      });

      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

function selectCategory(catId, el) {
  activeCategory = catId;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderTools();
}

function filterTools() {
  renderTools();
}

document.addEventListener('DOMContentLoaded', renderTools);
renderTools();
