<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FormReady India - 100% Private Offline Toolbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #13100e;
      --panel: #1a1613;
      --card-bg: #1c1815;
      --card-border: #2c251f;
      --amber: #d99a3f;
      --amber-hover: #c48733;
      --paper: #f5efe6;
      --muted: #968877;
      --green: #2ecc71;
      --soon: #736453;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--paper);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 1100px; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 26px; font-weight: 800; color: var(--amber); margin-bottom: 6px; letter-spacing: -0.5px; }
    .tagline { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .author-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: rgba(217, 154, 63, 0.08);
      border: 1px solid rgba(217, 154, 63, 0.25);
      border-radius: 999px;
      font-size: 11.5px;
      color: var(--amber);
      font-weight: 600;
    }
    .search-box {
      width: 100%;
      max-width: 560px;
      margin: 0 auto 16px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--card-border);
      padding: 13px 16px 13px 40px;
      border-radius: 10px;
      color: var(--paper);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--amber); }
    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--muted);
    }
    .chips-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 24px;
      scrollbar-width: none;
      justify-content: flex-start;
    }
    .chips-bar::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--panel);
      border: 1px solid var(--card-border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .chip.active, .chip:hover {
      background: var(--amber);
      color: #13100e;
      border-color: var(--amber);
    }
    .category-section { margin-bottom: 30px; }
    .cat-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--amber);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 960px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 15px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }
    .tool-card.active-tool:hover {
      transform: translateY(-2px);
      border-color: var(--amber);
    }
    .tool-card.coming-tool {
      opacity: 0.6;
      cursor: default;
    }
    .tool-icon {
      font-size: 22px;
      min-width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tool-info { flex: 1; min-width: 0; }
    .tool-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }
    .tool-name { font-size: 13.5px; font-weight: 700; color: var(--paper); }
    .tool-desc { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
    .badge {
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .badge.active {
      background: rgba(46, 204, 113, 0.12);
      color: var(--green);
      border: 1px solid rgba(46, 204, 113, 0.3);
    }
    .badge.soon {
      background: rgba(115, 100, 83, 0.15);
      color: var(--soon);
      border: 1px solid rgba(115, 100, 83, 0.3);
    }
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 11.5px;
      color: var(--muted);
      border-top: 1px solid var(--card-border);
      padding-top: 20px;
      width: 100%;
      max-width: 600px;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>FormReady India</h1>
    <p class="tagline">Fast, Mobile-Friendly & 100% Private Offline Document Toolbox</p>
    <div class="author-badge">✨ Made by Aman Shaikh</div>
  </header>

  <div class="search-box">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="searchInput" placeholder="Search any tool (e.g. GST, QR, Age, Resize)..." oninput="filterTools()">
  </div>

  <div class="chips-bar">
    <button class="chip active" onclick="selectCategory('all', this)">All Tools</button>
    <button class="chip" onclick="selectCategory('govt', this)">🇮🇳 Govt Form & ID</button>
    <button class="chip" onclick="selectCategory('pdf', this)">📄 PDF Tools</button>
    <button class="chip" onclick="selectCategory('text', this)">📝 Text Utilities</button>
    <button class="chip" onclick="selectCategory('calc', this)">🧮 Calculators</button>
  </div>

  <main id="catalogContainer"></main>

  <footer>
    © 2026 FormReady India • Zero Server Uploads • 100% Secure Local Processing
  </footer>
</div>

<script>
const TOOL_CATALOG = [
  {
    categoryId: "govt",
    categoryTitle: "🇮🇳 Indian Govt Form & ID Utilities",
    tools: [
      { slug: "aadhaar-pan-resizer", name: "Aadhaar / PAN Photo Resizer", icon: "🖼️", desc: "Exact 200x230 px & exact file size limit cropper/resizer", status: "active" },
      { slug: "signature-resizer", name: "Signature Resizer & Enhancer", icon: "✒️", desc: "Strict size limit with contrast boost for exam portal upload", status: "active" },
      { slug: "passport-photo-maker", name: "Passport Photo + Sign Card", icon: "👥", desc: "Merge identity photo and signature into a single unified frame", status: "active" },
      { slug: "doc-scanner", name: "Document Scanner", icon: "📷", desc: "Camera scan with high-contrast B&W clean doc filter", status: "active" },
      { slug: "govt-pdf-helper", name: "Govt Form PDF Helper", icon: "📋", desc: "Compress & fit PDF strictly under required portal limits", status: "active" }
    ]
  },
  {
    categoryId: "pdf",
    categoryTitle: "📄 PDF Tools & Editors",
    tools: [
      { slug: "pdf-text-inspector", name: "PDF Text Inspector & Editor", icon: "📄", desc: "Inspect text, redactions, and forms in PDFs securely", status: "active" },
      { slug: "merge-pdf", name: "Merge PDF", icon: "🔗", desc: "Combine multiple PDF documents into one indexed file", status: "active" },
      { slug: "split-pdf", name: "Split PDF", icon: "✂️", desc: "Extract pages or custom page ranges into a new PDF", status: "active" },
      { slug: "jpg-to-pdf", name: "JPG to PDF", icon: "🖼️", desc: "Convert photos and image files into multi-page PDFs", status: "active" },
      { slug: "pdf-to-jpg", name: "PDF to JPG", icon: "📸", desc: "Extract high-resolution JPG images from PDF pages", status: "active" },
      { slug: "compress-pdf", name: "Compress PDF", icon: "🗜️", desc: "Client-side file size compression keeping clarity intact", status: "active" },
      { slug: "rotate-pdf", name: "Rotate PDF", icon: "🔄", desc: "Fix orientation of 90°, 180°, or inverted pages", status: "active" },
      { slug: "pdf-organizer", name: "PDF Page Organizer", icon: "📑", desc: "Drag to reorder pages or delete unwanted sheets", status: "active" },
      { slug: "add-watermark", name: "Add Watermark", icon: "💧", desc: "Stamp confidential or custom text/logo over PDF pages", status: "active" }
    ]
  },
  {
    categoryId: "text",
    categoryTitle: "📝 Text, Code & Content Tools",
    tools: [
      { slug: "word-counter", name: "Word & Character Counter", icon: "📊", desc: "Real-time count of words, characters, and reading time", status: "active" },
      { slug: "case-converter", name: "Case Converter", icon: "🔤", desc: "Toggle UPPERCASE, lower case, Title Case & camelCase", status: "active" },
      { slug: "text-cleaner", name: "Text Cleaner", icon: "🧹", desc: "Strip accidental double spaces, tabs, and blank lines", status: "active" },
      { slug: "qr-generator", name: "QR Code Generator", icon: "🏁", desc: "Create QR codes for links, UPI payments, and Wi-Fi", status: "active" },
      { slug: "barcode-generator", name: "Barcode Generator", icon: "📶", desc: "Generate standard barcodes easily", status: "active" },
      { slug: "text-to-pdf", name: "Text to PDF / Image", icon: "📜", desc: "Convert plain text notes into a printable document", status: "active" },
      { slug: "lorem-generator", name: "Lorem Ipsum Generator", icon: "📜", desc: "Generate placeholder text for layouts and forms", status: "active" }
    ]
  },
  {
    categoryId: "calc",
    categoryTitle: "🧮 Daily & Finance Calculators",
    tools: [
      { slug: "age-calculator", name: "Govt Form Age Calculator", icon: "🎂", desc: "Calculate exact age as on notification date (Y/M/D)", status: "active" },
      { slug: "gst-calculator", name: "GST Calculator", icon: "🧾", desc: "Breakdown CGST, SGST & total amount (add/remove)", status: "active" },
      { slug: "emi-calculator", name: "EMI Calculator", icon: "💳", desc: "Calculate monthly installments and total loan interest", status: "active" },
      { slug: "discount-calculator", name: "Percentage & Discount", icon: "🏷️", desc: "Instant shopping discounts, markups, and margins", status: "active" },
      { slug: "bmi-calculator", name: "BMI & Health Calculator", icon: "⚖️", desc: "Body Mass Index calculation with health bracket indicators", status: "active" },
      { slug: "date-gap-calculator", name: "Date Gap Calculator", icon: "📅", desc: "Exact days, weeks, and month gaps between two dates", status: "active" },
      { slug: "unit-converter", name: "Unit Converter", icon: "📐", desc: "Convert Land, Weight, Length & Units", status: "active" },
      { slug: "currency-converter", name: "Currency Converter", icon: "💱", desc: "Quick currency rate estimations and conversions", status: "active" }
    ]
  }
];

let activeCategory = 'all';

function renderTools() {
  const container = document.getElementById('catalogContainer');
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  container.innerHTML = '';

  TOOL_CATALOG.forEach(cat => {
    if (activeCategory !== 'all' && cat.categoryId !== activeCategory) return;

    const filtered = cat.tools.filter(t => 
      t.name.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query)
    );

    if (filtered.length === 0) return;

    const section = document.createElement('div');
    section.className = 'category-section';

    const title = document.createElement('div');
    title.className = 'cat-title';
    title.innerText = cat.categoryTitle;
    section.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';

    filtered.forEach(tool => {
      const card = document.createElement('a');
      const isActive = tool.status === 'active';
      card.className = `tool-card ${isActive ? 'active-tool' : 'coming-tool'}`;
      card.href = isActive ? `tools/${tool.slug}/index.html` : 'javascript:void(0);';

      card.innerHTML = `
        <div class="tool-icon">${tool.icon}</div>
        <div class="tool-info">
          <div class="tool-title-row">
            <div class="tool-name">${tool.name}</div>
            <span class="badge ${isActive ? 'active' : 'soon'}">${isActive ? 'ACTIVE' : 'SOON'}</span>
          </div>
          <div class="tool-desc">${tool.desc}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

function selectCategory(catId, el) {
  activeCategory = catId;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderTools();
}

function filterTools() {
  renderTools();
}

document.addEventListener('DOMContentLoaded', renderTools);
renderTools();
</script>
</body>
</html>
