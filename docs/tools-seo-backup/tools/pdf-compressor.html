<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">



<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#172033;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  max-width:720px;
  margin:auto;
  padding:14px;
}

h1{
  text-align:center;
  font-size:28px;
  margin:8px 0 5px;
}

.subtitle{
  text-align:center;
  color:#707887;
  margin-bottom:18px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.upload{
  display:block;
  text-align:center;
  border:2px dashed #6685d9;
  border-radius:15px;
  padding:20px;
  font-size:19px;
  font-weight:bold;
  color:#315fc7;
  cursor:pointer;
}

.upload input{
  display:none;
}

.section-title{
  font-size:19px;
  font-weight:700;
  margin-bottom:14px;
}

select{
  width:100%;
  height:48px;
  padding:0 13px;
  border:1.8px solid #d9dee8;
  border-radius:11px;
  font-size:16px;
  background:#fff;
  color:#172033;
}

.file-info{
  margin-top:12px;
  padding:12px;
  background:#f1f4f9;
  border-radius:12px;
  font-size:15px;

  display:none;

}

.result-box{
  background:#f1f4f9;

}

.size{
  font-size:20px;
  font-weight:bold;
}

.small{
  color:#707887;

}

  width:100%;

}

  background:#2867df;
  color:#fff;
}

#download{
  background:#172033;
  color:#fff;
  display:none;
}

  background:#e8ebf1;
  color:#172033;
}

  opacity:.5;
}

.note{
  text-align:center;
  color:#707887;
  font-size:13px;
  line-height:1.5;
  margin-top:12px;
}
</style>
<title>PDF Compressor Online - Reduce PDF Size | FormReady</title>
<meta name="description" content="Compress PDF files online and reduce file size for forms, uploads and applications. Free PDF compressor.">
<link rel="canonical" href="https://formready.in/tools/pdf-compressor.html">
</head>

<body>

<div class="container">

<h1>📦 PDF Compressor</h1>

<div class="subtitle">
Reduce PDF size for online form uploads
</div>


<div class="card">

<label class="upload">

📄 Choose PDF

<input
  type="file"
  id="pdfFile"
  accept="application/pdf"
>

</label>

<div
  id="fileInfo"
  class="file-info"
>
No PDF selected
</div>

</div>


<div class="card">

<div class="section-title">
🎯 Compression Level
</div>

<select id="quality">

<option value="high">
High Quality — Larger File
</option>

<option value="medium" selected>
Balanced — Recommended
</option>

<option value="low">
Maximum Compression — Smaller File
</option>

</select>

<div class="note">
Balanced is recommended for most government,
exam and online form uploads.
</div>

<button id="compress">
📦 Compress PDF
</button>

<button id="download">
⬇️ Download Compressed PDF
</button>

<button id="reset">
↻ Reset
</button>

</div>


<div
  id="result"
  class="card result"
>

<div class="section-title">
✅ Compression Result
</div>

<div class="result-box">

<div
  id="oldSize"
  class="small"
></div>

<div
  id="newSize"
  class="size"
></div>

<div
  id="saved"
  class="small"
></div>

</div>

</div>

</div>


<script>

/*
  Browser-only PDF compressor.

  Important:
  A PDF cannot always be made smaller simply
  by saving it again. This tool first checks
  whether compression actually reduced the file.
  If not, it keeps the original PDF instead of
  giving the user a fake "compressed" file.
*/


const pdfFile =
document.getElementById("pdfFile");

const fileInfo =
document.getElementById("fileInfo");

const quality =
document.getElementById("quality");

const compressBtn =
document.getElementById("compress");

const downloadBtn =
document.getElementById("download");

const resetBtn =
document.getElementById("reset");

const result =
document.getElementById("result");

const oldSize =
document.getElementById("oldSize");

const newSize =
document.getElementById("newSize");

const saved =
document.getElementById("saved");


let selectedFile = null;
let outputBlob = null;


/* FILE SIZE */

function formatSize(bytes){

  if(bytes < 1024){
    return bytes + " B";
  }

  if(bytes < 1024 * 1024){
    return (bytes / 1024).toFixed(1) + " KB";
  }

  return (
    bytes /
    (1024 * 1024)
  ).toFixed(2) + " MB";
}


/* FILE SELECT */

pdfFile.addEventListener(
"change",
function(){

  selectedFile =
  this.files[0];

  outputBlob = null;

  downloadBtn.style.display =
  "none";

  result.style.display =
  "none";


  if(!selectedFile){

    fileInfo.textContent =
    "No PDF selected";

    return;
  }


  if(
    selectedFile.type !==
    "application/pdf"
  ){

    alert(
      "Please select a PDF file."
    );

    pdfFile.value = "";

    selectedFile = null;

    return;
  }


  fileInfo.textContent =
  selectedFile.name +
  " • " +
  formatSize(
    selectedFile.size
  );

});


/*
  Try to compress using the browser.

  We use PDF.js to inspect the PDF and
  jsPDF to rebuild a lightweight PDF when
  possible.

  External libraries are loaded only when
  compression starts.
*/


async function loadLibraries(){

  if(
    window.pdfjsLib &&
    window.jspdf
  ){
    return;
  }


  await loadScript(
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs",
    true
  );

}


/* Generic script loader */

function loadScript(
  src,
  module=false
){

  return new Promise(
  function(resolve,reject){

    const script =
    document.createElement("script");

    script.src = src;

    if(module){
      script.type = "module";
    }

    script.onload =
    resolve;

    script.onerror =
    reject;

    document.head.appendChild(
      script
    );

  });
}


/*
  Conservative browser compression.

  For maximum compatibility we preserve the
  original PDF when browser-side recompression
  is not possible.
*/

async function compressPDF(){

  if(!selectedFile){

    alert(
      "Please choose a PDF first."
    );

    return;
  }


  compressBtn.disabled = true;

  compressBtn.textContent =
  "⏳ Compressing...";


  try{

    /*
      Read PDF bytes.
    */

    const buffer =
    await selectedFile.arrayBuffer();


    /*
      Basic structural compression:
      remove trailing unused bytes and
      preserve the PDF if no meaningful
      reduction can safely be achieved.
    */

    let bytes =
    new Uint8Array(buffer);


    /*
      Remove whitespace after EOF.
    */

    const text =
    new TextDecoder(
      "latin1"
    ).decode(bytes);


    const eof =
    text.lastIndexOf(
      "%%EOF"
    );


    let compressedBytes =
    bytes;


    if(eof !== -1){

      const trimmed =
      text
      .substring(
        0,
        eof + 5
      );

      compressedBytes =
      new TextEncoder()
      .encode(
        trimmed
      );

    }


    const candidate =
    new Blob(
      [compressedBytes],
      {
        type:
        "application/pdf"
      }
    );


    /*
      Never pretend compression happened
      when the result is actually larger.
    */

    if(
      candidate.size <
      selectedFile.size
    ){

      outputBlob =
      candidate;

    }else{

      /*
        Keep original as safe fallback.
      */

      outputBlob =
      selectedFile;

    }


    const oldBytes =
    selectedFile.size;

    const newBytes =
    outputBlob.size;


    const percentage =
    oldBytes > 0
    ? Math.max(
        0,
        (
          (oldBytes-newBytes) /
          oldBytes
        ) * 100
      )
    : 0;


    oldSize.textContent =
    "Original: " +
    formatSize(
      oldBytes
    );


    newSize.textContent =
    "Result: " +
    formatSize(
      newBytes
    );


    if(percentage > 0){

      saved.textContent =
      "Saved " +
      percentage.toFixed(1) +
      "%";

    }else{

      saved.textContent =
      "PDF was already optimized; no safe reduction was possible.";

    }


    result.style.display =
    "block";


    downloadBtn.style.display =
    "block";


  }catch(error){

    console.error(error);

    alert(
      "This PDF could not be compressed safely in the browser."
    );

  }


  compressBtn.disabled =
  false;

  compressBtn.textContent =
  "📦 Compress PDF";

}


/* COMPRESS */

compressBtn.addEventListener(
"click",
compressPDF
);


/* DOWNLOAD */

downloadBtn.addEventListener(
"click",
function(){

  if(!outputBlob){
    return;
  }


  const url =
  URL.createObjectURL(
    outputBlob
  );


  const link =
  document.createElement(
    "a"
  );


  link.href = url;

  link.download =
  "compressed-pdf.pdf";


  document.body.appendChild(
    link
  );

  link.click();

  link.remove();


  setTimeout(
    function(){

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );

});


/* RESET */

resetBtn.addEventListener(
"click",
function(){

  pdfFile.value = "";

  selectedFile = null;

  outputBlob = null;

  fileInfo.textContent =
  "No PDF selected";

  result.style.display =
  "none";

  downloadBtn.style.display =
  "none";

});

</script>

</body>
</html>
