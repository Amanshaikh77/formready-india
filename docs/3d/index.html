<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FormReady India - 3D Vertical Spatial Wheel</title>
  <meta name="description" content="Next-gen 3D spatial vertical wheel for FormReady India tools.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #080604;
      --amber: #f5a623;
      --card-bg: #140f0a;
      --card-border: rgba(245, 166, 35, 0.4);
      --paper: #f8f4ec;
      --muted: #a0907e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 50%, #221508 0%, #080604 85%);
      color: var(--paper);
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top Navigation */
    .top-header {
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-badge {
      width: 36px;
      height: 36px;
      background: rgba(245, 166, 35, 0.15);
      border: 1.5px solid var(--amber);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 12px rgba(245, 166, 35, 0.35);
    }
    .brand-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .brand-text span { color: var(--amber); }

    .switch-btn {
      background: #17110c;
      border: 1.5px solid rgba(245, 166, 35, 0.5);
      color: var(--amber);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .switch-btn:active {
      background: var(--amber);
      color: #000;
    }

    /* Stage */
    .stage-3d {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      position: relative;
      overflow: hidden;
    }

    .wheel-wrapper {
      position: relative;
      width: 280px;
      height: 330px;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 480px) {
      .wheel-wrapper {
        width: 320px;
        height: 360px;
      }
    }

    /* Vertical Cards */
    .vertical-card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 22px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.95);
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease, border-color 0.3s ease;
      will-change: transform, opacity;
      backface-visibility: hidden;
      overflow: hidden;
    }

    .card-indicator {
      font-size: 10px;
      font-weight: 800;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .card-icon-box {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: rgba(245, 166, 35, 0.1);
      border: 1.5px solid rgba(245, 166, 35, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .card-category {
      font-size: 11px;
      font-weight: 800;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: auto;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta-count {
      font-size: 11px;
      font-weight: 700;
      color: rgba(245, 166, 35, 0.6);
      margin-top: 6px;
    }

    /* Active Highlight */
    .vertical-card.is-center {
      border-color: var(--amber);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 32px rgba(245, 166, 35, 0.45);
      z-index: 10;
    }

    /* Circle Open Button on Right of Center Card */
    .circle-open-btn {
      position: absolute;
      right: -32px;
      top: 50%;
      transform: translateY(-50%);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffb84d, #f5a623 60%, #b86e06 100%);
      border: 3px solid #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #080604;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 10.5px;
      line-height: 1.1;
      letter-spacing: 0.5px;
      box-shadow: 0 0 25px rgba(245, 166, 35, 0.8), 0 8px 25px rgba(0,0,0,0.8);
      z-index: 20;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: pulseBtn 2s infinite alternate;
    }
    @media (max-width: 360px) {
      .circle-open-btn { right: -20px; width: 56px; height: 56px; font-size: 9.5px; }
    }
    .circle-open-btn:active {
      transform: translateY(-50%) scale(0.92);
    }
    .circle-open-btn span { font-size: 15px; margin-bottom: 1px; }

    @keyframes pulseBtn {
      0% { box-shadow: 0 0 16px rgba(245, 166, 35, 0.6); }
      100% { box-shadow: 0 0 30px rgba(255, 184, 77, 0.95), 0 0 10px rgba(255,255,255,0.8); }
    }

    /* Vertical Quick Arrows */
    .vertical-controls {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 30;
    }
    .v-arrow-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #17110c;
      border: 1.5px solid rgba(245, 166, 35, 0.4);
      color: var(--amber);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .v-arrow-btn:active {
      background: var(--amber);
      color: #000;
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-header">
    <a href="../" class="brand-group">
      <div class="brand-badge">⚡</div>
      <div class="brand-text">FormReady <span>3D</span></div>
    </a>
    <a href="../" class="switch-btn" onclick="window.location.href='../'; return false;">
      ◀ 2D Dashboard
    </a>
  </div>

  <div class="stage-3d" id="stage">
    <!-- Quick Vertical Switch Arrows -->
    <div class="vertical-controls">
      <button class="v-arrow-btn" onclick="moveWheel(-1)" title="Next Tool">▲</button>
      <button class="v-arrow-btn" onclick="moveWheel(1)" title="Previous Tool">▼</button>
    </div>

    <!-- 3D Wheel Container -->
    <div class="wheel-wrapper" id="wheelWrapper">
      <div id="deck"></div>

      <!-- Circle Open Button on Right of Center Tool -->
      <a href="#" class="circle-open-btn" id="circleOpenBtn">
        <span>⚡</span>
        OPEN
      </a>
    </div>
  </div>

<script>
const TOOLS = [
  { slug: "aadhaar-pan-resizer", name: "ID Card to A4 Print", icon: "🪪", cat: "Govt Utility", desc: "Auto-crop front & back sides into clean top-aligned A4 print-ready PDF." },
  { slug: "background-remover", name: "AI Background Remover", icon: "🪄", cat: "Photo AI", desc: "Make photo background white or transparent in 1-click for exam forms." },
  { slug: "photo-sheet", name: "Passport Photo Sheet", icon: "🖨️", cat: "Photo Suite", desc: "Generate 6, 8, or 16 photo studio passport sheets ready to print." },
  { slug: "document-scanner", name: "HD Document Cam Scanner", icon: "📷", cat: "Govt Utility", desc: "Scan certificates via mobile camera with auto black & white filter." },
  { slug: "pdf-editor", name: "PDF Editor & Markup", icon: "📝", cat: "PDF Suite", desc: "Annotate, highlight, draw signatures and modify PDF pages offline." },
  { slug: "photo-compressor", name: "Photo Compressor (KB)", icon: "🗜️", cat: "Optimization", desc: "Compress image file size up to 80% without losing sharpness." },
  { slug: "photo-cropper", name: "Photo Cropper Ratios", icon: "✂️", cat: "Optimization", desc: "Crop photos with custom aspect ratios (1:1, 3.5x4.5cm) effortlessly." },
  { slug: "image-converter", name: "Image Format Converter", icon: "🔄", cat: "Optimization", desc: "Lossless conversion between JPG, PNG, WEBP, and ICO formats." },
  { slug: "barcode-generator", name: "Barcode Studio & Scan", icon: "🏷️", cat: "Text & Utilities", desc: "Generate Code128 barcodes or scan codes live with camera." },
  { slug: "qr-generator", name: "HD QR Code Generator", icon: "📱", cat: "Text & Utilities", desc: "Create high-res QR codes for URLs, WiFi logins, and UPI links." },
  { slug: "pdf-organizer", name: "PDF Page Organizer", icon: "📑", cat: "PDF Suite", desc: "Drag-and-drop to reorder, rotate or delete pages in any PDF document." },
  { slug: "age-calculator", name: "Govt Form Age Calculator", icon: "🎂", cat: "Smart Calculator", desc: "Calculate exact age on cut-off eligibility dates in Years, Months, Days." },
  { slug: "emi-calculator", name: "Loan EMI & Interest", icon: "💳", cat: "Smart Calculator", desc: "Calculate monthly installments and visual payment proportions." },
  { slug: "discount-calculator", name: "Percentage & Discount", icon: "🏷️", cat: "Smart Calculator", desc: "Calculate festive shopping discounts, money saved and final price." },
  { slug: "bmi-calculator", name: "BMI & Health Status", icon: "⚖️", cat: "Smart Calculator", desc: "Calculate Body Mass Index with gradient meter and healthy weight target." },
  { slug: "date-gap-calculator", name: "Date Gap & Working Days", icon: "📅", cat: "Smart Calculator", desc: "Count total days between dates and exclude weekends automatically." },
  { slug: "unit-converter", name: "Land & Unit Converter", icon: "🌾", cat: "Smart Calculator", desc: "Convert Indian land units (Bigha, Guntha, Acre, Gaj) and metrics." },
  { slug: "text-cleaner", name: "Text Cleaner & Fixer", icon: "🧹", cat: "Text & Utilities", desc: "Remove duplicate spaces, line breaks, and messy form formatting." },
  { slug: "case-converter", name: "Case Converter (aA)", icon: "🔠", cat: "Text & Utilities", desc: "Convert text to UPPERCASE, lowercase, Title Case or camelCase." },
  { slug: "word-counter", name: "Word & Essay Counter", icon: "📊", cat: "Text & Utilities", desc: "Real-time character count, word density and reading time stats." },
  { slug: "text-to-pdf", name: "Text to PDF Generator", icon: "📄", cat: "PDF Suite", desc: "Convert notes and code snippets into printable A4 PDFs." },
  { slug: "signature-maker", name: "Digital Signature Draw", icon: "🖊️", cat: "Govt Utility", desc: "Draw ultra-smooth signature on mobile and get transparent PNG." },
  { slug: "gst-calculator", name: "GST Calculator (CGST)", icon: "💰", cat: "Smart Calculator", desc: "Calculate GST Inclusive & Exclusive amounts across tax slabs." },
  { slug: "currency-converter", name: "Live Currency Converter", icon: "💱", cat: "Smart Calculator", desc: "Quick live conversion estimates for USD, EUR, GBP to INR rates." }
];

let currentIndex = 0;
const deck = document.getElementById("deck");
const circleOpenBtn = document.getElementById("circleOpenBtn");
let isScrolling = false;

function buildCards() {
  deck.innerHTML = "";
  TOOLS.forEach((tool, i) => {
    const card = document.createElement("div");
    card.className = "vertical-card";
    card.id = `v-card-${i}`;
    card.innerHTML = `
      <div class="card-indicator" id="tag-${i}">CURRENT TOOL</div>
      <div class="card-icon-box">${tool.icon}</div>
      <div class="card-category">${tool.cat}</div>
      <div class="card-title">${tool.name}</div>
      <div class="card-desc">${tool.desc}</div>
      <div class="card-meta-count">${i + 1} of ${TOOLS.length}</div>
    `;

    card.addEventListener("click", () => {
      if (currentIndex === i) {
        window.location.href = `../tools/${tool.slug}/index.html`;
      } else {
        currentIndex = i;
        updateWheel();
      }
    });

    deck.appendChild(card);
  });
  updateWheel();
}

function updateWheel() {
  const total = TOOLS.length;

  for (let i = 0; i < total; i++) {
    const card = document.getElementById(`v-card-${i}`);
    const tag = document.getElementById(`tag-${i}`);
    let offset = i - currentIndex;

    if (offset > total / 2) offset -= total;
    if (offset < -total / 2) offset += total;

    card.classList.toggle("is-center", offset === 0);

    if (offset === 0) {
      // Current Tool (Center)
      card.style.display = "flex";
      card.style.transform = "translate3d(0, 0, 0) rotateX(0deg) scale(1)";
      card.style.opacity = "1";
      card.style.zIndex = "10";
      tag.innerText = "CURRENT TOOL";
      tag.style.color = "var(--amber)";
      card.style.pointerEvents = "auto";
    } else if (offset === -1) {
      // Next Tool (Top Tilt)
      card.style.display = "flex";
      card.style.transform = "translate3d(0, -185px, -110px) rotateX(32deg) scale(0.85)";
      card.style.opacity = "0.5";
      card.style.zIndex = "5";
      tag.innerText = "NEXT TOOL ▲";
      tag.style.color = "#a0907e";
      card.style.pointerEvents = "auto";
    } else if (offset === 1) {
      // Previous Tool (Bottom Tilt)
      card.style.display = "flex";
      card.style.transform = "translate3d(0, 185px, -110px) rotateX(-32deg) scale(0.85)";
      card.style.opacity = "0.5";
      card.style.zIndex = "5";
      tag.innerText = "PREVIOUS TOOL ▼";
      tag.style.color = "#a0907e";
      card.style.pointerEvents = "auto";
    } else {
      // Hide all other cards for zero lag and zero overlap
      card.style.display = "none";
      card.style.opacity = "0";
      card.style.pointerEvents = "none";
    }
  }

  // Update Circle Open Button
  const activeTool = TOOLS[currentIndex];
  circleOpenBtn.href = `../tools/${activeTool.slug}/index.html`;
}

function moveWheel(dir) {
  currentIndex = (currentIndex + dir + TOOLS.length) % TOOLS.length;
  updateWheel();
}

// Wheel Scroll (Center Vertical Snapping)
window.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (isScrolling) return;
  isScrolling = true;

  if (e.deltaY > 0) moveWheel(1);
  else moveWheel(-1);

  setTimeout(() => { isScrolling = false; }, 240);
}, { passive: false });

// Touch Swipe Up/Down
let touchStartY = 0;
window.addEventListener("touchstart", (e) => {
  touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener("touchend", (e) => {
  const diffY = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(diffY) > 35) {
    moveWheel(diffY < 0 ? 1 : -1);
  }
}, { passive: true });

// Keyboard Navigation
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") moveWheel(1);
  if (e.key === "ArrowUp") moveWheel(-1);
  if (e.key === "Enter") {
    window.location.href = `../tools/${TOOLS[currentIndex].slug}/index.html`;
  }
});

buildCards();
</script>
</body>
</html>
