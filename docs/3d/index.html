<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FormReady India - 3D Spatial Deck</title>
  <meta name="description" content="Next-gen 3D spatial interactive deck for FormReady India tools.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090705;
      --amber: #f5a623;
      --card-bg: #140f0a;
      --card-border: rgba(245, 166, 35, 0.4);
      --paper: #f8f4ec;
      --muted: #a0907e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 30%, #201408 0%, #090705 85%);
      color: var(--paper);
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Top Navigation */
    .top-header {
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-badge {
      width: 36px;
      height: 36px;
      background: rgba(245, 166, 35, 0.15);
      border: 1.5px solid var(--amber);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 12px rgba(245, 166, 35, 0.35);
    }
    .brand-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .brand-text span { color: var(--amber); }

    /* Reliable 2D Back Button */
    .switch-btn {
      background: #17110c;
      border: 1.5px solid rgba(245, 166, 35, 0.5);
      color: var(--amber);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      z-index: 120;
    }
    .switch-btn:active {
      background: var(--amber);
      color: #000;
    }

    /* 3D Stage */
    .stage-3d {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 900px;
      position: relative;
      overflow: hidden;
      padding-bottom: 90px; /* Space for elevated bottom controls */
    }

    .scroll-guide {
      position: absolute;
      top: 64px;
      font-size: 11px;
      color: var(--muted);
      background: rgba(245, 166, 35, 0.08);
      border: 1px solid rgba(245, 166, 35, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      z-index: 10;
    }

    /* Deck Container */
    .deck-container {
      position: relative;
      width: 270px;
      height: 350px;
      transform-style: preserve-3d;
      margin-top: -10px;
    }

    @media (min-width: 480px) {
      .deck-container {
        width: 320px;
        height: 390px;
      }
    }

    .deck-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease, border-color 0.25s ease;
      will-change: transform, opacity;
      backface-visibility: hidden;
      overflow: hidden;
    }

    .card-icon-box {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: rgba(245, 166, 35, 0.1);
      border: 1.5px solid rgba(245, 166, 35, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .card-category {
      font-size: 11px;
      font-weight: 800;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .card-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: auto;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta-count {
      font-size: 11px;
      font-weight: 700;
      color: rgba(245, 166, 35, 0.6);
      margin-top: 8px;
    }

    .deck-card.active-center {
      border-color: var(--amber);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95), 0 0 32px rgba(245, 166, 35, 0.45);
      z-index: 10;
    }

    /* Fixed Elevated Bottom Controller (Above Android Navigation bar) */
    .bottom-bar {
      position: absolute;
      bottom: calc(34px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }

    .nav-arrow {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #18120c;
      border: 1.5px solid rgba(245, 166, 35, 0.45);
      color: var(--amber);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .nav-arrow:active {
      transform: scale(0.92);
      background: var(--amber);
      color: #000;
    }

    .btn-launch {
      flex: 1;
      height: 48px;
      background: linear-gradient(135deg, #f5a623, #d97706);
      color: #0c0a08;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14.5px;
      font-weight: 800;
      border-radius: 12px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(245, 166, 35, 0.4);
      transition: transform 0.2s;
    }
    .btn-launch:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="top-header">
    <a href="../" class="brand-group">
      <div class="brand-badge">⚡</div>
      <div class="brand-text">FormReady <span>3D</span></div>
    </a>
    <a href="../" class="switch-btn" onclick="window.location.href='../'; return false;">
      ◀ 2D Dashboard
    </a>
  </div>

  <div class="stage-3d" id="stage">
    <div class="scroll-guide">Swipe or Scroll Wheel • 1-by-1 Flow</div>
    <div class="deck-container" id="deck"></div>

    <div class="bottom-bar">
      <button class="nav-arrow" onclick="moveSlide(-1)">◀</button>
      <a href="#" class="btn-launch" id="launchBtn">⚡ Launch Tool</a>
      <button class="nav-arrow" onclick="moveSlide(1)">▶</button>
    </div>
  </div>

<script>
const TOOLS = [
  { slug: "aadhaar-pan-resizer", name: "ID Card to A4 Print", icon: "🪪", cat: "Govt Utility", desc: "Auto-crop front & back sides into clean top-aligned A4 print-ready PDF." },
  { slug: "background-remover", name: "AI Background Remover", icon: "🪄", cat: "Photo AI", desc: "Make photo background white or transparent in 1-click for exam forms." },
  { slug: "photo-sheet", name: "Passport Photo Sheet", icon: "🖨️", cat: "Photo Suite", desc: "Generate 6, 8, or 16 photo studio passport sheets ready to print." },
  { slug: "document-scanner", name: "HD Document Cam Scanner", icon: "📷", cat: "Govt Utility", desc: "Scan certificates via mobile camera with auto black & white filter." },
  { slug: "pdf-editor", name: "PDF Editor & Markup", icon: "📝", cat: "PDF Suite", desc: "Annotate, highlight, draw signatures and modify PDF pages offline." },
  { slug: "photo-compressor", name: "Photo Compressor (KB)", icon: "🗜️", cat: "Optimization", desc: "Compress image file size up to 80% without losing sharpness." },
  { slug: "photo-cropper", name: "Photo Cropper Ratios", icon: "✂️", cat: "Optimization", desc: "Crop photos with custom aspect ratios (1:1, 3.5x4.5cm) effortlessly." },
  { slug: "image-converter", name: "Image Format Converter", icon: "🔄", cat: "Optimization", desc: "Lossless conversion between JPG, PNG, WEBP, and ICO formats." },
  { slug: "barcode-generator", name: "Barcode Studio & Scan", icon: "🏷️", cat: "Text & Utilities", desc: "Generate Code128 barcodes or scan codes live with camera." },
  { slug: "qr-generator", name: "HD QR Code Generator", icon: "📱", cat: "Text & Utilities", desc: "Create high-res QR codes for URLs, WiFi logins, and UPI links." },
  { slug: "pdf-organizer", name: "PDF Page Organizer", icon: "📑", cat: "PDF Suite", desc: "Drag-and-drop to reorder, rotate or delete pages in any PDF document." },
  { slug: "age-calculator", name: "Govt Form Age Calculator", icon: "🎂", cat: "Smart Calculator", desc: "Calculate exact age on cut-off eligibility dates in Years, Months, Days." },
  { slug: "emi-calculator", name: "Loan EMI & Interest", icon: "💳", cat: "Smart Calculator", desc: "Calculate monthly installments and visual payment proportions." },
  { slug: "discount-calculator", name: "Percentage & Discount", icon: "🏷️", cat: "Smart Calculator", desc: "Calculate festive shopping discounts, money saved and final price." },
  { slug: "bmi-calculator", name: "BMI & Health Status", icon: "⚖️", cat: "Smart Calculator", desc: "Calculate Body Mass Index with gradient meter and healthy weight target." },
  { slug: "date-gap-calculator", name: "Date Gap & Working Days", icon: "📅", cat: "Smart Calculator", desc: "Count total days between dates and exclude weekends automatically." },
  { slug: "unit-converter", name: "Land & Unit Converter", icon: "🌾", cat: "Smart Calculator", desc: "Convert Indian land units (Bigha, Guntha, Acre, Gaj) and metrics." },
  { slug: "text-cleaner", name: "Text Cleaner & Fixer", icon: "🧹", cat: "Text & Utilities", desc: "Remove duplicate spaces, line breaks, and messy form formatting." },
  { slug: "case-converter", name: "Case Converter (aA)", icon: "🔠", cat: "Text & Utilities", desc: "Convert text to UPPERCASE, lowercase, Title Case or camelCase." },
  { slug: "word-counter", name: "Word & Essay Counter", icon: "📊", cat: "Text & Utilities", desc: "Real-time character count, word density and reading time stats." },
  { slug: "text-to-pdf", name: "Text to PDF Generator", icon: "📄", cat: "PDF Suite", desc: "Convert notes and code snippets into printable A4 PDFs." },
  { slug: "signature-maker", name: "Digital Signature Draw", icon: "🖊️", cat: "Govt Utility", desc: "Draw ultra-smooth signature on mobile and get transparent PNG." },
  { slug: "gst-calculator", name: "GST Calculator (CGST)", icon: "💰", cat: "Smart Calculator", desc: "Calculate GST Inclusive & Exclusive amounts across tax slabs." },
  { slug: "currency-converter", name: "Live Currency Converter", icon: "💱", cat: "Smart Calculator", desc: "Quick live conversion estimates for USD, EUR, GBP to INR rates." }
];

let currentIndex = 0;
const deck = document.getElementById("deck");
const launchBtn = document.getElementById("launchBtn");
let isScrolling = false;

function buildCards() {
  deck.innerHTML = "";
  TOOLS.forEach((tool, i) => {
    const card = document.createElement("div");
    card.className = "deck-card";
    card.id = `card-${i}`;
    card.innerHTML = `
      <div class="card-icon-box">${tool.icon}</div>
      <div class="card-category">${tool.cat}</div>
      <div class="card-title">${tool.name}</div>
      <div class="card-desc">${tool.desc}</div>
      <div class="card-meta-count">${i + 1} of ${TOOLS.length}</div>
    `;

    card.addEventListener("click", () => {
      if (currentIndex === i) {
        window.location.href = `../tools/${tool.slug}/index.html`;
      } else {
        currentIndex = i;
        updateDeck();
      }
    });

    deck.appendChild(card);
  });
  updateDeck();
}

function updateDeck() {
  const total = TOOLS.length;

  for (let i = 0; i < total; i++) {
    const card = document.getElementById(`card-${i}`);
    let offset = i - currentIndex;

    if (offset > total / 2) offset -= total;
    if (offset < -total / 2) offset += total;

    card.classList.toggle("active-center", offset === 0);

    if (offset === 0) {
      card.style.display = "flex";
      card.style.transform = "translate3d(0, 0, 0) scale(1)";
      card.style.opacity = "1";
      card.style.zIndex = "10";
      card.style.pointerEvents = "auto";
    } else if (Math.abs(offset) === 1) {
      const dir = offset > 0 ? 1 : -1;
      card.style.display = "flex";
      card.style.transform = `translate3d(${dir * 150}px, 0, -120px) rotateY(${-dir * 35}deg) scale(0.88)`;
      card.style.opacity = "0.5";
      card.style.zIndex = "5";
      card.style.pointerEvents = "auto";
    } else if (Math.abs(offset) === 2) {
      const dir = offset > 0 ? 1 : -1;
      card.style.display = "flex";
      card.style.transform = `translate3d(${dir * 220}px, 0, -220px) rotateY(${-dir * 45}deg) scale(0.74)`;
      card.style.opacity = "0.2";
      card.style.zIndex = "2";
      card.style.pointerEvents = "none";
    } else {
      card.style.display = "none";
      card.style.opacity = "0";
      card.style.pointerEvents = "none";
    }
  }

  const activeTool = TOOLS[currentIndex];
  launchBtn.href = `../tools/${activeTool.slug}/index.html`;
}

function moveSlide(dir) {
  currentIndex = (currentIndex + dir + TOOLS.length) % TOOLS.length;
  updateDeck();
}

window.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (isScrolling) return;
  isScrolling = true;

  if (e.deltaY > 0) moveSlide(1);
  else moveSlide(-1);

  setTimeout(() => { isScrolling = false; }, 260);
}, { passive: false });

let startX = 0;
let startY = 0;

window.addEventListener("touchstart", (e) => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener("touchend", (e) => {
  const diffX = e.changedTouches[0].clientX - startX;
  const diffY = e.changedTouches[0].clientY - startY;

  if (Math.abs(diffX) > 35 && Math.abs(diffX) > Math.abs(diffY)) {
    moveSlide(diffX < 0 ? 1 : -1);
  }
}, { passive: true });

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown") moveSlide(1);
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") moveSlide(-1);
  if (e.key === "Enter") {
    window.location.href = `../tools/${TOOLS[currentIndex].slug}/index.html`;
  }
});

buildCards();
</script>
</body>
</html>
