/* Buttons */

button{

<body>

</header>

<a class="breadcrumb" href="/formready-india/index.html#tools">‹ Back to Tools</a>

<div class="container">

  <div class="card">
    <div class="card-head">
      <div class="icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="9" y1="13" x2="15" y2="13"/>
          <line x1="9" y1="17" x2="15" y2="17"/>
        </svg>
      </div>
      <h1>JPG to PDF</h1>
      <p>Convert your JPG images into a PDF easily</p>
    </div>

    <div class="upload-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <p class="upload-title">Choose JPG Images</p>
      <p class="upload-hint">Select one or multiple images</p>
      <label class="btn-choose" for="fileInput">Browse Files</label>
      <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png" multiple hidden>
    </div>
  </div>

  <div class="card">
    <div class="options">
      <div class="field">
        <label for="pageSize">PDF Page Size</label>
        <select id="pageSize">
          <option value="a4">A4</option>
          <option value="a5">A5</option>
          <option value="letter">Letter</option>
        </select>
      </div>

      <div class="field">
        <label for="orientation">Orientation</label>
        <select id="orientation">
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>

      <div class="field">
        <label for="margin">Margin</label>
        <select id="margin">
          <option value="5">5 mm</option>
          <option value="10" selected>10 mm</option>
          <option value="15">15 mm</option>
          <option value="20">20 mm</option>
        </select>
      </div>

      <div class="field">
        <label for="fit">Image Fit</label>
        <select id="fit">
          <option value="contain">Fit to Page</option>
          <option value="cover">Fill Page</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card" id="previewCard" style="display:none">
    <h3 style="margin:0 0 4px;font-size:16px;">Selected Images</h3>
    <div class="preview" id="preview"></div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div class="buttons">
      <button class="primary" id="convertBtn">Convert to PDF</button>
      <button class="secondary" id="clearBtn">Reset</button>
    </div>
  </div>

  <div class="ad-slot">
    <div class="ad-box">Advertisement</div>
  </div>

  <footer class="credit">Built with Termux · hosted on GitHub Pages</footer>

</div>

<script>

const {
  jsPDF
} = window.jspdf;

const fileInput =
  document.getElementById("fileInput");

const previewCard =
  document.getElementById("previewCard");

const preview =
  document.getElementById("preview");

const status =
  document.getElementById("status");

const convertBtn =
  document.getElementById("convertBtn");

const clearBtn =
  document.getElementById("clearBtn");

const pageSize =
  document.getElementById("pageSize");

const orientation =
  document.getElementById("orientation");

const margin =
  document.getElementById("margin");

const fit =
  document.getElementById("fit");

let files = [];


/* =========================
   IMAGE LOADER
========================= */

function loadImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload = function(e){

      const img = new Image();

      img.onload = function(){

        resolve(img);

      };

      img.onerror = function(){

        reject(
          new Error("Image could not be loaded")
        );

      };

      img.src = e.target.result;

    };

    reader.onerror = function(){

      reject(
        new Error("File could not be read")
      );

    };

    reader.readAsDataURL(file);

  });

}


/* =========================
   FILE SELECT
========================= */

fileInput.addEventListener(
  "change",
  function(){

    files =
      Array.from(this.files);

    preview.innerHTML = "";

    if(files.length === 0){

      previewCard.style.display =
        "none";

      return;

    }

    previewCard.style.display =
      "block";

    status.textContent =
      files.length +
      " image" +
      (files.length > 1 ? "s" : "") +
      " selected";

    files.forEach(function(file,index){

      const item =
        document.createElement("div");

      item.className =
        "preview-item";

      const img =
        document.createElement("img");

      const name =
        document.createElement("div");

      name.textContent =
        (index + 1) +
        ". " +
        file.name;

      const reader =
        new FileReader();

      reader.onload =
        function(e){

          img.src =
            e.target.result;

        };

      reader.readAsDataURL(file);

      item.appendChild(img);
      item.appendChild(name);

      preview.appendChild(item);
    });

  }
);


/* =========================
   PAGE SIZE
========================= */

function getPageDimensions(){

  let size =
    pageSize.value;

  let width;
  let height;

  if(size === "a5"){

    width = 148;
    height = 210;

  }else if(size === "letter"){

    width = 215.9;
    height = 279.4;

  }else{

    width = 210;
    height = 297;

  }

  if(
    orientation.value ===
    "landscape"
  ){

    const temp = width;

    width = height;
    height = temp;

  }

  return {
    width,
    height
  };

}


/* =========================
   ADD IMAGE TO PDF
========================= */

function addImageToPDF(
  pdf,
  img,
  pageWidth,
  pageHeight,
  marginMM
){

  const availableWidth =
    pageWidth -
    marginMM * 2;

  const availableHeight =
    pageHeight -
    marginMM * 2;

  const imageWidth =
    img.naturalWidth ||
    img.width;

  const imageHeight =
    img.naturalHeight ||
    img.height;

  if(!imageWidth || !imageHeight){

    throw new Error(
      "Invalid image dimensions"
    );

  }

  const imageRatio =
    imageWidth /
    imageHeight;

  const pageRatio =
    availableWidth /
    availableHeight;

  let drawWidth;
  let drawHeight;

  if(fit.value === "cover"){

    if(imageRatio > pageRatio){

      drawHeight =
        availableHeight;

      drawWidth =
        drawHeight *
        imageRatio;

    }else{

      drawWidth =
        availableWidth;

      drawHeight =
        drawWidth /
        imageRatio;

    }

  }else{

    if(imageRatio > pageRatio){

      drawWidth =
        availableWidth;

      drawHeight =
        drawWidth /
        imageRatio;

    }else{

      drawHeight =
        availableHeight;

      drawWidth =
        drawHeight *
        imageRatio;

    }

  }

  let x =
    (pageWidth -
     drawWidth) / 2;

  let y =
    (pageHeight -
     drawHeight) / 2;

  pdf.addImage(
    img,
    "JPEG",
    x,
    y,
    drawWidth,
    drawHeight,
    undefined,
    "FAST"
  );

}


/* =========================
   CONVERT
========================= */

convertBtn.addEventListener(
  "click",
  async function(){

    if(files.length === 0){

      alert(
        "Please choose at least one JPG image."
      );

      return;

    }

    convertBtn.disabled = true;

    convertBtn.textContent =
      "Creating PDF...";

    try{

      const dimensions =
        getPageDimensions();

      const marginMM =
        Number(margin.value);

      const pdf =
        new jsPDF({

          orientation:
            orientation.value,

          unit:"mm",

          format:[
            dimensions.width,
            dimensions.height
          ],

          compress:true

        });


      for(
        let i=0;
        i<files.length;
        i++
      ){

        status.textContent =
          "Processing image " +
          (i+1) +
          " of " +
          files.length +
          "...";

        const img =
          await loadImage(
            files[i]
          );


        if(i > 0){

          pdf.addPage(
            [
              dimensions.width,
              dimensions.height
            ],
            orientation.value
          );

        }

        pdf.setFillColor(
          255,
          255,
          255
        );

        pdf.rect(
          0,
          0,
          dimensions.width,
          dimensions.height,
          "F"
        );

        addImageToPDF(
          pdf,
          img,
          dimensions.width,
          dimensions.height,
          marginMM
        );

      }


      status.textContent =
        "PDF created successfully!";


      pdf.save(
        "converted-images.pdf"
      );


    }catch(error){

      console.error(error);

      alert(
        "PDF creation failed. Please try another JPG image."
      );

      status.textContent =
        "PDF creation failed.";

    }


    convertBtn.disabled = false;

    convertBtn.textContent =
      "Convert to PDF";

  }
);


/* =========================
   RESET
========================= */

clearBtn.addEventListener(
  "click",
  function(){

    files = [];

    fileInput.value = "";

    preview.innerHTML = "";

    previewCard.style.display =
      "none";

    status.textContent = "";

  }
);

</script>


<script>
document.addEventListener("DOMContentLoaded", function() {
  const rewardKey = "formready_reward_jpg-to-pdf_" + new Date().toISOString().slice(0,10);

  function rewardUser() {
    if (localStorage.getItem(rewardKey)) return;
    if (window.FormReadyTokens) {
      window.FormReadyTokens.addTokens("jpg-to-pdf");
    }
  }

  document.querySelectorAll(
    '#download, #downloadBtn, #downloadButton, button[id*="download" i], a[id*="download" i]'
  ).forEach(function(btn) {
    btn.addEventListener("click", function() {
      setTimeout(rewardUser, 1000);
    });
  });

  const originalAlert = window.alert;
  window.alert = function(msg) {
    if (msg && /download|success|created|converted|compressed|generated|saved/i.test(String(msg))) {
      setTimeout(rewardUser, 500);
    }
    originalAlert.apply(window, arguments);
  };
});
</script>

</body>
