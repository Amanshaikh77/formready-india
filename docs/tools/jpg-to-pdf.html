<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">



<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#202124;
}

.container{
  width:min(760px,94%);
  margin:25px auto 50px;
}

.header{
  text-align:center;
  margin-bottom:22px;
}

.header h1{
  margin:0;
  font-size:32px;
}

.header p{
  color:#6b7280;
  font-size:16px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
}

.upload{
  display:block;
  text-align:center;
  padding:28px 15px;
  border:3px dashed #6078d8;
  border-radius:16px;
  cursor:pointer;
  background:#fafbff;
}

.upload strong{
  display:block;
  font-size:20px;
  margin-bottom:6px;
}

.upload span{
  color:#70757a;
}

#fileInput{
  display:none;
}

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

select{
  width:100%;
  padding:13px;
  border:2px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-size:16px;
}

.preview{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.preview-item{
  background:#f1f3f5;
  border-radius:12px;
  padding:8px;
  text-align:center;
}

.preview-item img{
  display:block;
  width:100%;
  height:180px;
  object-fit:contain;
  background:white;
  border-radius:8px;
}

.preview-item div{
  font-size:13px;
  color:#666;
  margin-top:6px;
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#2867df;
  color:white;
}

.secondary{
  background:#e9edf2;
  color:#202124;
}

.status{
  text-align:center;
  margin-top:12px;
  color:#667085;
  font-size:14px;
}

@media(max-width:600px){

  .container{
    width:94%;
    margin-top:15px;
  }

  .header h1{
    font-size:28px;
  }

  .card{
    padding:16px;
  }

  .options{
    grid-template-columns:1fr;
  }

  .preview{
    grid-template-columns:1fr 1fr;
  }

  .preview-item img{
    height:140px;
  }
}
</style>
<title>JPG to PDF Converter Online - Convert Images to PDF | FormReady</title>
<meta name="description" content="Convert JPG and image files to PDF online for free. Easy JPG to PDF converter for forms, documents and applications.">
<link rel="canonical" href="https://formready.in/tools/jpg-to-pdf.html">
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📄 JPG to PDF</h1>
    <p>Convert your JPG images into a PDF easily</p>
  </div>

  <div class="card">

    <label class="upload" for="fileInput">
      <strong>📷 Choose JPG Images</strong>
      <span>Select one or multiple images</span>
    </label>

    <input
      type="file"
      id="fileInput"
      accept="image/jpeg,image/jpg,image/png"
      multiple
    >

  </div>

  <div class="card">

    <div class="options">

      <div>
        <label for="pageSize">PDF Page Size</label>

        <select id="pageSize">
          <option value="a4">A4</option>
          <option value="a5">A5</option>
          <option value="letter">Letter</option>
        </select>
      </div>

      <div>
        <label for="orientation">Orientation</label>

        <select id="orientation">
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>

      <div>
        <label for="margin">Margin</label>

        <select id="margin">
          <option value="5">5 mm</option>
          <option value="10" selected>10 mm</option>
          <option value="15">15 mm</option>
          <option value="20">20 mm</option>
        </select>
      </div>

      <div>
        <label for="fit">Image Fit</label>

        <select id="fit">
          <option value="contain">Fit to Page</option>
          <option value="cover">Fill Page</option>
        </select>
      </div>

    </div>

  </div>

  <div class="card" id="previewCard" style="display:none">

    <h3>Selected Images</h3>

    <div class="preview" id="preview"></div>

    <div class="status" id="status"></div>

  </div>

  <div class="card">

    <div class="buttons">

      <button class="primary" id="convertBtn">
        📄 Convert to PDF
      </button>

      <button class="secondary" id="clearBtn">
        Reset
      </button>

    </div>

  </div>

</div>

<script>

const {
  jsPDF
} = window.jspdf;

const fileInput =
  document.getElementById("fileInput");

const previewCard =
  document.getElementById("previewCard");

const preview =
  document.getElementById("preview");

const status =
  document.getElementById("status");

const convertBtn =
  document.getElementById("convertBtn");

const clearBtn =
  document.getElementById("clearBtn");

const pageSize =
  document.getElementById("pageSize");

const orientation =
  document.getElementById("orientation");

const margin =
  document.getElementById("margin");

const fit =
  document.getElementById("fit");

let files = [];


/* =========================
   IMAGE LOADER
========================= */

function loadImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload = function(e){

      const img = new Image();

      img.onload = function(){

        resolve(img);

      };

      img.onerror = function(){

        reject(
          new Error("Image could not be loaded")
        );

      };

      /*
        IMPORTANT:
        Use Data URL instead of temporary
        object URL so jsPDF always receives
        a completely loaded image.
      */

      img.src = e.target.result;

    };

    reader.onerror = function(){

      reject(
        new Error("File could not be read")
      );

    };

    reader.readAsDataURL(file);

  });

}


/* =========================
   FILE SELECT
========================= */

fileInput.addEventListener(
  "change",
  function(){

    files =
      Array.from(this.files);

    preview.innerHTML = "";

    if(files.length === 0){

      previewCard.style.display =
        "none";

      return;

    }

    previewCard.style.display =
      "block";

    status.textContent =
      files.length +
      " image" +
      (files.length > 1 ? "s" : "") +
      " selected";

    files.forEach(function(file,index){

      const item =
        document.createElement("div");

      item.className =
        "preview-item";

      const img =
        document.createElement("img");

      const name =
        document.createElement("div");

      name.textContent =
        (index + 1) +
        ". " +
        file.name;

      const reader =
        new FileReader();

      reader.onload =
        function(e){

          img.src =
            e.target.result;

        };

      reader.readAsDataURL(file);

      item.appendChild(img);
      item.appendChild(name);

      preview.appendChild(item);

    });

  }
);


/* =========================
   PAGE SIZE
========================= */

function getPageDimensions(){

  let size =
    pageSize.value;

  let width;
  let height;

  if(size === "a5"){

    width = 148;
    height = 210;

  }else if(size === "letter"){

    width = 215.9;
    height = 279.4;

  }else{

    width = 210;
    height = 297;

  }

  if(
    orientation.value ===
    "landscape"
  ){

    const temp = width;

    width = height;
    height = temp;

  }

  return {
    width,
    height
  };

}


/* =========================
   ADD IMAGE TO PDF
========================= */

function addImageToPDF(
  pdf,
  img,
  pageWidth,
  pageHeight,
  marginMM
){

  const availableWidth =
    pageWidth -
    marginMM * 2;

  const availableHeight =
    pageHeight -
    marginMM * 2;

  const imageWidth =
    img.naturalWidth ||
    img.width;

  const imageHeight =
    img.naturalHeight ||
    img.height;

  if(!imageWidth || !imageHeight){

    throw new Error(
      "Invalid image dimensions"
    );

  }

  const imageRatio =
    imageWidth /
    imageHeight;

  const pageRatio =
    availableWidth /
    availableHeight;

  let drawWidth;
  let drawHeight;

  if(fit.value === "cover"){

    if(imageRatio > pageRatio){

      drawHeight =
        availableHeight;

      drawWidth =
        drawHeight *
        imageRatio;

    }else{

      drawWidth =
        availableWidth;

      drawHeight =
        drawWidth /
        imageRatio;

    }

  }else{

    /*
      FIT TO PAGE
    */

    if(imageRatio > pageRatio){

      drawWidth =
        availableWidth;

      drawHeight =
        drawWidth /
        imageRatio;

    }else{

      drawHeight =
        availableHeight;

      drawWidth =
        drawHeight *
        imageRatio;

    }

  }

  let x =
    (pageWidth -
     drawWidth) / 2;

  let y =
    (pageHeight -
     drawHeight) / 2;


  /*
    COVER MODE:
    Keep image centered and allow
    it to extend beyond the page.
  */

  pdf.addImage(
    img,
    "JPEG",
    x,
    y,
    drawWidth,
    drawHeight,
    undefined,
    "FAST"
  );

}


/* =========================
   CONVERT
========================= */

convertBtn.addEventListener(
  "click",
  async function(){

    if(files.length === 0){

      alert(
        "Please choose at least one JPG image."
      );

      return;

    }

    convertBtn.disabled = true;

    convertBtn.textContent =
      "⏳ Creating PDF...";

    try{

      const dimensions =
        getPageDimensions();

      const marginMM =
        Number(margin.value);

      const pdf =
        new jsPDF({

          orientation:
            orientation.value,

          unit:"mm",

          format:[
            dimensions.width,
            dimensions.height
          ],

          compress:true

        });


      for(
        let i=0;
        i<files.length;
        i++
      ){

        status.textContent =
          "Processing image " +
          (i+1) +
          " of " +
          files.length +
          "...";


        /*
          IMPORTANT:
          Wait for every image to fully load
          BEFORE adding it to jsPDF.
        */

        const img =
          await loadImage(
            files[i]
          );


        if(i > 0){

          pdf.addPage(
            [
              dimensions.width,
              dimensions.height
            ],
            orientation.value
          );

        }


        /*
          White background first.
          Prevents transparent/empty page issues.
        */

        pdf.setFillColor(
          255,
          255,
          255
        );

        pdf.rect(
          0,
          0,
          dimensions.width,
          dimensions.height,
          "F"
        );


        addImageToPDF(
          pdf,
          img,
          dimensions.width,
          dimensions.height,
          marginMM
        );

      }


      status.textContent =
        "PDF created successfully!";


      /*
        Generate and download only after
        every image has been added.
      */

      pdf.save(
        "converted-images.pdf"
      );


    }catch(error){

      console.error(error);

      alert(
        "PDF creation failed. Please try another JPG image."
      );

      status.textContent =
        "PDF creation failed.";

    }


    convertBtn.disabled = false;

    convertBtn.textContent =
      "📄 Convert to PDF";

  }
);


/* =========================
   RESET
========================= */

clearBtn.addEventListener(
  "click",
  function(){

    files = [];

    fileInput.value = "";

    preview.innerHTML = "";

    previewCard.style.display =
      "none";

    status.textContent = "";

  }
);

</script>

</body>
</html>
