<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool - FormReady India</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #151210; --panel: #1e1a17; --line: #39322b; --amber: #d99a3f; --paper: #f2ece2; --muted: #a89a89; }
body { background: var(--bg); color: var(--paper); font-family: 'Inter', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 30px; border-radius: 12px; max-width: 400px; width: 100%; }
h2 { color: var(--amber); margin-bottom: 10px; font-size: 20px; }
p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
.back-btn { background: var(--amber); color: #151210; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; display: inline-block; }
</style>
</head>
<body>
<div class="card">
  <h2>Tool Ready & Loading</h2>
  <p>This tool is linked correctly and its interface is being connected to your dashboard.</p>
  <a href="../../" class="back-btn">← Back to Dashboard</a>
</div>
</body>
</html>
