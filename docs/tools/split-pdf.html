<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Split PDF | FormReady India</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
color:#111827;
}

header{
background:#111827;
color:white;
padding:16px 6%;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:800;
}

.logo span{color:#60a5fa}

header a{
color:white;
text-decoration:none;
}

.container{
max-width:800px;
margin:auto;
padding:25px 15px;
}

.back{
color:#2563eb;
text-decoration:none;
font-weight:600;
}

.card{
background:white;
margin-top:18px;
padding:25px;
border-radius:22px;
box-shadow:0 10px 35px #0000000d;
}

h1{
text-align:center;
margin:5px 0;
}

.sub{
text-align:center;
color:#6b7280;
line-height:1.5;
}

.upload{
margin-top:25px;
border:2px dashed #93c5fd;
background:#eff6ff;
border-radius:18px;
padding:35px 15px;
text-align:center;
}

.upload input{display:none}

.choose{
display:inline-block;
background:#2563eb;
color:white;
padding:14px 24px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

#work{
display:none;
margin-top:25px;
}

.file-info{
padding:15px;
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:12px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:18px;
}

.field label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:7px;
}

.field input{
width:100%;
padding:13px;
border:1px solid #d1d5db;
border-radius:10px;
font-size:16px;
}

.range{
margin-top:18px;
}

.range input{
width:100%;
}

.buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

button{
border:0;
padding:13px 18px;
border-radius:11px;
font-weight:700;
cursor:pointer;
}

.primary{
background:#2563eb;
color:white;
}

.secondary{
background:#e5e7eb;
color:#111827;
}

.info{
margin-top:18px;
padding:14px;
background:#f1f5f9;
border-radius:12px;
font-size:13px;
color:#475569;
line-height:1.6;
}

.status{
margin-top:15px;
font-weight:600;
}

@media(max-width:600px){
.grid{grid-template-columns:1fr}
.card{padding:18px}
}
</style>
</head>

<body>

<header>
<div class="logo">
FormReady <span>India</span>
</div>
<a href="../">Home</a>
</header>

<div class="container">

<a class="back" href="../">← Back to Tools</a>

<div class="card">

<h1>📄 Split PDF</h1>

<p class="sub">
Extract selected pages from a PDF and download them as a new PDF.
</p>

<div class="upload">

<label class="choose" for="pdfFile">
📄 Choose PDF
</label>

<input
id="pdfFile"
type="file"
accept="application/pdf,.pdf"
>

<p>Select your PDF file</p>

</div>

<div id="work">

<div class="file-info" id="fileInfo"></div>

<div class="grid">

<div class="field">
<label>From Page</label>
<input id="fromPage" type="number" min="1" value="1">
</div>

<div class="field">
<label>To Page</label>
<input id="toPage" type="number" min="1" value="1">
</div>

</div>

<div class="range">

<label>
Page range
</label>

<input
id="pageRange"
type="range"
min="1"
max="1"
value="1"
>

</div>

<div class="buttons">

<button class="primary" id="splitBtn">
✂️ Split PDF
</button>

<button class="secondary" id="resetBtn">
Reset
</button>

</div>

<div class="status" id="status"></div>

<div class="info">
<b>Example:</b> If your PDF has 10 pages and you enter
From Page <b>3</b> and To Page <b>7</b>, the downloaded PDF will contain pages 3–7.
</div>

</div>

</div>

</div>

<script src="/js/pdf-lib.min.js"></script>

<script>

const pdfFile =
document.getElementById("pdfFile");

const work =
document.getElementById("work");

const fileInfo =
document.getElementById("fileInfo");

const fromPage =
document.getElementById("fromPage");

const toPage =
document.getElementById("toPage");

const pageRange =
document.getElementById("pageRange");

const splitBtn =
document.getElementById("splitBtn");

const resetBtn =
document.getElementById("resetBtn");

const status =
document.getElementById("status");

let selectedFile = null;
let totalPages = 0;


/* Select PDF */

pdfFile.addEventListener("change", async function(){

selectedFile = this.files[0];

if(!selectedFile){
return;
}

try{

const bytes =
await selectedFile.arrayBuffer();

const pdf =
await PDFLib.PDFDocument.load(bytes);

totalPages =
pdf.getPageCount();

fromPage.max =
totalPages;

toPage.max =
totalPages;

pageRange.max =
totalPages;

fromPage.value =
1;

toPage.value =
totalPages;

pageRange.value =
totalPages;

fileInfo.innerHTML =
"<b>File:</b> "
+
escapeHtml(selectedFile.name)
+
"<br>"
+
"<b>Pages:</b> "
+
totalPages
+
"<br>"
+
"<b>Size:</b> "
+
formatBytes(selectedFile.size);

work.style.display =
"block";

status.textContent =
"PDF loaded successfully.";

}catch(error){

alert(
"Could not read this PDF. It may be damaged or password protected."
);

}

});


/* Range control */

pageRange.addEventListener(
"input",
function(){

toPage.value =
this.value;

}
);


/* To page */

toPage.addEventListener(
"input",
function(){

let value =
parseInt(this.value);

if(
isNaN(value)
)value=1;

if(value>totalPages)
value=totalPages;

if(value<1)
value=1;

this.value=value;

pageRange.value=value;

}
);


/* Split */

splitBtn.addEventListener(
"click",
async function(){

if(!selectedFile){

alert("Please choose a PDF first.");

return;

}

let start =
parseInt(fromPage.value);

let end =
parseInt(toPage.value);

if(
start<1 ||
end>totalPages ||
start>end
){

alert("Please enter a valid page range.");

return;

}

try{

splitBtn.disabled =
true;

splitBtn.textContent =
"⏳ Creating PDF...";

status.textContent =
"Processing pages...";


const bytes =
await selectedFile.arrayBuffer();

const source =
await PDFLib.PDFDocument.load(bytes);

const output =
await PDFLib.PDFDocument.create();


const indexes=[];

for(
let i=start-1;
i<end;
i++
){

indexes.push(i);

}


const pages =
await output.copyPages(
source,
indexes
);


pages.forEach(
page=>{
output.addPage(page);
}
);


const pdfBytes =
await output.save();


const blob =
new Blob(
[pdfBytes],
{
type:"application/pdf"
}
);


const url =
URL.createObjectURL(blob);


const link =
document.createElement("a");

link.href =
url;

link.download =
"formready-split-pages-" +
start +
"-" +
end +
".pdf";

document.body.appendChild(link);

link.click();

link.remove();


setTimeout(
()=>{
URL.revokeObjectURL(url);
},
2000
);


status.textContent =
"✅ Split PDF created successfully. Download started.";

}catch(error){

console.error(error);

status.textContent =
"❌ Something went wrong.";

alert(
"Could not create the split PDF."
);

}


splitBtn.disabled =
false;

splitBtn.textContent =
"✂️ Split PDF";

});


/* Reset */

resetBtn.addEventListener(
"click",
function(){

pdfFile.value =
"";

selectedFile =
null;

totalPages =
0;

work.style.display =
"none";

status.textContent =
"";

}
);


/* Helpers */

function formatBytes(bytes){

if(bytes===0)
return "0 Bytes";

const units=[
"Bytes",
"KB",
"MB",
"GB"
];

const i =
Math.floor(
Math.log(bytes) /
Math.log(1024)
);

return (
bytes/
Math.pow(1024,i)
).toFixed(2)
+
" "
+
units[i];

}


function escapeHtml(text){

return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
