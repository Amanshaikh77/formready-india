<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Photo Resizer - FormReady India</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #151210; --panel: #1e1a17; --panel-2: #262019; --line: #39322b; --amber: #d99a3f; --amber-bright: #f0b158; --paper: #f2ece2; --muted: #a89a89; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--paper); font-family: 'Inter', sans-serif; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
.nav-bar { max-width: 600px; margin: 0 auto 20px; width: 100%; }
.back-btn { color: var(--amber); text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; color: var(--amber); margin-bottom: 6px; }
.header p { font-size: 13px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; max-width: 600px; margin: 0 auto 24px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
.upload-zone { border: 2px dashed var(--line); padding: 24px 16px; text-align: center; border-radius: 10px; cursor: pointer; background: var(--panel-2); margin-bottom: 20px; display: block; width: 100%; }
.upload-zone b { color: var(--amber); }
#fileInput { display: none; }
.options-group { margin-bottom: 16px; }
.options-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.input-field { width: 100%; padding: 12px 14px; background: var(--panel-2); border: 1px solid var(--line); color: var(--paper); border-radius: 8px; font-size: 14px; outline: none; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { background: var(--amber); color: #151210; border: none; width: 100%; padding: 14px; border-radius: 9px; font-weight: 700; font-size: 14px; cursor: pointer; }
.btn:hover { background: var(--amber-bright); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-download { background: #2ea043; color: #fff; margin-top: 12px; display: none; }
footer { text-align: center; padding: 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); margin-top: auto; }
</style>
</head>
<body>
<div class="nav-bar"><a href="../../" class="back-btn">← Back to Dashboard</a></div>
<div class="header"><h1>Photo Resizer</h1><p>Resize image dimensions accurately in pixels</p></div>
<div class="card">
  <label for="fileInput" class="upload-zone">
    <div style="font-size:14px; color:var(--muted);">📁 Tap to upload photo<br><b>JPG, PNG supported</b></div>
  </label>
  <input type="file" id="fileInput" accept="image/*">
  <div id="previewContainer" style="display:none; text-align:center; margin-bottom:20px;">
    <img id="imagePreview" style="max-width:100%; max-height:180px; border-radius:8px; border:1px solid var(--line); object-fit:contain;" alt="Preview">
    <p id="fileDetails" style="font-size:12px; color:var(--muted); margin-top:6px;"></p>
  </div>
  <div class="grid-2 options-group">
    <div><label>Width (px):</label><input type="number" id="widthInput" class="input-field" value="800"></div>
    <div><label>Height (px):</label><input type="number" id="heightInput" class="input-field" value="600"></div>
  </div>
  <button class="btn" id="processBtn" disabled>Resize Image</button>
  <a id="downloadLink" style="text-decoration:none;"><button class="btn btn-download" id="downloadBtn">📥 Download Resized Image</button></a>
</div>
<footer>&copy; 2026 FormReady India. 100% Secure Client-Side Processing.</footer>
<script>
const fileInput = document.getElementById("fileInput"), previewContainer = document.getElementById("previewContainer"), imagePreview = document.getElementById("imagePreview"), fileDetails = document.getElementById("fileDetails"), widthInput = document.getElementById("widthInput"), heightInput = document.getElementById("heightInput"), processBtn = document.getElementById("processBtn"), downloadBtn = document.getElementById("downloadBtn"), downloadLink = document.getElementById("downloadLink");
let loadedImage = null, originalName = "";
fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0]; if (!file) return;
  originalName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      loadedImage = img; imagePreview.src = event.target.result; previewContainer.style.display = "block";
      widthInput.value = img.width; heightInput.value = img.height;
      fileDetails.textContent = `Original: ${img.width}x${img.height}px`; processBtn.disabled = false;
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});
processBtn.addEventListener("click", () => {
  if (!loadedImage) return;
  const w = parseInt(widthInput.value, 10) || 800, h = parseInt(heightInput.value, 10) || 600;
  const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(loadedImage, 0, 0, w, h);
  canvas.toBlob((blob) => {
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.download = `${originalName}-resized-${w}x${h}.jpg`;
    downloadBtn.style.display = "block";
    downloadBtn.textContent = `📥 Download Resized (${w}x${h}px)`;
  }, "image/jpeg", 0.95);
});
</script>
</body>
</html>
