<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Resizer | FormReady India</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#111827}
header{background:#111827;color:#fff;padding:16px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:800}.logo span{color:#60a5fa}
header a{color:#fff;text-decoration:none}
.container{max-width:850px;margin:auto;padding:25px 15px}
.back{color:#2563eb;text-decoration:none;font-weight:600}
.card{background:#fff;margin-top:18px;padding:25px;border-radius:22px;box-shadow:0 10px 35px #0000000d}
h1{text-align:center;margin:5px 0}
.sub{text-align:center;color:#6b7280}
.upload{margin-top:25px;border:2px dashed #93c5fd;background:#eff6ff;border-radius:18px;padding:35px;text-align:center}
.upload input{display:none}
.choose{display:inline-block;background:#2563eb;color:#fff;padding:14px 24px;border-radius:12px;font-weight:700;cursor:pointer}
#work{display:none;margin-top:25px}
.preview{background:#111827;border-radius:15px;padding:10px;text-align:center}
#preview{max-width:100%;max-height:400px;border-radius:10px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
label{font-size:13px;font-weight:700}
input[type=number],select{width:100%;padding:12px;margin-top:6px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
.lock{margin-top:14px;display:flex;align-items:center;gap:8px;color:#475569;font-size:14px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.presets button,.actions button{border:0;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}
.presets button{background:#e5e7eb}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.primary{background:#2563eb;color:white}.success{background:#16a34a;color:white}.reset{background:#e5e7eb}
.info{margin-top:15px;background:#f1f5f9;padding:12px;border-radius:10px;color:#475569;font-size:13px;text-align:center}
@media(max-width:600px){.controls{grid-template-columns:1fr}.card{padding:18px}}
</style>
</head>
<body>

<header>
<div class="logo">FormReady <span>India</span></div>
<a href="../">Home</a>
</header>

<div class="container">
<a class="back" href="../">← Back to Tools</a>

<div class="card">
<h1>📐 Photo Resizer</h1>
<p class="sub">Resize your photo to any size without complicated software.</p>

<div class="upload">
<label class="choose" for="file">📷 Choose Photo</label>
<input id="file" type="file" accept="image/*">
<p>JPG • PNG • WEBP</p>
</div>

<div id="work">

<div class="preview">
<img id="preview">
</div>

<div class="controls">

<div>
<label>Width (px)</label>
<input id="width" type="number" min="1">
</div>

<div>
<label>Height (px)</label>
<input id="height" type="number" min="1">
</div>

</div>

<label class="lock">
<input id="lock" type="checkbox" checked>
🔒 Keep aspect ratio
</label>

<div class="presets">
<button data-w="100" data-h="100">100×100</button>
<button data-w="300" data-h="300">300×300</button>
<button data-w="600" data-h="600">600×600</button>
<button data-w="1080" data-h="1080">1080×1080</button>
</div>

<div class="actions">
<button class="primary" id="resize">Resize</button>
<button class="success" id="download">⬇️ Download</button>
<button class="reset" id="reset">Reset</button>
</div>

<div class="info" id="info"></div>

<canvas id="canvas" style="display:none"></canvas>

</div>
</div>
</div>

<script>
const file=document.getElementById("file");
const preview=document.getElementById("preview");
const work=document.getElementById("work");
const width=document.getElementById("width");
const height=document.getElementById("height");
const lock=document.getElementById("lock");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const info=document.getElementById("info");

let img=new Image();
let ratio=1;
let ready=false;

file.addEventListener("change",function(){
const f=this.files[0];
if(!f)return;

const url=URL.createObjectURL(f);

img.onload=function(){
ready=true;
ratio=img.width/img.height;

width.value=img.width;
height.value=img.height;

preview.src=url;
work.style.display="block";

info.textContent="Original: "+img.width+" × "+img.height+" px";
};

img.src=url;
});

width.addEventListener("input",function(){
if(lock.checked && ready){
height.value=Math.max(1,Math.round(width.value/ratio));
}
});

height.addEventListener("input",function(){
if(lock.checked && ready){
width.value=Math.max(1,Math.round(height.value*ratio));
}
});

document.querySelectorAll(".presets button").forEach(btn=>{
btn.addEventListener("click",()=>{
width.value=btn.dataset.w;
height.value=btn.dataset.h;
});
});

document.getElementById("resize").onclick=function(){
if(!ready)return;

const w=parseInt(width.value);
const h=parseInt(height.value);

if(!w||!h||w<1||h<1){
alert("Please enter valid dimensions.");
return;
}

canvas.width=w;
canvas.height=h;

ctx.clearRect(0,0,w,h);
ctx.drawImage(img,0,0,w,h);

preview.src=canvas.toDataURL("image/png");
info.textContent="New size: "+w+" × "+h+" px";
};

document.getElementById("download").onclick=function(){
if(!ready)return;

if(canvas.width===0){
document.getElementById("resize").click();
}

const link=document.createElement("a");
link.download="formready-resized-photo.png";
link.href=canvas.toDataURL("image/png");
link.click();
};

document.getElementById("reset").onclick=function(){
if(!ready)return;

width.value=img.width;
height.value=img.height;
preview.src=img.src;
info.textContent="Original: "+img.width+" × "+img.height+" px";
};
</script>

</body>
</html>
