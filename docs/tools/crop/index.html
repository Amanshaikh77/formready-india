<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Crop Tool</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
}

h2{
  text-align:center;
  margin:5px 0 8px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  margin-bottom:18px;
}

/* Upload */
.upload{
  width:100%;
  padding:14px;
  border:2px dashed #6b8cff;
  border-radius:12px;
  text-align:center;
  background:white;
  cursor:pointer;
  font-weight:bold;
}

#photoInput{
  display:none;
}

/* Image area */
.editor{
  width:100%;
  margin-top:15px;
  background:#111;
  border-radius:12px;
  padding:10px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/*
 IMPORTANT:
 Image never becomes taller than the phone screen.
*/
#imageBox{
  position:relative;
  width:100%;
  height:55vh;
  max-height:500px;
  min-height:220px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

#preview{
  display:block;
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  user-select:none;
}

/* Crop box */
#cropBox{
  position:absolute;
  border:2px solid white;
  box-shadow:
    0 0 0 9999px rgba(0,0,0,.55);
  display:none;
  touch-action:none;
}

.handle{
  position:absolute;
  width:14px;
  height:14px;
  background:white;
  border-radius:50%;
}

.tl{left:-7px;top:-7px;}
.tr{right:-7px;top:-7px;}
.bl{left:-7px;bottom:-7px;}
.br{right:-7px;bottom:-7px;}

.controls{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

.control{
  margin-bottom:12px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input[type="number"]{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

button{
  border:0;
  padding:13px;
  border-radius:9px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#2563eb;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#222;
}

.success{
  background:#16a34a;
  color:white;
  grid-column:1 / -1;
}

#result{
  display:none;
  width:100%;
  margin-top:15px;
  background:white;
  padding:10px;
  border-radius:12px;
}

#resultCanvas{
  width:100%;
  height:auto;
  display:block;
  border-radius:8px;
}

/* Android/mobile */
@media(max-width:600px){

  body{
    padding:10px;
  }

  h2{
    font-size:20px;
  }

  .subtitle{
    font-size:13px;
    margin-bottom:12px;
  }

  .editor{
    padding:6px;
    margin-top:10px;
  }

  #imageBox{
    height:52vh;
    max-height:420px;
    min-height:180px;
  }

  .controls{
    padding:12px;
  }

  .buttons{
    gap:8px;
  }

  button{
    padding:12px 8px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="container">

<h2>📷 Photo Crop Tool</h2>

<div class="subtitle">
Crop your photo easily on your phone
</div>

<label class="upload" for="photoInput">
📁 Choose Photo
</label>

<input
  type="file"
  id="photoInput"
  accept="image/*"
>

<div class="editor">

  <div id="imageBox">

    <img id="preview">

    <div id="cropBox">

      <div class="handle tl"></div>
      <div class="handle tr"></div>
      <div class="handle bl"></div>
      <div class="handle br"></div>

    </div>

  </div>

</div>

<div class="controls">

  <div class="control">

    <label>
      Output Width (px)
    </label>

    <input
      id="outWidth"
      type="number"
      value="300"
      min="20"
    >

  </div>

  <div class="control">

    <label>
      Output Height (px)
    </label>

    <input
      id="outHeight"
      type="number"
      value="300"
      min="20"
    >

  </div>

  <div class="buttons">

    <button
      class="primary"
      id="applySize"
    >
      Apply Size
    </button>

    <button
      class="secondary"
      id="reset"
    >
      Reset
    </button>

    <button
      class="success"
      id="cropDownload"
    >
      ✂️ Crop & Download
    </button>

  </div>

</div>

<div id="result">

  <canvas id="resultCanvas"></canvas>

</div>

</div>

<script>

const photoInput =
document.getElementById("photoInput");

const preview =
document.getElementById("preview");

const imageBox =
document.getElementById("imageBox");

const cropBox =
document.getElementById("cropBox");

const result =
document.getElementById("result");

const resultCanvas =
document.getElementById("resultCanvas");

const outWidth =
document.getElementById("outWidth");

const outHeight =
document.getElementById("outHeight");

const applySize =
document.getElementById("applySize");

const reset =
document.getElementById("reset");

const cropDownload =
document.getElementById("cropDownload");

let image = new Image();
let loaded = false;

let crop = {
  x:0,
  y:0,
  w:100,
  h:100
};

/* Upload */

photoInput.addEventListener("change",function(){

  const file = this.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    image.onload = function(){

      loaded = true;

      preview.src = e.target.result;

      result.style.display = "none";

      setTimeout(resetCrop,100);

    };

    image.src = e.target.result;

  };

  reader.readAsDataURL(file);

});


/* Reset crop */

function resetCrop(){

  if(!loaded) return;

  const box =
  imageBox.getBoundingClientRect();

  const img =
  preview.getBoundingClientRect();

  const size =
  Math.min(img.width,img.height) * 0.7;

  crop.w = size;
  crop.h = size;

  crop.x =
  img.left - box.left +
  (img.width-size)/2;

  crop.y =
  img.top - box.top +
  (img.height-size)/2;

  updateCrop();

  cropBox.style.display = "block";
}


reset.addEventListener("click",function(){

  resetCrop();

});


/* Keep crop inside image */

function updateCrop(){

  const box =
  imageBox.getBoundingClientRect();

  const img =
  preview.getBoundingClientRect();

  const left =
  img.left - box.left;

  const top =
  img.top - box.top;

  const right =
  left + img.width;

  const bottom =
  top + img.height;

  crop.x =
  Math.max(left,
    Math.min(crop.x,right-crop.w));

  crop.y =
  Math.max(top,
    Math.min(crop.y,bottom-crop.h));

  crop.w =
  Math.min(crop.w,img.width);

  crop.h =
  Math.min(crop.h,img.height);

  cropBox.style.left =
  crop.x + "px";

  cropBox.style.top =
  crop.y + "px";

  cropBox.style.width =
  crop.w + "px";

  cropBox.style.height =
  crop.h + "px";
}


/* Drag crop */

let dragging = false;
let startX = 0;
let startY = 0;
let originalX = 0;
let originalY = 0;

cropBox.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    dragging = true;

    startX = e.clientX;
    startY = e.clientY;

    originalX = crop.x;
    originalY = crop.y;

    cropBox.setPointerCapture(e.pointerId);

  }
);

cropBox.addEventListener(
  "pointermove",
  function(e){

    if(!dragging) return;

    crop.x =
    originalX +
    (e.clientX-startX);

    crop.y =
    originalY +
    (e.clientY-startY);

    updateCrop();

  }
);

cropBox.addEventListener(
  "pointerup",
  function(){

    dragging = false;

  }
);


/* Apply output size */

applySize.addEventListener(
  "click",
  function(){

    if(!loaded) return;

    let w =
    parseInt(outWidth.value);

    let h =
    parseInt(outHeight.value);

    if(!w || w < 20)
      w = 300;

    if(!h || h < 20)
      h = 300;

    outWidth.value = w;
    outHeight.value = h;

    alert(
      "Output size set to " +
      w + " × " + h
    );

  }
);


/* Crop + Download */

cropDownload.addEventListener(
  "click",
  function(){

    if(!loaded){

      alert("Please choose a photo first.");

      return;
    }

    let w =
    parseInt(outWidth.value);

    let h =
    parseInt(outHeight.value);

    if(!w || w < 20)
      w = 300;

    if(!h || h < 20)
      h = 300;


    const box =
    imageBox.getBoundingClientRect();

    const img =
    preview.getBoundingClientRect();


    /*
      Convert screen coordinates
      into original image coordinates.
    */

    const scaleX =
    image.width / img.width;

    const scaleY =
    image.height / img.height;


    const cropX =
    (cropBox.getBoundingClientRect().left -
     img.left) * scaleX;

    const cropY =
    (cropBox.getBoundingClientRect().top -
     img.top) * scaleY;

    const cropW =
    crop.w * scaleX;

    const cropH =
    crop.h * scaleY;


    resultCanvas.width = w;
    resultCanvas.height = h;


    const ctx =
    resultCanvas.getContext("2d");


    ctx.clearRect(
      0,
      0,
      w,
      h
    );


    ctx.drawImage(
      image,

      cropX,
      cropY,
      cropW,
      cropH,

      0,
      0,
      w,
      h
    );


    result.style.display = "block";


    const link =
    document.createElement("a");

    link.download =
    "formready-cropped-photo.jpg";

    link.href =
    resultCanvas.toDataURL(
      "image/jpeg",
      0.95
    );

    link.click();

  }
);


/*
  Fix orientation/resize.
  When screen rotates or browser changes size,
  keep crop inside the image.
*/

window.addEventListener(
  "resize",
  function(){

    if(loaded){

      setTimeout(
        updateCrop,
        100
      );

    }

  }
);

</script>

</body>
</html>
