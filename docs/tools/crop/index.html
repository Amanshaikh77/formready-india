<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Cropper | FormReady India</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.upload{
  display:block;
  width:100%;
  padding:18px;
  border:2px dashed #2563eb;
  border-radius:14px;
  text-align:center;
  color:#2563eb;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:20px;
}

#fileInput{
  display:none;
}

.editor{
  position:relative;
  width:100%;
  max-width:800px;
  margin:auto;
  background:#111827;
  overflow:hidden;
  border-radius:12px;
  touch-action:none;
  user-select:none;
}

#imageCanvas{
  display:block;
  width:100%;
  height:auto;
}

.cropBox{
  position:absolute;
  border:3px solid #fff;
  box-shadow:0 0 0 9999px rgba(0,0,0,.55);
  cursor:move;
  touch-action:none;
}

.handle{
  position:absolute;
  width:20px;
  height:20px;
  background:white;
  border:2px solid #2563eb;
  border-radius:50%;
}

.tl{left:-10px;top:-10px;cursor:nwse-resize}
.tr{right:-10px;top:-10px;cursor:nesw-resize}
.bl{left:-10px;bottom:-10px;cursor:nesw-resize}
.br{right:-10px;bottom:-10px;cursor:nwse-resize}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.control{
  background:#f3f4f6;
  padding:14px;
  border-radius:12px;
}

.control label{
  display:block;
  font-size:14px;
  color:#6b7280;
  margin-bottom:5px;
}

.control strong{
  font-size:22px;
}

.buttons{
  display:flex;
  gap:12px;
  margin-top:20px;
  flex-wrap:wrap;
}

button{
  flex:1;
  min-width:140px;
  border:0;
  padding:15px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#2563eb;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#111827;
}

.success{
  background:#16a34a;
  color:white;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

#result{
  display:none;
  margin-top:25px;
  text-align:center;
}

#resultCanvas{
  max-width:100%;
  border-radius:10px;
  box-shadow:0 3px 15px rgba(0,0,0,.15);
}

@media(max-width:600px){
  .container{
    padding:12px;
  }

  .card{
    padding:14px;
  }

  .info{
    gap:8px;
  }

  .control strong{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>📷 Photo Cropper</h1>

<p class="subtitle">
Crop your photo easily on your phone
</p>

<div class="card">

<label class="upload" for="fileInput">
📁 Choose Photo
</label>

<input
  id="fileInput"
  type="file"
  accept="image/jpeg,image/png,image/webp"
>

<div
  id="editor"
  class="editor"
  style="display:none;"
>

<canvas id="imageCanvas"></canvas>

<div id="cropBox" class="cropBox">

<div class="handle tl"></div>
<div class="handle tr"></div>
<div class="handle bl"></div>
<div class="handle br"></div>

</div>

</div>

<div class="info">

<div class="control">
<label>Selected Width</label>
<strong><span id="cropWidth">0</span> px</strong>
</div>

<div class="control">
<label>Selected Height</label>
<strong><span id="cropHeight">0</span> px</strong>
</div>

</div>

<div class="buttons">

<button
  id="resetBtn"
  class="secondary"
  disabled
>
Reset
</button>

<button
  id="cropBtn"
  class="success"
  disabled
>
✂️ Crop & Download
</button>

</div>

<div id="result">

<h3>Preview</h3>

<canvas id="resultCanvas"></canvas>

</div>

</div>
</div>

<script>

const fileInput =
document.getElementById("fileInput");

const editor =
document.getElementById("editor");

const imageCanvas =
document.getElementById("imageCanvas");

const cropBox =
document.getElementById("cropBox");

const cropWidth =
document.getElementById("cropWidth");

const cropHeight =
document.getElementById("cropHeight");

const cropBtn =
document.getElementById("cropBtn");

const resetBtn =
document.getElementById("resetBtn");

const result =
document.getElementById("result");

const resultCanvas =
document.getElementById("resultCanvas");

const ctx =
imageCanvas.getContext("2d");

const resultCtx =
resultCanvas.getContext("2d");

let image = new Image();

let loaded = false;

let displayWidth = 0;
let displayHeight = 0;

let crop = {
  x:0,
  y:0,
  w:0,
  h:0
};

let action = null;

let startX = 0;
let startY = 0;

let startCrop = null;


/* =========================
   LOAD IMAGE
========================= */

fileInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    alert("Please select an image.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    image = new Image();

    image.onload = function(){

      loaded = true;

      displayWidth = image.width;
      displayHeight = image.height;

      /*
        Limit display size for mobile
      */

      const maxWidth = 800;

      if(displayWidth > maxWidth){

        const ratio =
        maxWidth / displayWidth;

        displayWidth =
        Math.round(displayWidth * ratio);

        displayHeight =
        Math.round(displayHeight * ratio);
      }

      imageCanvas.width = displayWidth;
      imageCanvas.height = displayHeight;

      imageCanvas.style.width =
      displayWidth + "px";

      imageCanvas.style.height =
      displayHeight + "px";

      ctx.clearRect(
        0,
        0,
        displayWidth,
        displayHeight
      );

      ctx.drawImage(
        image,
        0,
        0,
        displayWidth,
        displayHeight
      );

      editor.style.display = "block";

      /*
        Initial crop = 80% of image
      */

      const initialW =
      Math.round(displayWidth * 0.8);

      const initialH =
      Math.round(displayHeight * 0.8);

      crop.w = initialW;
      crop.h = initialH;

      crop.x =
      Math.round((displayWidth - initialW) / 2);

      crop.y =
      Math.round((displayHeight - initialH) / 2);

      updateCropBox();

      cropBtn.disabled = false;
      resetBtn.disabled = false;

      result.style.display = "none";
    };

    image.src = e.target.result;
  };

  reader.readAsDataURL(file);

});


/* =========================
   UPDATE CROP BOX
========================= */

function updateCropBox(){

  cropBox.style.left =
  crop.x + "px";

  cropBox.style.top =
  crop.y + "px";

  cropBox.style.width =
  crop.w + "px";

  cropBox.style.height =
  crop.h + "px";

  /*
    IMPORTANT:
    Real image dimensions,
    NOT fixed 300x300
  */

  const scaleX =
  image.width / displayWidth;

  const scaleY =
  image.height / displayHeight;

  const realW =
  Math.round(crop.w * scaleX);

  const realH =
  Math.round(crop.h * scaleY);

  cropWidth.textContent =
  realW;

  cropHeight.textContent =
  realH;
}


/* =========================
   POINTER START
========================= */

cropBox.addEventListener(
"pointerdown",
function(e){

  if(!loaded) return;

  e.preventDefault();

  const rect =
  cropBox.getBoundingClientRect();

  const boxX =
  e.clientX - rect.left;

  const boxY =
  e.clientY - rect.top;

  const size = 25;

  if(
    boxX < size &&
    boxY < size
  ){
    action = "tl";
  }
  else if(
    boxX > rect.width - size &&
    boxY < size
  ){
    action = "tr";
  }
  else if(
    boxX < size &&
    boxY > rect.height - size
  ){
    action = "bl";
  }
  else if(
    boxX > rect.width - size &&
    boxY > rect.height - size
  ){
    action = "br";
  }
  else{
    action = "move";
  }

  startX = e.clientX;
  startY = e.clientY;

  startCrop = {
    x:crop.x,
    y:crop.y,
    w:crop.w,
    h:crop.h
  };

  cropBox.setPointerCapture(e.pointerId);

});


/* =========================
   POINTER MOVE
========================= */

cropBox.addEventListener(
"pointermove",
function(e){

  if(!action) return;

  e.preventDefault();

  const dx =
  e.clientX - startX;

  const dy =
  e.clientY - startY;

  const minSize = 30;

  let c = {
    x:startCrop.x,
    y:startCrop.y,
    w:startCrop.w,
    h:startCrop.h
  };


  /* MOVE */

  if(action === "move"){

    c.x =
    startCrop.x + dx;

    c.y =
    startCrop.y + dy;

    c.x =
    Math.max(
      0,
      Math.min(
        c.x,
        displayWidth - c.w
      )
    );

    c.y =
    Math.max(
      0,
      Math.min(
        c.y,
        displayHeight - c.h
      )
    );

  }


  /* TOP LEFT */

  if(action === "tl"){

    c.x =
    startCrop.x + dx;

    c.y =
    startCrop.y + dy;

    c.w =
    startCrop.w - dx;

    c.h =
    startCrop.h - dy;

    if(c.w < minSize){
      c.w = minSize;
      c.x =
      startCrop.x +
      startCrop.w -
      minSize;
    }

    if(c.h < minSize){
      c.h = minSize;
      c.y =
      startCrop.y +
      startCrop.h -
      minSize;
    }
  }


  /* TOP RIGHT */

  if(action === "tr"){

    c.y =
    startCrop.y + dy;

    c.w =
    startCrop.w + dx;

    c.h =
    startCrop.h - dy;

    if(c.w < minSize)
      c.w = minSize;

    if(c.h < minSize){
      c.h = minSize;

      c.y =
      startCrop.y +
      startCrop.h -
      minSize;
    }

    if(
      c.x + c.w >
      displayWidth
    ){
      c.w =
      displayWidth - c.x;
    }
  }


  /* BOTTOM LEFT */

  if(action === "bl"){

    c.x =
    startCrop.x + dx;

    c.w =
    startCrop.w - dx;

    c.h =
    startCrop.h + dy;

    if(c.w < minSize){

      c.w = minSize;

      c.x =
      startCrop.x +
      startCrop.w -
      minSize;
    }

    if(c.h < minSize)
      c.h = minSize;

    if(
      c.y + c.h >
      displayHeight
    ){
      c.h =
      displayHeight - c.y;
    }
  }


  /* BOTTOM RIGHT */

  if(action === "br"){

    c.w =
    startCrop.w + dx;

    c.h =
    startCrop.h + dy;

    if(c.w < minSize)
      c.w = minSize;

    if(c.h < minSize)
      c.h = minSize;

    if(
      c.x + c.w >
      displayWidth
    ){
      c.w =
      displayWidth - c.x;
    }

    if(
      c.y + c.h >
      displayHeight
    ){
      c.h =
      displayHeight - c.y;
    }
  }


  crop = c;

  updateCropBox();

});


/* =========================
   POINTER END
========================= */

cropBox.addEventListener(
"pointerup",
function(){

  action = null;

});

cropBox.addEventListener(
"pointercancel",
function(){

  action = null;

});


/* =========================
   RESET
========================= */

resetBtn.addEventListener(
"click",
function(){

  if(!loaded) return;

  crop.w =
  Math.round(displayWidth * 0.8);

  crop.h =
  Math.round(displayHeight * 0.8);

  crop.x =
  Math.round(
    (displayWidth - crop.w) / 2
  );

  crop.y =
  Math.round(
    (displayHeight - crop.h) / 2
  );

  updateCropBox();

  result.style.display = "none";

});


/* =========================
   CROP + DOWNLOAD
========================= */

cropBtn.addEventListener(
"click",
function(){

  if(!loaded) return;

  if(crop.w < 5 || crop.h < 5){

    alert(
      "Please select a larger crop area."
    );

    return;
  }


  /*
    Convert display coordinates
    to original image coordinates
  */

  const scaleX =
  image.width / displayWidth;

  const scaleY =
  image.height / displayHeight;

  const sx =
  Math.round(crop.x * scaleX);

  const sy =
  Math.round(crop.y * scaleY);

  const sw =
  Math.round(crop.w * scaleX);

  const sh =
  Math.round(crop.h * scaleY);


  /*
    Result canvas uses EXACT
    selected crop dimensions
  */

  resultCanvas.width = sw;
  resultCanvas.height = sh;

  resultCtx.clearRect(
    0,
    0,
    sw,
    sh
  );

  resultCtx.drawImage(
    image,
    sx,
    sy,
    sw,
    sh,
    0,
    0,
    sw,
    sh
  );


  result.style.display = "block";


  /*
    Download actual cropped image
  */

  const link =
  document.createElement("a");

  link.download =
  "formready-cropped-photo.jpg";

  link.href =
  resultCanvas.toDataURL(
    "image/jpeg",
    0.95
  );

  link.click();

});


</script>

</body>
</html>
