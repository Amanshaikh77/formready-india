<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Photo Crop Tool</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

body{
  overflow-x:hidden;
}

.container{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:24px 20px 40px;
}

h1{
  text-align:center;
  margin:0 0 8px;
  font-size:32px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:18px;
  margin-bottom:26px;
}

.file-label{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:96px;
  border:3px dashed #7188df;
  border-radius:20px;
  background:white;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:20px;
}

.file-label input{
  display:none;
}

.editor{
  width:100%;
  background:#111;
  border-radius:18px;
  overflow:hidden;
  display:none;
  touch-action:none;
}

.image-wrapper{
  position:relative;
  width:100%;
  max-height:65vh;
  min-height:220px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:#111;
}

#image{
  display:block;
  max-width:100%;
  max-height:65vh;
  width:auto;
  height:auto;
}

.controls{
  background:white;
  border-radius:20px;
  margin-top:20px;
  padding:20px;
}

.control{
  margin-bottom:18px;
}

.control:last-child{
  margin-bottom:0;
}

label{
  display:block;
  font-weight:bold;
  font-size:20px;
  margin-bottom:8px;
}

input[type="number"]{
  width:100%;
  padding:15px;
  font-size:19px;
  border:2px solid #ddd;
  border-radius:12px;
  outline:none;
}

input[type="number"]:focus{
  border-color:#7188df;
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:20px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#4667df;
  color:white;
}

.secondary{
  background:#e9edf7;
  color:#222;
}

.success{
  background:#159447;
  color:white;
}

.result{
  margin-top:20px;
  background:white;
  border-radius:20px;
  padding:20px;
  display:none;
}

.result h2{
  margin-top:0;
}

#resultCanvas{
  width:100%;
  height:auto;
  display:block;
  border-radius:12px;
}

.info{
  text-align:center;
  color:#666;
  font-size:14px;
  margin-top:10px;
}

/* Cropper.js mobile fixes */
.cropper-container{
  max-width:100% !important;
}

.cropper-view-box,
.cropper-face{
  border-radius:0 !important;
}

.cropper-modal{
  background-color:#000;
  opacity:.55;
}

@media(max-width:600px){
  .container{
    padding:22px 20px 35px;
  }

  h1{
    font-size:30px;
  }

  .subtitle{
    font-size:17px;
  }

  .file-label{
    min-height:92px;
    font-size:21px;
  }

  .image-wrapper{
    max-height:58vh;
    min-height:200px;
  }

  #image{
    max-height:58vh;
  }

  .controls{
    padding:18px;
  }
}
</style>

<!-- Cropper.js -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"
>

</head>

<body>

<div class="container">

  <h1>📷 Photo Crop Tool</h1>

  <div class="subtitle">
    Crop your photo easily on your phone
  </div>

  <label class="file-label">
    📁 Choose Photo
    <input
      type="file"
      id="fileInput"
      accept="image/*"
    >
  </label>

  <div class="editor" id="editor">

    <div class="image-wrapper">
      <img id="image" alt="Selected photo">
    </div>

  </div>

  <div class="controls" id="controls">

    <div class="control">
      <label for="outWidth">
        Output Width (px)
      </label>

      <input
        id="outWidth"
        type="number"
        value="300"
        min="20"
        max="10000"
      >
    </div>

    <div class="control">
      <label for="outHeight">
        Output Height (px)
      </label>

      <input
        id="outHeight"
        type="number"
        value="300"
        min="20"
        max="10000"
      >
    </div>

    <div class="buttons">

      <button
        class="primary"
        id="applySize"
        type="button"
      >
        Apply Output Size
      </button>

      <button
        class="secondary"
        id="reset"
        type="button"
      >
        Reset Crop
      </button>

      <button
        class="success"
        id="cropDownload"
        type="button"
      >
        ✂️ Crop & Download
      </button>

    </div>

  </div>

  <div class="result" id="result">

    <h2>Preview</h2>

    <canvas id="resultCanvas"></canvas>

    <div class="info" id="info">
      Output preview
    </div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

<script>

const fileInput = document.getElementById("fileInput");
const image = document.getElementById("image");
const editor = document.getElementById("editor");

const outWidth = document.getElementById("outWidth");
const outHeight = document.getElementById("outHeight");

const applySize = document.getElementById("applySize");
const reset = document.getElementById("reset");
const cropDownload = document.getElementById("cropDownload");

const result = document.getElementById("result");
const resultCanvas = document.getElementById("resultCanvas");
const info = document.getElementById("info");

let cropper = null;
let loaded = false;


/* =========================
   CHOOSE PHOTO
========================= */

fileInput.addEventListener("change", function(e){

  const file = e.target.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){
    alert("Please select an image.");
    return;
  }

  const url = URL.createObjectURL(file);

  image.onload = function(){

    if(cropper){
      cropper.destroy();
      cropper = null;
    }

    editor.style.display = "block";

    cropper = new Cropper(image, {

      viewMode: 1,

      dragMode: "move",

      autoCrop: true,

      autoCropArea: 0.7,

      responsive: true,

      restore: false,

      guides: true,

      center: true,

      highlight: true,

      cropBoxMovable: true,

      cropBoxResizable: true,

      toggleDragModeOnDblclick: false,

      background: false,

      movable: true,

      zoomable: true,

      zoomOnWheel: true,

      zoomOnTouch: true,

      rotatable: false,

      scalable: false,

      minCropBoxWidth: 30,

      minCropBoxHeight: 30,

      ready: function(){

        loaded = true;

        /*
          IMPORTANT:
          Free crop is enabled.
          No fixed aspect ratio.
        */

        cropper.setAspectRatio(NaN);
      }

    });

    result.style.display = "none";

    URL.revokeObjectURL(url);
  };

  image.src = url;
});


/* =========================
   APPLY OUTPUT SIZE
========================= */

applySize.addEventListener("click", function(){

  if(!loaded || !cropper){
    alert("Please choose a photo first.");
    return;
  }

  let w = parseInt(outWidth.value);
  let h = parseInt(outHeight.value);

  if(!w || w < 20){
    w = 300;
    outWidth.value = w;
  }

  if(!h || h < 20){
    h = 300;
    outHeight.value = h;
  }

  /*
    IMPORTANT:
    Output size does NOT change the crop box ratio.
    Crop remains fully customizable.
  */

  createPreview(w,h);
});


/* =========================
   RESET
========================= */

reset.addEventListener("click", function(){

  if(!cropper){
    return;
  }

  cropper.reset();

  result.style.display = "none";
});


/* =========================
   CREATE PREVIEW
========================= */

function createPreview(w,h){

  if(!cropper){
    return;
  }

  const canvas = cropper.getCroppedCanvas({

    width:w,

    height:h,

    imageSmoothingEnabled:true,

    imageSmoothingQuality:"high",

    fillColor:"#ffffff"

  });

  if(!canvas){
    alert("Could not create preview.");
    return;
  }

  resultCanvas.width = w;
  resultCanvas.height = h;

  const ctx = resultCanvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  ctx.drawImage(
    canvas,
    0,
    0,
    w,
    h
  );

  result.style.display = "block";

  info.textContent =
    "Output: " + w + " × " + h + " px";
}


/* =========================
   CROP + DOWNLOAD
========================= */

cropDownload.addEventListener("click", function(){

  if(!loaded || !cropper){
    alert("Please choose a photo first.");
    return;
  }

  let w = parseInt(outWidth.value);
  let h = parseInt(outHeight.value);

  if(!w || w < 20){
    alert("Enter a valid width.");
    outWidth.focus();
    return;
  }

  if(!h || h < 20){
    alert("Enter a valid height.");
    outHeight.focus();
    return;
  }

  try{

    const canvas = cropper.getCroppedCanvas({

      width:w,

      height:h,

      imageSmoothingEnabled:true,

      imageSmoothingQuality:"high",

      fillColor:"#ffffff"

    });

    if(!canvas){
      alert("Could not crop the photo.");
      return;
    }

    resultCanvas.width = w;
    resultCanvas.height = h;

    const ctx = resultCanvas.getContext("2d");

    ctx.clearRect(
      0,
      0,
      w,
      h
    );

    ctx.drawImage(
      canvas,
      0,
      0,
      w,
      h
    );

    result.style.display = "block";

    info.textContent =
      "Downloaded size: " + w + " × " + h + " px";

    canvas.toBlob(function(blob){

      if(!blob){
        alert("Could not create JPG.");
        return;
      }

      const link = document.createElement("a");

      link.download =
        "formready-cropped-photo.jpg";

      link.href =
        URL.createObjectURL(blob);

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

      setTimeout(function(){
        URL.revokeObjectURL(link.href);
      },1000);

    },"image/jpeg",0.95);

  }catch(error){

    console.error(error);

    alert("Something went wrong while cropping the photo.");

  }

});

</script>

</body>
</html>
