<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Photo Sheet Maker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#182033;
}

.container{
  max-width:720px;
  margin:auto;
  padding:22px 16px 60px;
}

h1{
  text-align:center;
  margin:5px 0 8px;
  font-size:32px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:18px;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 25px #0000000d;
}

label{
  display:block;
  font-weight:700;
  font-size:18px;
  margin:15px 0 8px;
}

input,select{
  width:100%;
  padding:16px;
  border:2px solid #ddd;
  border-radius:15px;
  font-size:17px;
  background:white;
}

.upload{
  border:3px dashed #6485df;
  border-radius:20px;
  padding:25px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.upload input{
  display:none;
}

.preview-box{
  background:#eaf0fb;
  border-radius:22px;
  padding:18px;
  overflow:auto;
}

.sheet-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

#sheet{
  display:block;
  background:white;
  width:min(100%,500px);
  height:auto;
  box-shadow:0 3px 15px #0002;
}

.info{
  text-align:center;
  color:#777;
  font-size:17px;
  margin:18px 0;
}

button{
  width:100%;
  border:0;
  border-radius:17px;
  padding:18px;
  font-size:19px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

.create{
  background:#2864df;
  color:white;
}

.download{
  background:#182033;
  color:white;
}

.reset{
  background:#e7e9ef;
  color:#182033;
}

button:disabled{
  opacity:.45;
}

@media(max-width:500px){
  h1{font-size:28px}
  .container{padding:16px 12px 45px}
  .card{padding:16px}
}
</style>
</head>

<body>

<div class="container">

<h1>📸 Photo Sheet Maker</h1>
<div class="subtitle">Create passport & ID photo sheets easily</div>

<div class="card">

<label class="upload">
📁 Choose Photo
<input type="file" id="file" accept="image/*">
</label>

<label>Photo Size</label>
<select id="size">
<option value="25x35">25 × 35 mm</option>
<option value="35x45">35 × 45 mm</option>
<option value="30x40">30 × 40 mm</option>
<option value="40x50">40 × 50 mm</option>
<option value="50x50">50 × 50 mm</option>
</select>

<label>Number of Photos</label>
<select id="count">
<option value="2">2 Photos</option>
<option value="4">4 Photos</option>
<option value="6">6 Photos</option>
<option value="8">8 Photos</option>
<option value="10">10 Photos</option>
<option value="12">12 Photos</option>
<option value="16">16 Photos</option>
<option value="20">20 Photos</option>
</select>

<label>Paper</label>
<select id="paper">
<option value="A4">A4</option>
<option value="A5">A5</option>
<option value="4x6">4 × 6 inch</option>
</select>

</div>

<div class="card">

<div class="preview-box">
<div class="sheet-wrap">
<canvas id="sheet"></canvas>
</div>
</div>

<div class="info" id="info">
Upload a photo to preview the sheet
</div>

<button class="create" id="create">
✨ Create Sheet
</button>

<button class="download" id="download" disabled>
⬇️ Download JPG
</button>

<button class="reset" id="reset">
Reset
</button>

</div>

</div>

<script>
const fileInput=document.getElementById("file");
const sizeSelect=document.getElementById("size");
const countSelect=document.getElementById("count");
const paperSelect=document.getElementById("paper");

const canvas=document.getElementById("sheet");
const ctx=canvas.getContext("2d");

const createBtn=document.getElementById("create");
const downloadBtn=document.getElementById("download");
const resetBtn=document.getElementById("reset");
const info=document.getElementById("info");

let image=null;

/* 300 DPI */
const DPI=300;

function mmToPx(mm){
  return Math.round(mm/25.4*DPI);
}

function paperSize(type){
  if(type==="A4"){
    return {
      w:mmToPx(210),
      h:mmToPx(297)
    };
  }

  if(type==="A5"){
    return {
      w:mmToPx(148),
      h:mmToPx(210)
    };
  }

  return {
    w:mmToPx(152.4),
    h:mmToPx(101.6)
  };
}

function photoSize(type){
  const [w,h]=type.split("x").map(Number);

  return {
    w:mmToPx(w),
    h:mmToPx(h)
  };
}

fileInput.addEventListener("change",function(){

  const file=this.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=function(e){

    const img=new Image();

    img.onload=function(){
      image=img;
      createSheet();
    };

    img.src=e.target.result;
  };

  reader.readAsDataURL(file);
});


function createSheet(){

  if(!image){
    alert("Please choose a photo first.");
    return;
  }

  const paper=paperSize(paperSelect.value);
  const photo=photoSize(sizeSelect.value);

  canvas.width=paper.w;
  canvas.height=paper.h;

  /* WHITE PAPER */
  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const count=parseInt(countSelect.value);

  /*
    TOP ALIGNED LAYOUT
    Photos always start near the top.
  */

  const margin=mmToPx(8);
  const gap=mmToPx(4);

  const availableWidth=paper.w-(margin*2);

  let columns=Math.floor(
    (availableWidth+gap)/(photo.w+gap)
  );

  if(columns<1)columns=1;

  if(columns>6)columns=6;

  let rows=Math.ceil(count/columns);

  const totalWidth=
    columns*photo.w+(columns-1)*gap;

  const startX=
    Math.max(
      margin,
      Math.round((paper.w-totalWidth)/2)
    );

  /*
    IMPORTANT:
    Start from TOP.
    No vertical centering.
  */

  const startY=margin;

  for(let i=0;i<count;i++){

    const col=i%columns;
    const row=Math.floor(i/columns);

    const x=startX+col*(photo.w+gap);
    const y=startY+row*(photo.h+gap);

    drawPhotoCover(image,x,y,photo.w,photo.h);
  }

  const sizeText=sizeSelect.options[
    sizeSelect.selectedIndex
  ].text;

  info.textContent=
    count+" photos • "+
    sizeText+" • "+
    paperSelect.options[
      paperSelect.selectedIndex
    ].text+
    " • 300 DPI";

  downloadBtn.disabled=false;
}


/*
  High quality crop:
  fills the selected photo box
  without stretching the image.
*/
function drawPhotoCover(img,x,y,w,h){

  const imageRatio=img.width/img.height;
  const boxRatio=w/h;

  let sx=0;
  let sy=0;
  let sw=img.width;
  let sh=img.height;

  if(imageRatio>boxRatio){

    sw=img.height*boxRatio;
    sx=(img.width-sw)/2;

  }else{

    sh=img.width/boxRatio;
    sy=(img.height-sh)/2;
  }

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality="high";

  ctx.drawImage(
    img,
    sx,sy,sw,sh,
    x,y,w,h
  );
}


createBtn.addEventListener("click",createSheet);

sizeSelect.addEventListener("change",createSheet);
countSelect.addEventListener("change",createSheet);
paperSelect.addEventListener("change",createSheet);


downloadBtn.addEventListener("click",function(){

  if(!image)return;

  const link=document.createElement("a");

  link.download="photo-sheet-300dpi.jpg";

  link.href=canvas.toDataURL(
    "image/jpeg",
    0.98
  );

  link.click();
});


resetBtn.addEventListener("click",function(){

  image=null;
  fileInput.value="";

  ctx.clearRect(
    0,0,
    canvas.width,
    canvas.height
  );

  canvas.width=1;
  canvas.height=1;

  info.textContent=
    "Upload a photo to preview the sheet";

  downloadBtn.disabled=true;
});

</script>

</body>
</html>
