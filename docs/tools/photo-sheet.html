<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Sheet Maker</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#18202b;
}

.container{
  width:min(760px,94%);
  margin:25px auto 50px;
}

.header{
  text-align:center;
  margin-bottom:22px;
}

.header h1{
  margin:0;
  font-size:32px;
}

.header p{
  margin:8px 0 0;
  color:#697386;
  font-size:17px;
}

.card{
  background:white;
  border-radius:22px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 5px 25px rgba(0,0,0,.07);
}

.upload{
  border:3px dashed #5d7fe8;
  border-radius:18px;
  padding:28px 15px;
  text-align:center;
  cursor:pointer;
  background:#fbfcff;
}

.upload strong{
  display:block;
  font-size:20px;
  margin-bottom:6px;
}

.upload span{
  color:#697386;
}

input[type=file]{
  display:none;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}

select{
  width:100%;
  padding:14px;
  border:2px solid #d7dce5;
  border-radius:13px;
  background:white;
  font-size:16px;
}

.sheet-wrap{
  background:#e9edf5;
  border-radius:20px;
  padding:18px;
  text-align:center;
  overflow:hidden;
}

#sheetPreview{
  width:100%;
  max-width:500px;
  height:auto;
  display:block;
  margin:auto;
  background:white;
  box-shadow:0 4px 18px rgba(0,0,0,.18);
}

.buttons{
  display:flex;
  gap:12px;
  margin-top:18px;
}

button{
  flex:1;
  border:0;
  border-radius:14px;
  padding:15px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

#createBtn{
  background:#2867df;
  color:white;
}

#downloadBtn{
  background:#172033;
  color:white;
}

#resetBtn{
  background:#e8ebf0;
  color:#18202b;
}

.info{
  text-align:center;
  color:#697386;
  margin-top:12px;
  font-size:14px;
}

@media(max-width:600px){
  .container{
    width:94%;
    margin-top:15px;
  }

  .header h1{
    font-size:27px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:17px;
  }

  .buttons{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📸 Photo Sheet Maker</h1>
    <p>Create a clean printable photo sheet</p>
  </div>

  <div class="card">

    <label class="upload" for="photoInput">
      <strong>📁 Choose Photo</strong>
      <span>Upload one photo to create your sheet</span>
    </label>

    <input id="photoInput" type="file" accept="image/*">

  </div>

  <div class="card">

    <div class="grid">

      <div>
        <label for="photoSize">Photo Size</label>
        <select id="photoSize">
          <option value="35x45">35 × 45 mm</option>
          <option value="25x35">25 × 35 mm</option>
          <option value="30x40">30 × 40 mm</option>
          <option value="40x50">40 × 50 mm</option>
          <option value="50x50">50 × 50 mm</option>
        </select>
      </div>

      <div>
        <label for="photoCount">Number of Photos</label>
        <select id="photoCount">
          <option value="4">4 Photos</option>
          <option value="6">6 Photos</option>
          <option value="8">8 Photos</option>
          <option value="10">10 Photos</option>
          <option value="12">12 Photos</option>
          <option value="15">15 Photos</option>
          <option value="20" selected>20 Photos</option>
          <option value="24">24 Photos</option>
          <option value="30">30 Photos</option>
          <option value="35">35 Photos</option>
          <option value="40">40 Photos</option>
        </select>
      </div>

    </div>

  </div>

  <div class="card">

    <div class="sheet-wrap">
      <canvas id="sheetPreview"></canvas>
    </div>

    <div class="info" id="info">
      Choose a photo to preview the sheet
    </div>

    <div class="buttons">
      <button id="createBtn">✨ Create Sheet</button>
      <button id="downloadBtn">⬇️ Download JPG</button>
      <button id="resetBtn">Reset</button>
    </div>

  </div>

</div>

<script>

const photoInput = document.getElementById("photoInput");
const photoSize = document.getElementById("photoSize");
const photoCount = document.getElementById("photoCount");
const canvas = document.getElementById("sheetPreview");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");

const createBtn = document.getElementById("createBtn");
const downloadBtn = document.getElementById("downloadBtn");
const resetBtn = document.getElementById("resetBtn");

let uploadedImage = null;

/*
  A4 at 300 DPI
*/
const A4_W = 2480;
const A4_H = 3508;

function mmToPx(mm){
  return Math.round(mm * 300 / 25.4);
}

function getPhotoSize(){

  const value = photoSize.value.split("x");

  return {
    width:mmToPx(Number(value[0])),
    height:mmToPx(Number(value[1]))
  };
}

function clearCanvas(){

  canvas.width = A4_W;
  canvas.height = A4_H;

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,A4_W,A4_H);
}

function drawImageCover(img,x,y,w,h){

  const sourceRatio = img.width / img.height;
  const targetRatio = w / h;

  let sx = 0;
  let sy = 0;
  let sw = img.width;
  let sh = img.height;

  if(sourceRatio > targetRatio){

    sw = img.height * targetRatio;
    sx = (img.width - sw) / 2;

  }else{

    sh = img.width / targetRatio;
    sy = (img.height - sh) / 2;
  }

  ctx.drawImage(
    img,
    sx,sy,sw,sh,
    x,y,w,h
  );
}

function calculateLayout(count,photoW,photoH){

  const margin = mmToPx(10);
  const gap = mmToPx(3);

  const availableW = A4_W - margin * 2;
  const availableH = A4_H - margin * 2;

  let best = null;

  for(let cols=1; cols<=10; cols++){

    const rows = Math.ceil(count / cols);

    const totalW =
      cols * photoW +
      (cols - 1) * gap;

    const totalH =
      rows * photoH +
      (rows - 1) * gap;

    if(totalW <= availableW && totalH <= availableH){

      const unused =
        (availableW-totalW) +
        (availableH-totalH);

      if(!best || unused < best.unused){

        best = {
          cols,
          rows,
          totalW,
          totalH,
          unused
        };
      }
    }
  }

  return best;
}

function createSheet(){

  clearCanvas();

  if(!uploadedImage){

    info.textContent = "Please choose a photo first.";
    return;
  }

  const size = getPhotoSize();

  const count = Number(photoCount.value);

  const layout = calculateLayout(
    count,
    size.width,
    size.height
  );

  if(!layout){

    info.textContent =
      "Too many photos for this size on one A4 sheet.";

    return;
  }

  const startX =
    Math.round((A4_W-layout.totalW)/2);

  const startY =
    Math.round((A4_H-layout.totalH)/2);

  let placed = 0;

  for(let row=0; row<layout.rows; row++){

    for(let col=0; col<layout.cols; col++){

      if(placed >= count) break;

      const x =
        startX + col * (size.width + mmToPx(3));

      const y =
        startY + row * (size.height + mmToPx(3));

      /*
        Thin cutting border
      */
      ctx.strokeStyle = "#d5d5d5";
      ctx.lineWidth = 2;

      ctx.strokeRect(
        x-1,
        y-1,
        size.width+2,
        size.height+2
      );

      drawImageCover(
        uploadedImage,
        x,
        y,
        size.width,
        size.height
      );

      placed++;
    }
  }

  info.textContent =
    `${placed} photos • ${photoSize.options[photoSize.selectedIndex].text} • A4 • 300 DPI`;
}

photoInput.addEventListener("change",function(){

  const file = this.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    const img = new Image();

    img.onload = function(){

      uploadedImage = img;

      createSheet();
    };

    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
});

/*
  IMPORTANT:
  Changing either option immediately rebuilds the sheet.
*/
photoSize.addEventListener("change",createSheet);
photoCount.addEventListener("change",createSheet);

createBtn.addEventListener("click",createSheet);

downloadBtn.addEventListener("click",function(){

  if(!uploadedImage){

    alert("Please choose a photo first.");
    return;
  }

  createSheet();

  const link = document.createElement("a");

  link.download = "photo-sheet.jpg";

  link.href =
    canvas.toDataURL("image/jpeg",0.95);

  link.click();
});

resetBtn.addEventListener("click",function(){

  uploadedImage = null;

  photoInput.value = "";

  photoSize.value = "35x45";

  photoCount.value = "20";

  clearCanvas();

  info.textContent =
    "Choose a photo to preview the sheet";
});

clearCanvas();

</script>

</body>
</html>
