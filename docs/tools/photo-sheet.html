<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Sheet Maker</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6fb;
color:#182033;
}

.container{
max-width:760px;
margin:auto;
padding:18px;
}

h1{
text-align:center;
margin:10px 0 5px;
font-size:30px;
}

.subtitle{
text-align:center;
color:#687080;
margin-bottom:22px;
}

.card{
background:white;
border-radius:22px;
padding:20px;
margin-bottom:18px;
box-shadow:0 5px 25px rgba(0,0,0,.06);
}

label{
display:block;
font-weight:700;
margin-bottom:7px;
}

input,select{
width:100%;
padding:14px;
border:2px solid #d9dee8;
border-radius:12px;
font-size:17px;
background:white;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.upload{
display:block;
width:100%;
padding:22px;
border:2px dashed #4776e6;
border-radius:16px;
text-align:center;
font-size:20px;
font-weight:700;
color:#285dcc;
cursor:pointer;
}

.upload input{
display:none;
}

.preview-wrap{
background:#e9edf5;
padding:15px;
border-radius:18px;
overflow:auto;
-webkit-overflow-scrolling:touch;
}

canvas{
display:block;
background:white;
max-width:none;
height:auto;
box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.info{
text-align:center;
color:#6c7482;
font-size:16px;
margin:12px 0;
}

button{
width:100%;
border:0;
border-radius:14px;
padding:17px;
font-size:19px;
font-weight:700;
cursor:pointer;
margin-top:10px;
}

#create{
background:#2867df;
color:white;
}

#download{
background:#182033;
color:white;
}

#reset{
background:#e9ebf0;
color:#182033;
}

@media(max-width:520px){
.container{
padding:12px;
}

h1{
font-size:26px;
}

.grid{
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
padding:15px;
border-radius:18px;
}

input,select{
font-size:16px;
padding:12px;
}
}
</style>
</head>

<body>

<div class="container">

<h1>📸 Photo Sheet Maker</h1>
<div class="subtitle">Create a printable photo sheet with full manual control</div>

<div class="card">

<label class="upload">
📁 Choose Photo
<input type="file" id="photo" accept="image/*">
</label>

</div>

<div class="card">

<h2>⚙️ Manual Settings</h2>

<div class="grid">

<div>
<label>Photo Width (mm)</label>
<input id="photoW" type="number" value="35" min="1" step="0.1">
</div>

<div>
<label>Photo Height (mm)</label>
<input id="photoH" type="number" value="45" min="1" step="0.1">
</div>

<div>
<label>Number of Photos</label>
<input id="count" type="number" value="8" min="1" max="100">
</div>

<div>
<label>DPI</label>
<input id="dpi" type="number" value="300" min="72" max="1200">
</div>

<div>
<label>Paper</label>
<select id="paper">
<option value="A4">A4</option>
<option value="LETTER">Letter</option>
</select>
</div>

<div>
<label>Horizontal Gap (mm)</label>
<input id="gapX" type="number" value="3" min="0" step="0.5">
</div>

<div>
<label>Vertical Gap (mm)</label>
<input id="gapY" type="number" value="3" min="0" step="0.5">
</div>

<div>
<label>Top Margin (mm)</label>
<input id="marginTop" type="number" value="10" min="0" step="0.5">
</div>

<div>
<label>Left Margin (mm)</label>
<input id="marginLeft" type="number" value="10" min="0" step="0.5">
</div>

</div>

</div>

<div class="card">

<div class="preview-wrap">
<canvas id="canvas"></canvas>
</div>

<div id="info" class="info">
8 photos • 35 × 45 mm • A4 • 300 DPI
</div>

<button id="create">✨ Create Sheet</button>
<button id="download">⬇️ Download JPG</button>
<button id="reset">Reset</button>

</div>

</div>

<script>

const photoInput=document.getElementById("photo");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let image=null;

const photoW=document.getElementById("photoW");
const photoH=document.getElementById("photoH");
const count=document.getElementById("count");
const dpi=document.getElementById("dpi");
const paper=document.getElementById("paper");
const gapX=document.getElementById("gapX");
const gapY=document.getElementById("gapY");
const marginTop=document.getElementById("marginTop");
const marginLeft=document.getElementById("marginLeft");
const info=document.getElementById("info");

function mmToPx(mm,d){
return Math.round(mm*d/25.4);
}

function getPaper(){
if(paper.value==="LETTER"){
return {
w:215.9,
h:279.4
};
}

return {
w:210,
h:297
};
}

photoInput.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(e){

image=new Image();

image.onload=function(){
createSheet();
};

image.src=e.target.result;

};

reader.readAsDataURL(file);

});

function createSheet(){

if(!image){
drawEmpty();
return;
}

let d=parseInt(dpi.value)||300;

let pw=parseFloat(photoW.value)||35;
let ph=parseFloat(photoH.value)||45;

let total=parseInt(count.value)||8;

let gx=parseFloat(gapX.value)||0;
let gy=parseFloat(gapY.value)||0;

let mt=parseFloat(marginTop.value)||0;
let ml=parseFloat(marginLeft.value)||0;

let p=getPaper();

let canvasW=mmToPx(p.w,d);
let canvasH=mmToPx(p.h,d);

canvas.width=canvasW;
canvas.height=canvasH;

ctx.fillStyle="#ffffff";
ctx.fillRect(0,0,canvasW,canvasH);

let photoWidth=mmToPx(pw,d);
let photoHeight=mmToPx(ph,d);

let gapXPx=mmToPx(gx,d);
let gapYPx=mmToPx(gy,d);

let leftPx=mmToPx(ml,d);
let topPx=mmToPx(mt,d);

/*
IMPORTANT:
Photos ALWAYS start from the TOP-LEFT.
No automatic centering.
*/

let availableW=canvasW-leftPx;

let columns=Math.floor(
(availableW+gapXPx)/
(photoWidth+gapXPx)
);

if(columns<1)columns=1;

for(let i=0;i<total;i++){

let row=Math.floor(i/columns);
let col=i%columns;

let x=leftPx+
col*(photoWidth+gapXPx);

let y=topPx+
row*(photoHeight+gapYPx);

if(y+photoHeight>canvasH)break;

drawPhoto(image,x,y,photoWidth,photoHeight);

}

info.textContent=
`${total} photos • ${pw} × ${ph} mm • ${paper.value==="A4"?"A4":"Letter"} • ${d} DPI • ${columns} per row`;

}

function drawPhoto(img,x,y,w,h){

let ratio=Math.max(
w/img.width,
h/img.height
);

let sw=w/ratio;
let sh=h/ratio;

let sx=(img.width-sw)/2;
let sy=(img.height-sh)/2;

ctx.drawImage(
img,
sx,sy,sw,sh,
x,y,w,h
);

}

function drawEmpty(){

canvas.width=794;
canvas.height=1123;

ctx.fillStyle="#fff";
ctx.fillRect(0,0,canvas.width,canvas.height);

}

document.getElementById("create")
.addEventListener("click",createSheet);

document.getElementById("download")
.addEventListener("click",function(){

if(!image){
alert("Please choose a photo first.");
return;
}

createSheet();

const link=document.createElement("a");

link.download="photo-sheet.jpg";

link.href=canvas.toDataURL("image/jpeg",0.98);

link.click();

});

document.getElementById("reset")
.addEventListener("click",function(){

photoInput.value="";
image=null;

photoW.value=35;
photoH.value=45;
count.value=8;
dpi.value=300;
paper.value="A4";
gapX.value=3;
gapY.value=3;
marginTop.value=10;
marginLeft.value=10;

drawEmpty();

info.textContent=
"8 photos • 35 × 45 mm • A4 • 300 DPI";

});

[
photoW,
photoH,
count,
dpi,
paper,
gapX,
gapY,
marginTop,
marginLeft
].forEach(el=>{
el.addEventListener("input",()=>{
if(image)createSheet();
});
});

drawEmpty();

</script>

</body>
</html>
