<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Document Scanner - FormReady India</title>
<meta name="description" content="Scan documents using your mobile camera or upload images, correct perspective with adjustable corners, enhance pages with Magic, B&amp;W or grayscale filters, and combine multiple pages into a PDF. Optional PDF password and JPG export included. Fast, private and mobile &amp; desktop-friendly.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
:root {
  --bg: #151210;
  --panel: #1e1a17;
  --line: #39322b;
  --amber: #d99a3f;
  --amber-hover: #c48733;
  --paper: #f2ece2;
  --muted: #a89a89;
  --card-bg: #14110f;
  --danger: #ef4444;
  --success: #22c55e;
}
* {
  box-sizing: border-box;
}
body {
  background: var(--bg);
  color: var(--paper);
  font-family: "Inter", sans-serif;
  margin: 0;
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  touch-action: pan-y;
}
.wrapper {
  width: 100%;
  max-width: 540px;
  transition: max-width 0.2s ease;
}

/* Desktop & Tablet Optimization */
@media (min-width: 768px) {
  body { padding: 24px 16px; }
  .wrapper { max-width: 820px; }
  .card { padding: 24px !important; }
  .upload-grid { gap: 14px !important; }
  .btn-upload { padding: 18px 12px !important; font-size: 14px !important; }
  .canvas-holder { max-height: 56vh !important; }
  #crop-canvas { max-height: 56vh !important; }
  .filter-btn { padding: 10px 8px !important; font-size: 12px !important; }
  .page-card { min-width: 125px !important; max-width: 125px !important; }
  .page-thumb { width: 111px !important; height: 145px !important; }
}

.back-link {
  color: var(--amber);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  display: inline-block;
  margin-bottom: 12px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 16px;
  border-radius: 12px;
  width: 100%;
  margin-bottom: 14px;
}
h2 { color: var(--amber); margin: 0 0 4px 0; font-size: 20px; text-align: center; }
.subtitle { color: var(--muted); font-size: 12px; margin-bottom: 14px; text-align: center; }

.upload-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.btn-upload {
  border: 2px dashed var(--amber);
  background: rgba(217, 154, 63, 0.05);
  border-radius: 10px;
  padding: 14px 8px;
  text-align: center;
  cursor: pointer;
  color: var(--amber);
  font-weight: 600;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: background 0.2s;
}
.btn-upload:hover { background: rgba(217, 154, 63, 0.12); }
.btn-upload small { color: var(--muted); font-size: 10px; font-weight: normal; }

/* Stage Section - Never blocks page scroll */
.stage-section {
  display: none;
  margin-top: 10px;
}
.stage-header {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.canvas-holder {
  position: relative;
  width: 100%;
  max-height: 48vh;
  background: #0a0807;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: pan-y; /* Allows normal page scroll when not dragging a pin */
}
#crop-canvas {
  display: block;
  max-width: 100%;
  max-height: 48vh;
  width: auto;
  height: auto;
  cursor: crosshair;
  touch-action: pan-y;
}

.filter-row { margin: 12px 0; }
.filter-label {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  display: block;
}
.filter-options {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.filter-btn {
  background: #2a2420;
  border: 1px solid var(--line);
  color: var(--paper);
  padding: 8px 4px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s ease;
}
.filter-btn.active {
  border-color: var(--amber);
  background: rgba(217, 154, 63, 0.18);
  color: var(--amber);
}

.btn {
  background: var(--amber);
  color: var(--bg);
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  text-align: center;
  width: 100%;
  transition: opacity 0.2s;
}
.btn:hover { opacity: 0.9; }

.pages-container {
  display: none;
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  margin-top: 14px;
}
.pages-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--amber);
  margin-bottom: 10px;
}
.page-list {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 10px;
}
.page-card {
  min-width: 110px;
  max-width: 110px;
  background: #1b1714;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}
.page-thumb {
  width: 98px;
  height: 130px;
  object-fit: contain;
  border-radius: 4px;
  background: #ffffff;
  border: 1px solid var(--line);
  margin-bottom: 6px;
}
.page-controls {
  display: flex;
  gap: 4px;
  width: 100%;
  justify-content: center;
}
.mini-btn {
  background: #2a2420;
  color: var(--paper);
  border: 1px solid var(--line);
  padding: 4px 6px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
}
.mini-btn:hover { background: var(--amber); color: var(--bg); }
.mini-btn.del:hover { background: var(--danger); color: #fff; }

.export-card {
  display: none;
  margin-top: 14px;
  background: rgba(34, 197, 94, 0.05);
  border: 1px solid #15803d;
  border-radius: 10px;
  padding: 14px;
}
.pwd-group {
  position: relative;
  margin-bottom: 10px;
}
.pwd-input {
  width: 100%;
  background: #14110f;
  border: 1px solid var(--line);
  color: var(--paper);
  padding: 10px 38px 10px 10px;
  border-radius: 8px;
  font-size: 13px;
}
.eye-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  font-size: 16px;
  cursor: pointer;
}
.btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
</style>
</head>
<body>
<div class="wrapper">
  <a href="../../index.html" class="back-link">&larr; Back to Dashboard</a>

  <div class="card">
    <h2>Document Scanner</h2>
    <div class="subtitle">Capture document, fix perspective distortion, enhance, and merge to PDF</div>

    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="gallery-input" accept="image/*" style="display:none">

    <div class="upload-grid">
      <div class="btn-upload" id="open-camera">
        <span>📷 Take Photo</span>
        <small>Use Mobile Camera</small>
      </div>
      <div class="btn-upload" id="open-gallery">
        <span>📁 Upload Image</span>
        <small>From Phone Gallery</small>
      </div>
    </div>

    <div class="stage-section" id="stage-section">
      <div class="stage-header">
        <span>Drag 4 Amber pins to document corners:</span>
        <button type="button" class="mini-btn" id="auto-corners-btn">Reset Corners</button>
      </div>

      <div class="canvas-holder">
        <canvas id="crop-canvas"></canvas>
      </div>

      <div class="filter-row">
        <span class="filter-label">Select Enhance Filter:</span>
        <div class="filter-options">
          <button type="button" class="filter-btn active" data-filter="magic">Magic</button>
          <button type="button" class="filter-btn" data-filter="bw">B&W Clean</button>
          <button type="button" class="filter-btn" data-filter="gray">Grayscale</button>
          <button type="button" class="filter-btn" data-filter="orig">Original</button>
        </div>
      </div>

      <button class="btn" id="apply-page-btn">✂️ Fix Perspective & Add Page</button>
    </div>

    <div class="pages-container" id="pages-container">
      <div class="pages-title">
        <span id="page-count-badge">📄 Scanned Pages (0)</span>
        <button type="button" class="mini-btn" id="add-more-btn" style="color:var(--amber); border-color:var(--amber)">+ Scan Another Page</button>
      </div>
      <div class="page-list" id="page-list"></div>
    </div>

    <div class="export-card" id="export-card">
      <div style="font-size:13px; font-weight:700; color:#86efac; margin-bottom:8px; text-align:center;">
        Document Ready for Download
      </div>

      <div class="pwd-group">
        <input type="password" id="pdf-pwd" class="pwd-input" placeholder="PDF Password (Optional)">
        <button type="button" class="eye-btn" id="toggle-pwd-btn">👁️</button>
      </div>

      <div class="btn-grid">
        <button class="btn" id="dl-pdf-btn">Download PDF</button>
        <button class="btn" id="dl-jpg-btn" style="background:#2a2420; color:var(--paper); border:1px solid var(--line);">Download Current (JPG)</button>
      </div>
    </div>

  </div>
</div>
<script>
  const cameraInput = document.getElementById("camera-input");
  const galleryInput = document.getElementById("gallery-input");
  const openCameraBtn = document.getElementById("open-camera");
  const openGalleryBtn = document.getElementById("open-gallery");

  const stageSection = document.getElementById("stage-section");
  const cropCanvas = document.getElementById("crop-canvas");
  const cropCtx = cropCanvas.getContext("2d");
  const autoCornersBtn = document.getElementById("auto-corners-btn");
  const applyPageBtn = document.getElementById("apply-page-btn");

  const pagesContainer = document.getElementById("pages-container");
  const pageCountBadge = document.getElementById("page-count-badge");
  const pageList = document.getElementById("page-list");
  const addMoreBtn = document.getElementById("add-more-btn");

  const exportCard = document.getElementById("export-card");
  const pdfPwdInput = document.getElementById("pdf-pwd");
  const togglePwdBtn = document.getElementById("toggle-pwd-btn");
  const dlPdfBtn = document.getElementById("dl-pdf-btn");
  const dlJpgBtn = document.getElementById("dl-jpg-btn");

  let sourceImage = null;
  let corners = [];
  let activeCorner = -1;
  let selectedFilter = "magic";
  let scannedPages = [];

  openCameraBtn.addEventListener("click", () => cameraInput.click());
  openGalleryBtn.addEventListener("click", () => galleryInput.click());
  addMoreBtn.addEventListener("click", () => {
    stageSection.scrollIntoView({ behavior: "smooth" });
    openGalleryBtn.click();
  });

  cameraInput.addEventListener("change", handleFile);
  galleryInput.addEventListener("change", handleFile);

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      sourceImage = new Image();
      sourceImage.onload = () => { initCropStage(); };
      sourceImage.src = evt.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  function initCropStage() {
    const maxW = 900;
    let w = sourceImage.width;
    let h = sourceImage.height;
    if (w > maxW) {
      h = Math.round((h * maxW) / w);
      w = maxW;
    }

    cropCanvas.width = w;
    cropCanvas.height = h;

    const insetX = w * 0.06;
    const insetY = h * 0.06;
    corners = [
      { x: insetX, y: insetY },
      { x: w - insetX, y: insetY },
      { x: w - insetX, y: h - insetY },
      { x: insetX, y: h - insetY }
    ];

    stageSection.style.display = "block";
    drawStage();
    stageSection.scrollIntoView({ behavior: "smooth" });
  }

  autoCornersBtn.addEventListener("click", () => {
    if (sourceImage) initCropStage();
  });

  document.querySelectorAll(".filter-btn").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      selectedFilter = e.target.getAttribute("data-filter");
    });
  });

  // Accurate coordinate mapping for both mobile & desktop
  function getCanvasPos(e) {
    const rect = cropCanvas.getBoundingClientRect();
    const scaleX = cropCanvas.width / rect.width;
    const scaleY = cropCanvas.height / rect.height;
    const touch = e.touches ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
    return {
      x: (touch.clientX - rect.left) * scaleX,
      y: (touch.clientY - rect.top) * scaleY
    };
  }

  function findNearCorner(pos) {
    const rect = cropCanvas.getBoundingClientRect();
    // 42px screen hit radius makes tapping very easy
    const canvasHitRadius = 42 * (cropCanvas.width / rect.width);
    for (let i = 0; i < 4; i++) {
      const dx = pos.x - corners[i].x;
      const dy = pos.y - corners[i].y;
      if (Math.hypot(dx, dy) < canvasHitRadius) {
        return i;
      }
    }
    return -1;
  }

  // SMART TOUCH HANDLING:
  // If user touched a corner pin -> drag the pin, prevent default scroll.
  // If user touched anywhere else on image -> allow normal page scrolling!
  cropCanvas.addEventListener("touchstart", (e) => {
    const pos = getCanvasPos(e);
    const found = findNearCorner(pos);
    if (found !== -1) {
      activeCorner = found;
      e.preventDefault();
    } else {
      activeCorner = -1; // Normal page scroll allowed!
    }
  }, { passive: false });

  window.addEventListener("touchmove", (e) => {
    if (activeCorner !== -1) {
      e.preventDefault();
      const pos = getCanvasPos(e);
      corners[activeCorner].x = Math.max(0, Math.min(cropCanvas.width, pos.x));
      corners[activeCorner].y = Math.max(0, Math.min(cropCanvas.height, pos.y));
      drawStage();
    }
  }, { passive: false });

  window.addEventListener("touchend", () => {
    activeCorner = -1;
  });

  // Desktop Mouse Support
  cropCanvas.addEventListener("mousedown", (e) => {
    const pos = getCanvasPos(e);
    activeCorner = findNearCorner(pos);
  });

  window.addEventListener("mousemove", (e) => {
    if (activeCorner !== -1) {
      const pos = getCanvasPos(e);
      corners[activeCorner].x = Math.max(0, Math.min(cropCanvas.width, pos.x));
      corners[activeCorner].y = Math.max(0, Math.min(cropCanvas.height, pos.y));
      drawStage();
    }
  });

  window.addEventListener("mouseup", () => {
    activeCorner = -1;
  });

  function drawStage() {
    cropCtx.clearRect(0, 0, cropCanvas.width, cropCanvas.height);
    cropCtx.drawImage(sourceImage, 0, 0, cropCanvas.width, cropCanvas.height);

    // Quad polygon
    cropCtx.strokeStyle = "#d99a3f";
    cropCtx.lineWidth = 3;
    cropCtx.fillStyle = "rgba(217, 154, 63, 0.22)";
    cropCtx.beginPath();
    cropCtx.moveTo(corners[0].x, corners[0].y);
    cropCtx.lineTo(corners[1].x, corners[1].y);
    cropCtx.lineTo(corners[2].x, corners[2].y);
    cropCtx.lineTo(corners[3].x, corners[3].y);
    cropCtx.closePath();
    cropCtx.fill();
    cropCtx.stroke();

    // Large high-contrast touch pins
    corners.forEach((c) => {
      cropCtx.beginPath();
      cropCtx.arc(c.x, c.y, 16, 0, Math.PI * 2);
      cropCtx.fillStyle = "#d99a3f";
      cropCtx.fill();
      cropCtx.lineWidth = 3;
      cropCtx.strokeStyle = "#ffffff";
      cropCtx.stroke();
    });
  }

  function warpPerspective(srcCanvas, pts, dstW, dstH) {
    const [p0, p1, p2, p3] = pts;
    const dx1 = p1.x - p2.x, dx2 = p3.x - p2.x, sx = p0.x - p1.x + p2.x - p3.x;
    const dy1 = p1.y - p2.y, dy2 = p3.y - p2.y, sy = p0.y - p1.y + p2.y - p3.y;

    const det = dx1 * dy2 - dx2 * dy1;
    let a11, a12, a13, a21, a22, a23, a31, a32;

    if (Math.abs(det) < 0.0001) {
      a13 = 0; a23 = 0;
      a11 = p1.x - p0.x; a21 = p3.x - p0.x; a31 = p0.x;
      a12 = p1.y - p0.y; a22 = p3.y - p0.y; a32 = p0.y;
    } else {
      a13 = (sx * dy2 - sy * dx2) / det;
      a23 = (dx1 * sy - dy1 * sx) / det;
      a11 = p1.x - p0.x + a13 * p1.x;
      a21 = p3.x - p0.x + a23 * p3.x;
      a31 = p0.x;
      a12 = p1.y - p0.y + a13 * p1.y;
      a22 = p3.y - p0.y + a23 * p3.y;
      a32 = p0.y;
    }

    const outCanvas = document.createElement("canvas");
    outCanvas.width = dstW;
    outCanvas.height = dstH;
    const outCtx = outCanvas.getContext("2d");

    const srcCtx = srcCanvas.getContext("2d");
    const srcData = srcCtx.getImageData(0, 0, srcCanvas.width, srcCanvas.height).data;
    const outImgData = outCtx.createImageData(dstW, dstH);
    const outData = outImgData.data;

    const sw = srcCanvas.width;
    const sh = srcCanvas.height;

    for (let y = 0; y < dstH; y++) {
      const v = y / dstH;
      const a23_v = a23 * v + 1;
      const a21_v = a21 * v + a31;
      const a22_v = a22 * v + a32;
      let dstIdx = y * dstW * 4;

      for (let x = 0; x < dstW; x++) {
        const u = x / dstW;
        const denom = a13 * u + a23_v;
        const srcX = Math.round((a11 * u + a21_v) / denom);
        const srcY = Math.round((a12 * u + a22_v) / denom);

        if (srcX >= 0 && srcX < sw && srcY >= 0 && srcY < sh) {
          const srcIdx = (srcY * sw + srcX) * 4;
          outData[dstIdx] = srcData[srcIdx];
          outData[dstIdx + 1] = srcData[srcIdx + 1];
          outData[dstIdx + 2] = srcData[srcIdx + 2];
          outData[dstIdx + 3] = 255;
        } else {
          outData[dstIdx] = 255;
          outData[dstIdx + 1] = 255;
          outData[dstIdx + 2] = 255;
          outData[dstIdx + 3] = 255;
        }
        dstIdx += 4;
      }
    }

    outCtx.putImageData(outImgData, 0, 0);
    return outCanvas;
  }

  function applyFilter(canvas, filterType) {
    if (filterType === "orig") return;
    const ctx = canvas.getContext("2d");
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;

    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2];
      const gray = 0.299 * r + 0.587 * g + 0.114 * b;

      if (filterType === "magic") {
        let val = (gray - 120) * 1.45 + 120;
        if (val > 155) val = Math.min(255, val + 45);
        d[i] = Math.min(255, Math.max(0, r * 0.2 + val * 0.8));
        d[i+1] = Math.min(255, Math.max(0, g * 0.2 + val * 0.8));
        d[i+2] = Math.min(255, Math.max(0, b * 0.2 + val * 0.8));
      } else if (filterType === "bw") {
        const bw = gray > 130 ? 255 : Math.max(0, gray - 50);
        d[i] = bw;
        d[i+1] = bw;
        d[i+2] = bw;
      } else if (filterType === "gray") {
        d[i] = gray;
        d[i+1] = gray;
        d[i+2] = gray;
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }

  applyPageBtn.addEventListener("click", () => {
    if (!sourceImage) return;

    const topW = Math.hypot(corners[1].x - corners[0].x, corners[1].y - corners[0].y);
    const botW = Math.hypot(corners[2].x - corners[3].x, corners[2].y - corners[3].y);
    const leftH = Math.hypot(corners[3].x - corners[0].x, corners[3].y - corners[0].y);
    const rightH = Math.hypot(corners[2].x - corners[1].x, corners[2].y - corners[1].y);

    let dstW = Math.round(Math.max(topW, botW));
    let dstH = Math.round(Math.max(leftH, rightH));

    const maxDim = 900;
    if (dstW > maxDim || dstH > maxDim) {
      if (dstW > dstH) {
        dstH = Math.round((dstH * maxDim) / dstW);
        dstW = maxDim;
      } else {
        dstW = Math.round((dstW * maxDim) / dstH);
        dstH = maxDim;
      }
    }

    const unwarpedCanvas = warpPerspective(cropCanvas, corners, dstW, dstH);
    applyFilter(unwarpedCanvas, selectedFilter);

    const dataUrl = unwarpedCanvas.toDataURL("image/jpeg", 0.94);
    scannedPages.push({
      id: Date.now(),
      dataUrl,
      width: dstW,
      height: dstH
    });

    renderPageList();
    stageSection.style.display = "none";
    exportCard.style.display = "block";
    pagesContainer.style.display = "block";
    pagesContainer.scrollIntoView({ behavior: "smooth" });
  });

  function renderPageList() {
    pageList.innerHTML = "";
    pageCountBadge.textContent = `📄 Scanned Pages (${scannedPages.length})`;

    scannedPages.forEach((pg, idx) => {
      const card = document.createElement("div");
      card.className = "page-card";
      card.innerHTML = `
        <img src="${pg.dataUrl}" class="page-thumb" alt="Page ${idx + 1}">
        <span style="font-size:11px; margin-bottom:4px;">Page ${idx + 1}</span>
        <div class="page-controls">
          <button type="button" class="mini-btn" onclick="movePage(${idx}, -1)" ${idx === 0 ? "disabled" : ""}>◀</button>
          <button type="button" class="mini-btn" onclick="movePage(${idx}, 1)" ${idx === scannedPages.length - 1 ? "disabled" : ""}>▶</button>
          <button type="button" class="mini-btn del" onclick="deletePage(${idx})">🗑</button>
        </div>
      `;
      pageList.appendChild(card);
    });

    if (scannedPages.length === 0) {
      exportCard.style.display = "none";
      pagesContainer.style.display = "none";
    }
  }

  window.movePage = function(idx, dir) {
    const target = idx + dir;
    if (target < 0 || target >= scannedPages.length) return;
    const temp = scannedPages[idx];
    scannedPages[idx] = scannedPages[target];
    scannedPages[target] = temp;
    renderPageList();
  };

  window.deletePage = function(idx) {
    scannedPages.splice(idx, 1);
    renderPageList();
  };

  togglePwdBtn.addEventListener("click", () => {
    if (pdfPwdInput.type === "password") {
      pdfPwdInput.type = "text";
      togglePwdBtn.textContent = "🔒";
    } else {
      pdfPwdInput.type = "password";
      togglePwdBtn.textContent = "👁️";
    }
  });

  dlPdfBtn.addEventListener("click", async () => {
    if (scannedPages.length === 0) return;

    const { PDFDocument } = PDFLib;
    const pdfDoc = await PDFDocument.create();

    for (const pg of scannedPages) {
      const page = pdfDoc.addPage([pg.width, pg.height]);
      const jpgBytes = await fetch(pg.dataUrl).then(r => r.arrayBuffer());
      const embedded = await pdfDoc.embedJpg(jpgBytes);
      page.drawImage(embedded, {
        x: 0,
        y: 0,
        width: pg.width,
        height: pg.height
      });
    }

    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type: "application/pdf" });
    const link = document.createElement("a");
    link.download = `scanned_document_${scannedPages.length}_pages.pdf`;
    link.href = URL.createObjectURL(blob);
    link.click();
  });

  dlJpgBtn.addEventListener("click", () => {
    if (scannedPages.length === 0) return;
    const lastPage = scannedPages[scannedPages.length - 1];
    const link = document.createElement("a");
    link.download = `scanned_page_${scannedPages.length}.jpg`;
    link.href = lastPage.dataUrl;
    link.click();
  });
</script>
</body>
</html>
