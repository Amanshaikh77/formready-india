<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">


<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f7fb;
  color:#172033;
  font-family:Arial,Helvetica,sans-serif
}
.container{
  max-width:720px;
  margin:auto;
  padding:14px
}
h1{
  text-align:center;
  font-size:28px;
  margin:8px 0 5px
}
.subtitle{
  text-align:center;
  color:#707887;
  margin-bottom:18px
}
.card{
  background:#fff;
  border-radius:20px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 4px 18px rgba(0,0,0,.06)
}
.section-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px
}
canvas{
  width:100%;
  height:240px;
  display:block;
  background:#fff;
  border:2px dashed #6685d9;
  border-radius:14px;
  touch-action:none
}
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px
}
button{
  width:100%;
  height:48px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}
#clear{
  background:#e8ebf1;
  color:#172033
}
#download{
  background:#2867df;
  color:#fff
}
input[type=color]{
  width:100%;
  height:48px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:4px
}
input[type=range]{
  width:100%
}
label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:7px
}
.note{
  text-align:center;
  color:#707887;
  font-size:13px;
  line-height:1.5;
  margin-top:12px
}
</style>
<title>Signature Maker Online - Create Digital Signature | FormReady</title>
<meta name="description" content="Create and download a digital signature online. Free signature maker for Indian government forms, job applications and documents.">
<link rel="canonical" href="https://formready.in/tools/signature-maker.html">
</head>

<body>

<div class="container">

<h1>✍️ Signature Maker</h1>

<div class="subtitle">
Create and download your digital signature
</div>

<div class="card">

<div class="section-title">
✍️ Draw Your Signature
</div>

<canvas id="canvas"></canvas>

<div class="controls">
<button id="clear">↻ Clear</button>
<button id="download">⬇️ Download</button>
</div>

<label for="color">🖊️ Pen Color</label>
<input type="color" id="color" value="#172033">

<label for="size">📏 Pen Size</label>
<input type="range" id="size" min="1" max="10" value="3">

<div class="note">
Draw your signature with your finger on the box above.
Your signature stays on your device.
</div>

</div>

</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const color=document.getElementById("color");
const size=document.getElementById("size");
const clearBtn=document.getElementById("clear");
const downloadBtn=document.getElementById("download");

let drawing=false;

function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();
  const old=document.createElement("canvas");
  old.width=canvas.width;
  old.height=canvas.height;

  if(canvas.width && canvas.height){
    old.getContext("2d").drawImage(canvas,0,0);
  }

  canvas.width=rect.width;
  canvas.height=240;

  ctx.lineCap="round";
  ctx.lineJoin="round";

  if(old.width && old.height){
    ctx.drawImage(
      old,
      0,0,
      old.width,old.height,
      0,0,
      canvas.width,canvas.height
    );
  }
}

resizeCanvas();
window.addEventListener("resize",resizeCanvas);

function position(e){
  const rect=canvas.getBoundingClientRect();

  if(e.touches){
    return {
      x:e.touches[0].clientX-rect.left,
      y:e.touches[0].clientY-rect.top
    };
  }

  return {
    x:e.clientX-rect.left,
    y:e.clientY-rect.top
  };
}

function start(e){
  e.preventDefault();
  drawing=true;

  const p=position(e);

  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
}

function draw(e){
  if(!drawing)return;

  e.preventDefault();

  const p=position(e);

  ctx.strokeStyle=color.value;
  ctx.lineWidth=size.value;

  ctx.lineTo(p.x,p.y);
  ctx.stroke();
}

function stop(e){
  if(e)e.preventDefault();
  drawing=false;
  ctx.closePath();
}

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",draw);
canvas.addEventListener("mouseup",stop);
canvas.addEventListener("mouseleave",stop);

canvas.addEventListener("touchstart",start,{passive:false});
canvas.addEventListener("touchmove",draw,{passive:false});
canvas.addEventListener("touchend",stop,{passive:false});

clearBtn.addEventListener("click",function(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
});

downloadBtn.addEventListener("click",function(){

  const link=document.createElement("a");

  link.download="my-signature.png";
  link.href=canvas.toDataURL("image/png");

  document.body.appendChild(link);
  link.click();
  link.remove();

});

</script>

</body>
</html>
