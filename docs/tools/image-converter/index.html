<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Image Format Converter - FormReady India</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg: #151210; --panel: #1e1a17; --panel-2: #262019; --line: #39322b; --amber: #d99a3f; --amber-bright: #f0b158; --paper: #f2ece2; --muted: #a89a89; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--paper); font-family: 'Inter', sans-serif; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
.nav-bar { max-width: 600px; margin: 0 auto 20px; width: 100%; }
.back-btn { color: var(--amber); text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; color: var(--amber); margin-bottom: 6px; }
.header p { font-size: 13px; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; max-width: 600px; margin: 0 auto 24px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
.upload-zone { border: 2px dashed var(--line); padding: 24px 16px; text-align: center; border-radius: 10px; cursor: pointer; background: var(--panel-2); margin-bottom: 20px; display: block; width: 100%; }
.upload-zone b { color: var(--amber); }
#fileInput { display: none; }
.options-group { margin-bottom: 16px; }
.options-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.input-select, .range-input { width: 100%; padding: 12px 14px; background: var(--panel-2); border: 1px solid var(--line); color: var(--paper); border-radius: 8px; font-size: 14px; outline: none; }
.range-input { padding: 8px 0; accent-color: var(--amber); cursor: pointer; }
.btn { background: var(--amber); color: #151210; border: none; width: 100%; padding: 14px; border-radius: 9px; font-weight: 700; font-size: 14px; cursor: pointer; }
.btn:hover { background: var(--amber-bright); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-download { background: #2ea043; color: #fff; margin-top: 12px; display: none; }
footer { text-align: center; padding: 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); margin-top: auto; }
</style>
</head>
<body>
<div class="nav-bar"><a href="../../" class="back-btn">← Back to Dashboard</a></div>
<div class="header"><h1>Image Format Converter</h1><p>Convert JPG, PNG, and WebP images instantly offline</p></div>
<div class="card">
  <label for="fileInput" class="upload-zone">
    <div style="font-size:14px; color:var(--muted);">📁 Tap here to upload image<br><b>Supports JPG, PNG, WebP</b></div>
  </label>
  <input type="file" id="fileInput" accept="image/*">
  <div id="previewContainer" style="display:none; text-align:center; margin-bottom:20px;">
    <img id="imagePreview" style="max-width:100%; max-height:180px; border-radius:8px; border:1px solid var(--line); object-fit:contain;" alt="Preview">
    <p id="fileDetails" style="font-size:12px; color:var(--muted); margin-top:6px;"></p>
  </div>
  <div class="options-group">
    <label>Convert To Format:</label>
    <select id="formatSelect" class="input-select">
      <option value="image/jpeg">JPEG (.jpg)</option>
      <option value="image/png">PNG (.png)</option>
      <option value="image/webp">WebP (.webp)</option>
    </select>
  </div>
  <div class="options-group" id="qualityGroup">
    <label>Quality (<span id="qualityVal">90</span>%):</label>
    <input type="range" id="qualityRange" class="range-input" min="10" max="100" value="90">
  </div>
  <button class="btn" id="processBtn" disabled>Convert Image</button>
  <a id="downloadLink" style="text-decoration:none;"><button class="btn btn-download" id="downloadBtn">📥 Download Converted Image</button></a>
</div>
<footer>&copy; 2026 FormReady India. 100% Secure Client-Side Processing.</footer>
<script>
const fileInput = document.getElementById("fileInput");
const previewContainer = document.getElementById("previewContainer");
const imagePreview = document.getElementById("imagePreview");
const fileDetails = document.getElementById("fileDetails");
const formatSelect = document.getElementById("formatSelect");
const qualityRange = document.getElementById("qualityRange");
const qualityVal = document.getElementById("qualityVal");
const qualityGroup = document.getElementById("qualityGroup");
const processBtn = document.getElementById("processBtn");
const downloadBtn = document.getElementById("downloadBtn");
const downloadLink = document.getElementById("downloadLink");

let loadedImage = null;
let originalName = "";

qualityRange.addEventListener("input", (e) => {
  qualityVal.textContent = e.target.value;
});

formatSelect.addEventListener("change", (e) => {
  if (e.target.value === "image/png") {
    qualityGroup.style.opacity = "0.4";
    qualityRange.disabled = true;
  } else {
    qualityGroup.style.opacity = "1";
    qualityRange.disabled = false;
  }
});

fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  originalName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      imagePreview.src = event.target.result;
      previewContainer.style.display = "block";
      fileDetails.textContent = `${file.name} (${Math.round(file.size / 1024)} KB) - ${img.width}x${img.height}px`;
      processBtn.disabled = false;
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

processBtn.addEventListener("click", () => {
  if (!loadedImage) return;

  const canvas = document.createElement("canvas");
  canvas.width = loadedImage.width;
  canvas.height = loadedImage.height;
  const ctx = canvas.getContext("2d");

  const mime = formatSelect.value;
  if (mime === "image/jpeg") {
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  ctx.drawImage(loadedImage, 0, 0);

  const quality = mime === "image/png" ? 1.0 : parseInt(qualityRange.value, 10) / 100;
  const ext = mime.split('/')[1] === 'jpeg' ? 'jpg' : mime.split('/')[1];

  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    downloadLink.href = url;
    downloadLink.download = `${originalName}-converted.${ext}`;
    downloadBtn.style.display = "block";
    downloadBtn.textContent = `📥 Download Converted ${ext.toUpperCase()} (${Math.round(blob.size / 1024)} KB)`;
  }, mime, quality);
});
</script>
</body>
</html>
