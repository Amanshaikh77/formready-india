<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Image Format Converter - FormReady India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #151210;
  --panel: #1e1a17;
  --panel-2: #262019;
  --line: #39322b;
  --amber: #d99a3f;
  --amber-bright: #f0b158;
  --paper: #f2ece2;
  --muted: #a89a89;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--paper);
  font-family: 'Inter', sans-serif;
  padding: 16px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.nav-bar {
  max-width: 600px;
  margin: 0 auto 20px;
  width: 100%;
}
.back-btn {
  color: var(--amber);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.header { text-align: center; margin-bottom: 20px; }
.header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; color: var(--amber); margin-bottom: 6px; }
.header p { font-size: 13px; color: var(--muted); }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  max-width: 600px;
  margin: 0 auto 24px;
  width: 100%;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}
.upload-zone {
  border: 2px dashed var(--line);
  padding: 28px 16px;
  text-align: center;
  border-radius: 10px;
  cursor: pointer;
  background: var(--panel-2);
  transition: border-color 0.2s;
  margin-bottom: 20px;
  display: block;
  width: 100%;
}
.upload-zone:hover { border-color: var(--amber); }
#fileInput { display: none; }
.upload-text { font-size: 14px; color: var(--muted); line-height: 1.5; }
.upload-text b { color: var(--amber); }

.preview-container {
  display: none;
  text-align: center;
  margin-bottom: 20px;
}
.preview-img {
  max-width: 100%;
  max-height: 220px;
  border-radius: 8px;
  border: 1px solid var(--line);
  object-fit: contain;
}

.options-group {
  margin-bottom: 20px;
}
.options-group label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 8px;
  font-weight: 500;
}
.format-select, .quality-slider {
  width: 100%;
  padding: 12px 14px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--paper);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}
.quality-slider { padding: 4px 0; accent-color: var(--amber); }

.btn {
  background: var(--amber);
  color: #151210;
  border: none;
  width: 100%;
  padding: 14px;
  border-radius: 9px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s;
}
.btn:hover { background: var(--amber-bright); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-download { background: #2ea043; color: #fff; margin-top: 12px; display: none; }
.btn-download:hover { background: #3fb950; }

footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  margin-top: auto;
}
</style>
</head>
<body>

<div class="nav-bar">
  <a href="../../" class="back-btn">← Back to Dashboard</a>
</div>

<div class="header">
  <h1>Image Format Converter</h1>
  <p>Convert JPG, PNG, and WebP images instantly offline</p>
</div>

<div class="card">
  <label for="fileInput" class="upload-zone" id="dropZone">
    <div class="upload-text">📁 Tap here to upload image<br><b>Supports JPG, PNG, WebP</b></div>
  </label>
  <input type="file" id="fileInput" accept="image/jpeg, image/png, image/webp">

  <div class="preview-container" id="previewContainer">
    <img id="imagePreview" class="preview-img" alt="Preview">
    <p id="fileDetails" style="font-size:12px; color:var(--muted); margin-top:8px;"></p>
  </div>

  <div class="options-group">
    <label>Convert To Format:</label>
    <select id="targetFormat" class="format-select">
      <option value="image/jpeg">JPEG (.jpg)</option>
      <option value="image/png">PNG (.png)</option>
      <option value="image/webp">WebP (.webp)</option>
    </select>
  </div>

  <div class="options-group" id="qualityGroup">
    <label>Quality (<span id="qualityVal">90</span>%):</label>
    <input type="range" id="qualitySlider" class="quality-slider" min="10" max="100" value="90">
  </div>

  <button class="btn" id="convertBtn" disabled>Convert Image</button>
  <a id="downloadLink" style="text-decoration:none;"><button class="btn btn-download" id="downloadBtn">📥 Download Converted Image</button></a>
</div>

<footer>
  &copy; 2026 FormReady India. 100% Secure Client-Side Processing.
</footer>

<script>
const fileInput = document.getElementById("fileInput");
const previewContainer = document.getElementById("previewContainer");
const imagePreview = document.getElementById("imagePreview");
const fileDetails = document.getElementById("fileDetails");
const targetFormat = document.getElementById("targetFormat");
const qualitySlider = document.getElementById("qualitySlider");
const qualityVal = document.getElementById("qualityVal");
const qualityGroup = document.getElementById("qualityGroup");
const convertBtn = document.getElementById("convertBtn");
const downloadBtn = document.getElementById("downloadBtn");
const downloadLink = document.getElementById("downloadLink");

let loadedImage = null;
let originalName = "";

fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  originalName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
  const reader = new FileReader();
  
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      imagePreview.src = event.target.result;
      previewContainer.style.display = "block";
      fileDetails.textContent = `${file.name} (${Math.round(file.size / 1024)} KB) - ${img.width}x${img.height}px`;
      convertBtn.disabled = false;
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

targetFormat.addEventListener("change", (e) => {
  if (e.target.value === "image/png") {
    qualityGroup.style.display = "none";
  } else {
    qualityGroup.style.display = "block";
  }
});

qualitySlider.addEventListener("input", (e) => {
  qualityVal.textContent = e.target.value;
});

convertBtn.addEventListener("click", () => {
  if (!loadedImage) return;

  const canvas = document.createElement("canvas");
  canvas.width = loadedImage.width;
  canvas.height = loadedImage.height;
  const ctx = canvas.getContext("2d");

  if (targetFormat.value === "image/jpeg") {
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  ctx.drawImage(loadedImage, 0, 0);

  const format = targetFormat.value;
  const quality = format === "image/png" ? 1.0 : parseInt(qualitySlider.value, 10) / 100;

  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    let ext = "jpg";
    if (format === "image/png") ext = "png";
    else if (format === "image/webp") ext = "webp";

    downloadLink.href = url;
    downloadLink.download = `${originalName}-converted.${ext}`;
    
    downloadBtn.style.display = "block";
    downloadBtn.textContent = `📥 Download (${ext.toUpperCase()} - ${Math.round(blob.size / 1024)} KB)`;
  }, format, quality);
});
</script>
</body>
</html>
