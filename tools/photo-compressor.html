<script src="../token-system.js"></script>
<script>
const file=document.getElementById("file");
const preview=document.getElementById("preview");
const work=document.getElementById("work");
const quality=document.getElementById("quality");
const qualityValue=document.getElementById("qualityValue");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const info=document.getElementById("info");

let image=new Image();
let originalFile=null;
let compressedData=null;
let ready=false;

quality.addEventListener("input",function(){
qualityValue.textContent=this.value;
if(ready){compressImage();}
});

file.addEventListener("change",function(){
const selected=this.files[0];
if(!selected)return;
originalFile=selected;
const url=URL.createObjectURL(selected);
image.onload=function(){
ready=true;
preview.src=url;
work.style.display="block";
info.innerHTML="<strong>Original file:</strong> "+formatBytes(originalFile.size)+"<br><strong>Dimensions:</strong> "+image.width+" × "+image.height+" px";
compressedData=null;
URL.revokeObjectURL(url);
};
image.src=url;
});

function compressImage(){
if(!ready)return;
canvas.width=image.width;
canvas.height=image.height;
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(image,0,0);
const q=parseInt(quality.value)/100;
compressedData=canvas.toDataURL("image/jpeg",q);
const base64=compressedData.split(",")[1];
const bytes=Math.ceil((base64.length*3)/4);
const percent=originalFile.size>0?Math.max(0,Math.round((1-bytes/originalFile.size)*100)):0;
info.innerHTML="<strong>Original:</strong> "+formatBytes(originalFile.size)+"<br><strong>Compressed:</strong> "+formatBytes(bytes)+"<br><strong>Saved:</strong> "+percent+"%<br><strong>Quality:</strong> "+quality.value+"%";
}

document.getElementById("compress").onclick=function(){compressImage();};

document.getElementById("download").onclick=function(){
if(!ready)return;
if(!compressedData){compressImage();}
const link=document.createElement("a");
link.download="formready-compressed-photo.jpg";
link.href=compressedData;
link.click();
};

document.getElementById("reset").onclick=function(){
file.value="";
preview.removeAttribute("src");
work.style.display="none";
ready=false;
originalFile=null;
compressedData=null;
quality.value=80;
qualityValue.textContent="80";
};

function formatBytes(bytes){
if(bytes===0)return "0 Bytes";
const units=["Bytes","KB","MB","GB"];
const i=Math.floor(Math.log(bytes)/Math.log(1024));
return (bytes/Math.pow(1024,i)).toFixed(2)+" "+units[i];
}
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const rewardKey = "formready_reward_photo-compressor_" + new Date().toISOString().slice(0,10);
  function rewardUser() {
    if (localStorage.getItem(rewardKey)) return;
    if (window.FormReadyTokens) {
      window.FormReadyTokens.addTokens("photo-compressor");
    }
  }
  document.querySelectorAll(
    '#download, #downloadBtn, #downloadButton, button[id*="download" i], a[id*="download" i]'
  ).forEach(function(btn) {
    btn.addEventListener("click", function() {
      setTimeout(rewardUser, 1000);
    });
  });
  const originalAlert = window.alert;
  window.alert = function(msg) {
    if (msg && /download|success|created|converted|compressed|generated|saved/i.test(String(msg))) {
      setTimeout(rewardUser, 500);
    }
    originalAlert.apply(window, arguments);
  };
});
</script>
