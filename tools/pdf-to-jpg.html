<div class="container">

  <div class="card">
    <div class="card-head">
      <div class="icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <circle cx="10" cy="15" r="1.5"/>

      <p>Convert every page of a PDF file into a JPG image directly in your browser.</p>

        Convert PDF to JPG

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const fileInput = document.getElementById("pdfFile");
const convertBtn = document.getElementById("convertBtn");
const statusBox = document.getElementById("status");
const results = document.getElementById("results");
const fileNameLabel = document.getElementById("fileName");

fileInput.addEventListener("change", function(){
  results.innerHTML = "";
  statusBox.style.display = "none";

  if(this.files.length > 0){
    convertBtn.disabled = false;
    fileNameLabel.textContent = this.files[0].name;
  }else{
    convertBtn.disabled = true;
    fileNameLabel.textContent = "";
  }
});

function showStatus(message, error=false){
  statusBox.textContent = message;
  statusBox.style.display = "block";

  if(error){
    statusBox.classList.add("error");
  }else{
    statusBox.classList.remove("error");
  }
}

async function convertPDF(){

  const file = fileInput.files[0];

  if(!file){
    showStatus("Please select a PDF file.", true);
    return;
  }

  if(file.type !== "application/pdf"){
    showStatus("Please select a valid PDF file.", true);
    return;
  }

  convertBtn.disabled = true;
  results.innerHTML = "";

  try{

    showStatus("Reading PDF...");

    const arrayBuffer = await file.arrayBuffer();

    const pdf = await pdfjsLib.getDocument({
      data: arrayBuffer
    }).promise;

    showStatus("Converting " + pdf.numPages + " page(s)...");

    for(let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++){

      const page = await pdf.getPage(pageNumber);

      const viewport = page.getViewport({
        scale: 2
      });

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;

      const pageBox = document.createElement("div");
      pageBox.className = "page";

      const title = document.createElement("h3");
      title.textContent = "Page " + pageNumber;

      const downloadButton = document.createElement("button");
      downloadButton.className = "download";
      downloadButton.textContent = "Download JPG";

      downloadButton.onclick = function(){

        canvas.toBlob(function(blob){

          if(!blob){
            showStatus("Could not create JPG.", true);
            return;
          }

          const url = URL.createObjectURL(blob);

          const a = document.createElement("a");
          a.href = url;
          a.download = "page-" + pageNumber + ".jpg";

          document.body.appendChild(a);
          a.click();
          a.remove();

          setTimeout(function(){
            URL.revokeObjectURL(url);
          },1000);

        },"image/jpeg",0.92);

      };

      pageBox.appendChild(title);
      pageBox.appendChild(canvas);
      pageBox.appendChild(downloadButton);

      results.appendChild(pageBox);
    }

    showStatus(
      "Done! " + pdf.numPages + " page(s) converted successfully."
    );

  }catch(error){

    console.error(error);

    showStatus(
      "Could not convert this PDF. Please try another PDF file.",
      true
    );

  }finally{

    convertBtn.disabled = false;

  }
}
</script>


<script>
document.addEventListener("DOMContentLoaded", function() {
  const rewardKey = "formready_reward_pdf-to-jpg_" + new Date().toISOString().slice(0,10);

  function rewardUser() {
    if (localStorage.getItem(rewardKey)) return;
    if (window.FormReadyTokens) {
      window.FormReadyTokens.addTokens("pdf-to-jpg");
    }
  }

  document.querySelectorAll(
    '#download, #downloadBtn, #downloadButton, button[id*="download" i], a[id*="download" i]'
  ).forEach(function(btn) {
    btn.addEventListener("click", function() {
      setTimeout(rewardUser, 1000);
    });
  });

  const originalAlert = window.alert;
  window.alert = function(msg) {
    if (msg && /download|success|created|converted|compressed|generated|saved/i.test(String(msg))) {
      setTimeout(rewardUser, 500);
    }
    originalAlert.apply(window, arguments);
  };
});
</script>
