<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormReady India - Fast, Simple & Private Toolbox</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: #38bdf8;
    }
    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.9rem;
    }
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .search-box {
      width: 100%;
      max-width: 600px;
      margin: 0 auto 2rem auto;
      display: block;
      padding: 0.75rem 1rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      color: white;
      font-size: 1rem;
    }
    .section-title {
      font-size: 1.1rem;
      color: #38bdf8;
      margin-bottom: 1rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
    }
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .tool-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .tool-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }
    .tool-title {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: #f1f5f9;
    }
    .tool-desc {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1rem;
    }
    .badge {
      display: inline-block;
      background: #065f46;
      color: #34d399;
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">FormReady India</div>
    <div class="nav-links">
      <a href="#">Tools</a>
      <a href="#">About</a>
    </div>
  </header>

  <div class="main-container">
    <input type="text" class="search-box" placeholder="🔍 Search any tool (e.g. Signature, PDF)...">

    <div class="section-title">⚡ Image & Photo Utilities</div>
    <div class="tools-grid">
      <a href="signature.html" class="tool-card">
        <div class="tool-title">✍️ Signature Maker</div>
        <div class="tool-desc">Draw, smooth, and export transparent digital signatures to JPG & PDF.</div>
        <span class="badge">ACTIVE TOOL</span>
      </a>
    </div>

    <div class="section-title">📄 PDF Tools & Editors</div>
    <div class="tools-grid">
      <a href="pdf-editor.html" class="tool-card">
        <div class="tool-title">📑 PDF Text Inspector & Editor</div>
        <div class="tool-desc">Edit text, handle anti-overlap layout reflow, and export edited PDFs.</div>
        <span class="badge">ACTIVE TOOL</span>
      </a>
    </div>
  </div>
</body>
</html>
