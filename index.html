<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FormReady India - 100% Private Offline Document Toolbox</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13100e;
  --panel: #1c1815;
  --panel-hover: #26211c;
  --line: #2e2620;
  --amber: #d99a3f;
  --amber-soft: rgba(217, 154, 63, 0.12);
  --paper: #f3ede2;
  --muted: #9e9080;
  --active: #34d399;
  --coming: #fbbf24;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--paper);
  font-family: 'Plus Jakarta Sans', sans-serif;
  padding: 16px 14px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.container { width: 100%; max-width: 980px; }

/* HEADER */
.hero-header {
  text-align: center;
  padding: 24px 14px 18px;
  margin-bottom: 22px;
  background: radial-gradient(ellipse at top, rgba(217, 154, 63, 0.16) 0%, transparent 70%);
  border-bottom: 1px solid var(--line);
}
.hero-title {
  color: #fff;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}
.hero-title span { color: var(--amber); }
.hero-tagline {
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 12px;
}
.author-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--amber-soft);
  border: 1px solid rgba(217, 154, 63, 0.3);
  color: var(--amber);
  padding: 4px 14px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
}

/* SEARCH & FILTER */
.search-box { width: 100%; margin-bottom: 16px; }
.search-input {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--paper);
  font-size: 14.5px;
  padding: 13px 16px;
  border-radius: 12px;
  outline: none;
  transition: 0.2s border;
}
.search-input:focus { border-color: var(--amber); }

.filters-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 12px;
  margin-bottom: 16px;
  scrollbar-width: none;
}
.filters-bar::-webkit-scrollbar { display: none; }
.filter-chip {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 10px;
  white-space: nowrap;
  cursor: pointer;
  transition: 0.15s;
}
.filter-chip.active, .filter-chip:hover {
  background: var(--amber);
  color: #13100e;
  border-color: var(--amber);
}

/* SECTION TITLES & PROPER BREATHING ROOM */
.section-wrapper {
  margin-top: 36px;
}
.section-title {
  color: var(--amber);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.section-desc {
  color: var(--muted);
  font-size: 12.5px;
  margin-bottom: 16px;
  line-height: 1.45;
}

/* CARDS GRID - PHONE SINGLE COLUMN, DESKTOP 3 COLUMNS */
.tools-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media (min-width: 680px) {
  .tools-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
}
@media (min-width: 960px) {
  .tools-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
}

/* TOUCH-FRIENDLY FULL WIDTH CARDS */
.tool-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 14px;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  transition: transform 0.15s, border-color 0.15s, background 0.15s;
}
.tool-card:hover {
  background: var(--panel-hover);
  border-color: var(--amber);
  transform: translateY(-2px);
}
.card-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}
.card-icon {
  font-size: 24px;
  line-height: 1;
  flex-shrink: 0;
}
.card-info {
  flex: 1;
}
.card-title {
  color: var(--paper);
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 3px;
  line-height: 1.3;
}
.card-desc {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}
.card-right {
  flex-shrink: 0;
}
.status-badge {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 4px 7px;
  border-radius: 5px;
  text-transform: uppercase;
  display: inline-block;
  white-space: nowrap;
}
.badge-active {
  background: rgba(52, 211, 153, 0.1);
  color: var(--active);
  border: 1px solid rgba(52, 211, 153, 0.25);
}
.badge-coming {
  background: rgba(251, 191, 36, 0.1);
  color: var(--coming);
  border: 1px solid rgba(251, 191, 36, 0.25);
}

footer {
  text-align: center;
  margin-top: 48px;
  font-size: 11.5px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 20px;
  width: 100%;
}
</style>
</head>
<body>
<div class="container">

  <header class="hero-header">
    <h1 class="hero-title">FormReady <span>India</span></h1>
    <p class="hero-tagline">Fast, Mobile-Friendly & 100% Private Offline Document Toolbox</p>
    <div class="author-pill">
      <span>✨</span> Made by Aman Shaikh
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search any tool..." onkeyup="filterTools()">
  </div>

  <div class="filters-bar" id="categoryChips">
    <button class="filter-chip active" onclick="selectCategory('all', this)">All Tools</button>
    <button class="filter-chip" onclick="selectCategory('image', this)">📷 Image & Photo</button>
    <button class="filter-chip" onclick="selectCategory('govt', this)">🇮🇳 Govt Form & ID</button>
    <button class="filter-chip" onclick="selectCategory('pdf', this)">📄 PDF Tools</button>
    <button class="filter-chip" onclick="selectCategory('text', this)">📝 Text Utilities</button>
    <button class="filter-chip" onclick="selectCategory('calc', this)">🧮 Calculators</button>
  </div>

  <main id="toolsContainer"></main>

  <footer>
    &copy; 2026 FormReady India &bull; Zero Server Uploads &bull; 100% Secure Local Processing
  </footer>

</div>

<script>
const TOOL_CATALOG = [
  {
    category: "image",
    sectionTitle: "📷 Image & Photo Utilities",
    sectionDesc: "High-resolution photo editing, precision cropping, and background tools",
    items: [
      { title: "Image Format Converter", desc: "Instant format swap: JPG, PNG, and WebP offline.", icon: "🔄", slug: "image-converter", status: "active" },
      { title: "Photo Cropper", desc: "Touch-friendly precision aspect-ratio cropper for photos.", icon: "✂️", slug: "photo-cropper", status: "active" },
      { title: "Photo Resizer", desc: "Resize dimensions in pixels, cm, or mm directly.", icon: "📐", slug: "photo-resizer", status: "active" },
      { title: "Photo Compressor", desc: "Shrink photo KB/MB size while maintaining crisp clarity.", icon: "🗜️", slug: "photo-compressor", status: "active" },
      { title: "Passport Photo Maker", desc: "Print standard passport photos with clean borders.", icon: "👤", slug: "passport-photo", status: "active" },
      { title: "Photo Sheet Maker", desc: "Printable A4 grid sheets with multiple photo copies.", icon: "🖨️", slug: "photo-sheet", status: "active" },
      { title: "Background Remover", desc: "Client-side transparent background cutter for IDs.", icon: "🪄", slug: "background-remover", status: "active" },
      { title: "Signature Maker", desc: "Sleek, smooth, and export transparent digital signatures.", icon: "✍️", slug: "signature-maker", status: "active" },
      { title: "Image to Text (OCR)", desc: "Extract text accurately from any photo or scanned receipt.", icon: "👁️", slug: "image-to-text", status: "active" }
    ]
  },
  {
    category: "govt",
    sectionTitle: "🇮🇳 Indian Govt Form & ID Utilities",
    sectionDesc: "Official Indian exam & recruitment portal formats (SSC, UPSC, State IDs)",
    items: [
      { title: "Aadhaar / PAN Photo Resizer", desc: "Strict 200x230 px & exact file size limit cropper/resizer.", icon: "🪪", slug: "aadhaar-pan-photo-resizer", status: "active" },
      { title: "Signature Resizer & Enhancer", desc: "Strict size-limit with contrast boost for exam portal upload.", icon: "🖋️", slug: "signature-resizer", status: "active" },
      { title: "Passport Photo + Sign Card", desc: "Merge identity photo and signature onto a single unified frame.", icon: "👥", slug: "passport-photo-sign-card", status: "active" },
      { title: "Document Scanner", desc: "Camera scan with high-contrast B&W clean doc filter.", icon: "📄", slug: "document-scanner", status: "active" },
      { title: "Govt Form PDF Helper", desc: "Compress & fit PDF strictly under required portal limits.", icon: "📋", slug: "govt-pdf-helper", status: "active" }
    ]
  },
  {
    category: "pdf",
    sectionTitle: "📄 PDF Tools & Editors",
    sectionDesc: "Client-side private PDF manipulation, inspection, and redaction",
    items: [
      { title: "PDF Text Inspector & Editor", desc: "Inspect text, redactions, and fonts on PDFs securely.", icon: "📑", slug: "pdf-editor", status: "active" },
      { title: "Merge PDF", desc: "Combine multiple PDF documents into one indexed file.", icon: "🔗", slug: "merge-pdf", status: "active" },
      { title: "Split PDF", desc: "Extract pages or custom page ranges into a new PDF.", icon: "✂️", slug: "split-pdf", status: "active" },
      { title: "JPG to PDF", desc: "Convert photos and image files into multi-page PDFs.", icon: "🖼️", slug: "jpg-to-pdf", status: "active" },
      { title: "PDF to JPG", desc: "Extract high-resolution JPG images from PDF pages.", icon: "📸", slug: "pdf-to-jpg", status: "active" },
      { title: "Compress PDF", desc: "Client-side file size compressor keeping clarity intact.", icon: "🗜️", slug: "compress-pdf", status: "active" },
      { title: "Rotate PDF", desc: "Fix orientation of 90°, 180°, or inverted pages.", icon: "🔃", slug: "rotate-pdf", status: "active" },
      { title: "PDF Page Organizer", desc: "Drag to reorder pages or delete unwanted sheets.", icon: "📑", slug: "pdf-organizer", status: "coming" },
      { title: "Add Watermark", desc: "Stamp confidential or custom text/logo over PDF pages.", icon: "💧", slug: "add-watermark", status: "active" }
    ]
  },
  {
    category: "text",
    sectionTitle: "📝 Text, Code & Content Tools",
    sectionDesc: "Quick string formatters, counters, and offline code utilities",
    items: [
      { title: "Word & Character Counter", desc: "Real-time count of words, characters, and reading time.", icon: "🔢", slug: "word-counter", status: "coming" },
      { title: "Case Converter", desc: "Toggle UPPERCASE, lower case, Title Case & camelCase.", icon: "🔠", slug: "case-converter", status: "coming" },
      { title: "Text Cleaner", desc: "Strip accidental double spaces, tabs, and blank lines.", icon: "🧹", slug: "text-cleaner", status: "coming" },
      { title: "QR Code Generator", desc: "Create QR codes for links, UPI payments, and Wi-Fi.", icon: "🏁", slug: "qr-generator", status: "coming" },
      { title: "Barcode Generator", desc: "Generate standard barcodes easily.", icon: "📊", slug: "barcode-generator", status: "coming" },
      { title: "Text to PDF / Image", desc: "Convert plain text notes into a printable document.", icon: "📄", slug: "text-to-pdf", status: "coming" },
      { title: "Lorem Ipsum Generator", desc: "Generate placeholder text for layouts and forms.", icon: "📜", slug: "lorem-ipsum", status: "coming" }
    ]
  },
  {
    category: "calc",
    sectionTitle: "🧮 Daily & Finance Calculators",
    sectionDesc: "Instant eligibility calculations, loan EMI, GST, and daily math tools",
    items: [
      { title: "Govt Form Age Calculator", desc: "Calculate exact age as on notification date (Y/M/D).", icon: "🎂", slug: "age-calculator", status: \"active\" },
      { title: "GST Calculator", desc: "Breakdown CGST, SGST & total amount (add/remove).", icon: "📊", slug: "gst-calculator", status: \"active\" },
      { title: "EMI Calculator", desc: "Calculate monthly installments and total loan interest.", icon: "💳", slug: "emi-calculator", status: "coming" },
      { title: "Percentage & Discount", desc: "Instant shopping discounts, markups, and margins.", icon: "🏷️", slug: "discount-calculator", status: "coming" },
      { title: "BMI & Health Calculator", desc: "Body Mass Index calculation with health bracket indicators.", icon: "⚖️", slug: "bmi-calculator", status: "coming" },
      { title: "Date Gap Calculator", desc: "Exact days, weeks, and month gaps between two dates.", icon: "📅", slug: "date-gap-calculator", status: "coming" },
      { title: "Unit Converter", desc: "Convert Land, Weight, Length & Units.", icon: "📐", slug: "unit-converter", status: "coming" },
      { title: "Currency Converter", desc: "Quick currency rate estimations and conversions.", icon: "💱", slug: "currency-converter", status: "coming" }
    ]
  }
];

let activeFilter = 'all';

function renderTools(searchQuery = '') {
  const container = document.getElementById('toolsContainer');
  container.innerHTML = '';

  TOOL_CATALOG.forEach(sec => {
    if (activeFilter !== 'all' && sec.category !== activeFilter) return;

    const filteredItems = sec.items.filter(item => 
      item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
      item.desc.toLowerCase().includes(searchQuery.toLowerCase())
    );

    if (filteredItems.length === 0) return;

    const sectionEl = document.createElement('div');
    sectionEl.className = 'section-wrapper';
    sectionEl.innerHTML = `
      <div class="section-title">${sec.sectionTitle}</div>
      <div class="section-desc">${sec.sectionDesc}</div>
      <div class="tools-grid">
        ${filteredItems.map(item => `
          <a href="tools/${item.slug}/index.html" class="tool-card">
            <div class="card-left">
              <span class="card-icon">${item.icon}</span>
              <div class="card-info">
                <div class="card-title">${item.title}</div>
                <div class="card-desc">${item.desc}</div>
              </div>
            </div>
            <div class="card-right">
              <span class="status-badge ${item.status === 'active' ? 'badge-active' : 'badge-coming'}">
                ${item.status === 'active' ? 'ACTIVE' : 'SOON'}
              </span>
            </div>
          </a>
        `).join('')}
      </div>
    `;
    container.appendChild(sectionEl);
  });
}

function selectCategory(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderTools(document.getElementById('searchInput').value);
}

function filterTools() {
  renderTools(document.getElementById('searchInput').value);
}

renderTools();
</script>
</body>
</html>
