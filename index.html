<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FormReady India - 100% Private Offline Document Toolbox</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13100e;
  --panel: #1c1815;
  --panel-hover: #26211c;
  --line: #2e2620;
  --amber: #d99a3f;
  --amber-soft: rgba(217, 154, 63, 0.12);
  --paper: #f3ede2;
  --muted: #9e9080;
  --active: #34d399;
  --coming: #fbbf24;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--paper);
  font-family: 'Plus Jakarta Sans', sans-serif;
  padding: 16px 14px 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.container { width: 100%; max-width: 980px; }

/* HEADER */
.hero-header {
  text-align: center;
  padding: 24px 14px 18px;
  margin-bottom: 22px;
  background: radial-gradient(ellipse at top, rgba(217, 154, 63, 0.16) 0%, transparent 70%);
  border-bottom: 1px solid var(--line);
}
.hero-title {
  color: #fff;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}
.hero-title span { color: var(--amber); }
.hero-tagline {
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 12px;
}
.author-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--amber-soft);
  border: 1px solid rgba(217, 154, 63, 0.3);
  color: var(--amber);
  padding: 4px 14px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
}

/* SEARCH & FILTER */
.search-box { width: 100%; margin-bottom: 16px; }
.search-input {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--paper);
  font-size: 14.5px;
  padding: 13px 16px;
  border-radius: 12px;
  outline: none;
  transition: 0.2s border;
}
.search-input:focus { border-color: var(--amber); }

.filters-bar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 12px;
  margin-bottom: 16px;
  scrollbar-width: none;
}
.filters-bar::-webkit-scrollbar { display: none; }
.filter-chip {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 10px;
  white-space: nowrap;
  cursor: pointer;
  transition: 0.15s;
}
.filter-chip.active, .filter-chip:hover {
  background: var(--amber);
  color: #13100e;
  border-color: var(--amber);
}

/* SECTION TITLES & PROPER BREATHING ROOM */
.section-wrapper {
  margin-top: 36px;
}
.section-title {
  color: var(--amber);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.section-desc {
  color: var(--muted);
  font-size: 12.5px;
  margin-bottom: 16px;
  line-height: 1.45;
}

/* CARDS GRID - PHONE SINGLE COLUMN, DESKTOP 3 COLUMNS */
.tools-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media (min-width: 680px) {
  .tools-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
}
@media (min-width: 960px) {
  .tools-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
}

/* TOUCH-FRIENDLY FULL WIDTH CARDS */
.tool-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 14px;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  transition: transform 0.15s, border-color 0.15s, background 0.15s;
}
.tool-card:hover {
  background: var(--panel-hover);
  border-color: var(--amber);
  transform: translateY(-2px);
}
.card-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}
.card-icon {
  font-size: 24px;
  line-height: 1;
  flex-shrink: 0;
}
.card-info {
  flex: 1;
}
.card-title {
  color: var(--paper);
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 3px;
  line-height: 1.3;
}
.card-desc {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}
.card-right {
  flex-shrink: 0;
}
.status-badge {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 4px 7px;
  border-radius: 5px;
  text-transform: uppercase;
  display: inline-block;
  white-space: nowrap;
}
.badge-active {
  background: rgba(52, 211, 153, 0.1);
  color: var(--active);
  border: 1px solid rgba(52, 211, 153, 0.25);
}
.badge-coming {
  background: rgba(251, 191, 36, 0.1);
  color: var(--coming);
  border: 1px solid rgba(251, 191, 36, 0.25);
}

footer {
  text-align: center;
  margin-top: 48px;
  font-size: 11.5px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 20px;
  width: 100%;
}
</style>
</head>
<body>
<div class="container">

  <header class="hero-header">
    <h1 class="hero-title">FormReady <span>India</span></h1>
    <p class="hero-tagline">Fast, Mobile-Friendly & 100% Private Offline Document Toolbox</p>
    <div class="author-pill">
      <span>✨</span> Made by Aman Shaikh
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search any tool..." onkeyup="filterTools()">
  </div>

  <div class="filters-bar" id="categoryChips">
    <button class="filter-chip active" onclick="selectCategory('all', this)">All Tools</button>
    <button class="filter-chip" onclick="selectCategory('image', this)">📷 Image & Photo</button>
    <button class="filter-chip" onclick="selectCategory('govt', this)">🇮🇳 Govt Form & ID</button>
    <button class="filter-chip" onclick="selectCategory('pdf', this)">📄 PDF Tools</button>
    <button class="filter-chip" onclick="selectCategory('text', this)">📝 Text Utilities</button>
    <button class="filter-chip" onclick="selectCategory('calc', this)">🧮 Calculators</button>
  </div>

  <main id="toolsContainer"></main>

  <footer>
    &copy; 2026 FormReady India &bull; Zero Server Uploads &bull; 100% Secure Local Processing
  </footer>

</div>

<script>
const TOOL_CATALOG = [
  {
    category: "image",
    sectionTitle: "📷 Image & Photo Utilities",
    sectionDesc: "High-resolution photo editing, precision cropping, and background tools",
    items: [
      ["Image Format Converter","Instant format swap: JPG, PNG, and WebP offline.","🔄","image-converter","active"],
      ["Photo Cropper","Touch-friendly precision aspect-ratio cropper for photos.","✂️","photo-cropper","active"],
      ["Photo Resizer","Resize dimensions in pixels, cm, or mm directly.","📐","photo-resizer","active"],
      ["Photo Compressor","Shrink photo KB/MB size while maintaining crisp clarity.","🗜️","photo-compressor","active"],
      ["Passport Photo Maker","Print standard passport photos with clean borders.","👤","passport-photo","active"],
      ["Photo Sheet Maker","Printable A4 grid sheets with multiple photo copies.","🖨️","photo-sheet","active"],
      ["Background Remover","Client-side transparent background cutter for IDs.","🪄","background-remover","active"],
      ["Signature Maker","Sleek, smooth, and export transparent digital signatures.","✍️","signature-maker","active"],
      ["Image to Text (OCR)","Extract text accurately from any photo or scanned receipt.","👁️","image-to-text","active"]
    ]
  },
  {
    category: "govt",
    sectionTitle: "🇮🇳 Indian Govt Form & ID Utilities",
    sectionDesc: "Official Indian exam & recruitment portal formats",
    items: [
      ["Aadhaar / PAN Photo Resizer","Strict 200x230 px & exact file size limit cropper/resizer.","🪪","aadhaar-pan-photo-resizer","active"],
      ["Signature Resizer & Enhancer","Strict size-limit with contrast boost for exam portal upload.","🖋️","signature-resizer","active"],
      ["Passport Photo + Sign Card","Merge identity photo and signature onto a single frame.","👥","passport-photo-sign-card","active"],
      ["Document Scanner","Camera scan with high-contrast B&W clean doc filter.","📄","document-scanner","active"],
      ["Govt Form PDF Helper","Compress & fit PDF strictly under required portal limits.","📋","govt-pdf-helper","active"]
    ]
  },
  {
    category: "pdf",
    sectionTitle: "📄 PDF Tools & Editors",
    sectionDesc: "Client-side private PDF manipulation, inspection, and redaction",
    items: [
      ["PDF Text Inspector & Editor","Inspect text, redactions, and fonts on PDFs securely.","📑","pdf-editor","active"],
      ["Merge PDF","Combine multiple PDF documents into one indexed file.","🔗","merge-pdf","active"],
      ["Split PDF","Extract pages or custom page ranges into a new PDF.","✂️","split-pdf","active"],
      ["JPG to PDF","Convert photos and image files into multi-page PDFs.","🖼️","jpg-to-pdf","active"],
      ["PDF to JPG","Extract high-resolution JPG images from PDF pages.","📸","pdf-to-jpg","active"],
      ["Compress PDF","Client-side file size compressor keeping clarity intact.","🗜️","compress-pdf","active"],
      ["Rotate PDF","Fix orientation of 90°, 180°, or inverted pages.","🔃","rotate-pdf","active"],
      ["PDF Page Organizer","Drag to reorder pages or delete unwanted sheets.","📑","pdf-organizer","coming"],
      ["Add Watermark","Stamp confidential or custom text/logo over PDF pages.","💧","add-watermark","active"]
    ]
  },
  {
    category: "text",
    sectionTitle: "📝 Text, Code & Content Tools",
    sectionDesc: "Quick string formatters, counters, and offline code utilities",
    items: [
      ["Word & Character Counter","Real-time count of words, characters, and reading time.","🔢","word-counter","coming"],
      ["Case Converter","Toggle UPPERCASE, lower case, Title Case & camelCase.","🔠","case-converter","coming"],
      ["Text Cleaner","Strip accidental double spaces, tabs, and blank lines.","🧹","text-cleaner","coming"],
      ["QR Code Generator","Create QR codes for links, UPI payments, and Wi-Fi.","🏁","qr-generator","coming"],
      ["Barcode Generator","Generate standard barcodes easily.","📊","barcode-generator","coming"],
      ["Text to PDF / Image","Convert plain text notes into a printable document.","📄","text-to-pdf","coming"],
      ["Lorem Ipsum Generator","Generate placeholder text for layouts and forms.","📜","lorem-ipsum","coming"]
    ]
  },
  {
    category: "calc",
    sectionTitle: "🧮 Daily & Finance Calculators",
    sectionDesc: "Instant eligibility calculations, loan EMI, GST, and daily math tools",
    items: [
      ["Govt Form Age Calculator","Calculate exact age as on notification date (Y/M/D).","🎂","age-calculator","active"],
      ["GST Calculator","Breakdown CGST, SGST & total amount (add/remove).","📊","gst-calculator","active"],
      ["EMI Calculator","Calculate monthly installments and total loan interest.","💳","emi-calculator","coming"],
      ["Percentage & Discount","Instant shopping discounts, markups, and margins.","🏷️","discount-calculator","coming"],
      ["BMI & Health Calculator","Body Mass Index calculation with health bracket indicators.","⚖️","bmi-calculator","coming"],
      ["Date Gap Calculator","Exact days, weeks, and month gaps between two dates.","📅","date-gap-calculator","coming"],
      ["Unit Converter","Convert Land, Weight, Length & Units.","📐","unit-converter","coming"],
      ["Currency Converter","Quick currency rate estimations and conversions.","💱","currency-converter","coming"]
    ]
  }
];

let activeFilter = "all";

function renderTools(searchQuery = "") {
  const container = document.getElementById("toolsContainer");
  if (!container) return;

  container.innerHTML = "";

  TOOL_CATALOG.forEach(function(sec) {
    if (activeFilter !== "all" && sec.category !== activeFilter) return;

    const q = searchQuery.toLowerCase();

    const items = sec.items.filter(function(item) {
      return item[0].toLowerCase().includes(q) ||
             item[1].toLowerCase().includes(q);
    });

    if (!items.length) return;

    const section = document.createElement("div");
    section.className = "section-wrapper";

    const title = document.createElement("div");
    title.className = "section-title";
    title.textContent = sec.sectionTitle;

    const desc = document.createElement("div");
    desc.className = "section-desc";
    desc.textContent = sec.sectionDesc;

    const grid = document.createElement("div");
    grid.className = "tools-grid";

    items.forEach(function(item) {
      const card = document.createElement("a");
      card.className = "tool-card";
      card.href = "tools/" + item[3] + "/index.html";

      const left = document.createElement("div");
      left.className = "card-left";

      const icon = document.createElement("span");
      icon.className = "card-icon";
      icon.textContent = item[2];

      const info = document.createElement("div");
      info.className = "card-info";

      const cardTitle = document.createElement("div");
      cardTitle.className = "card-title";
      cardTitle.textContent = item[0];

      const cardDesc = document.createElement("div");
      cardDesc.className = "card-desc";
      cardDesc.textContent = item[1];

      info.appendChild(cardTitle);
      info.appendChild(cardDesc);
      left.appendChild(icon);
      left.appendChild(info);

      const right = document.createElement("div");
      right.className = "card-right";

      const badge = document.createElement("span");
      badge.className = "status-badge " +
        (item[4] === "active" ? "badge-active" : "badge-coming");
      badge.textContent = item[4] === "active" ? "ACTIVE" : "SOON";

      right.appendChild(badge);
      card.appendChild(left);
      card.appendChild(right);
      grid.appendChild(card);
    });

    section.appendChild(title);
    section.appendChild(desc);
    section.appendChild(grid);
    container.appendChild(section);
  });
}

function selectCategory(cat, btn) {
  activeFilter = cat;

  document.querySelectorAll(".filter-chip").forEach(function(c) {
    c.classList.remove("active");
  });

  btn.classList.add("active");
  renderTools(document.getElementById("searchInput").value);
}

function filterTools() {
  renderTools(document.getElementById("searchInput").value);
}

document.addEventListener("DOMContentLoaded", function() {
  renderTools();
});
</script>
</body>
</html>
