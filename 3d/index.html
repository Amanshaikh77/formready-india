<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FormReady India - 3D Spatial Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #040302;
      --amber: #f5a623;
      --amber-bright: #ffbe53;
      --amber-glow: rgba(245, 166, 35, 0.6);
      --cyan: #38bdf8;
      --paper: #f8f4ec;
      --muted: #a0907e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 34%, #201306 0%, #040302 78%),
        linear-gradient(rgba(245, 166, 35, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 166, 35, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      color: var(--paper);
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    /* Top HUD Navigation Bar */
    .top-header {
      position: fixed;
      top: 14px;
      left: 0;
      width: 100vw;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .brand-badge {
      width: 36px;
      height: 36px;
      background: rgba(245, 166, 35, 0.15);
      border: 1.5px solid var(--amber);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 16px var(--amber-glow);
    }
    .brand-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: #fff;
    }
    .brand-text span { color: var(--amber); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-catalog-toggle {
      background: rgba(26, 18, 11, 0.9);
      border: 1.5px solid rgba(245, 166, 35, 0.55);
      color: var(--amber-bright);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    .btn-catalog-toggle:active {
      background: var(--amber);
      color: #000;
    }

    .switch-btn {
      background: rgba(20, 15, 10, 0.9);
      border: 1.5px solid rgba(245, 166, 35, 0.5);
      color: var(--amber);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 0 4px 18px rgba(0,0,0,0.8);
    }

    /* 3D Viewport Chamber */
    .stage-3d {
      position: fixed;
      top: 38%;
      left: 50%;
      transform: translate3d(-50%, -50%, 0);
      width: min(85vw, 320px);
      height: 350px;
      perspective: 1100px;
      perspective-origin: center center;
      z-index: 10;
    }

    .deck-container {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    /* 3D Extruded Spatial Card */
    .spatial-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(160deg, rgba(32, 22, 13, 0.96) 0%, rgba(12, 8, 4, 0.98) 100%);
      border: 2px solid rgba(245, 166, 35, 0.35);
      border-radius: 28px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transform-style: preserve-3d;
      box-shadow: 0 25px 55px rgba(0, 0, 0, 0.95), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      cursor: pointer;
      will-change: transform, opacity;
      backface-visibility: hidden;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.25, 1.15),
                  opacity 0.32s ease,
                  border-color 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .spatial-card.center {
      transform: translate3d(0, 0, 90px) rotateY(0deg) scale(1);
      opacity: 1;
      border-color: #ffbe53;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 45px rgba(245, 166, 35, 0.65), inset 0 0 20px rgba(245, 166, 35, 0.15);
      z-index: 10;
      pointer-events: auto;
    }

    .spatial-card.left {
      transform: translate3d(-78%, 14px, -120px) rotateY(36deg) scale(0.76);
      opacity: 0.4;
      border-color: rgba(245, 166, 35, 0.2);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85);
      z-index: 5;
      pointer-events: auto;
    }

    .spatial-card.right {
      transform: translate3d(78%, 14px, -120px) rotateY(-36deg) scale(0.76);
      opacity: 0.4;
      border-color: rgba(245, 166, 35, 0.2);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85);
      z-index: 5;
      pointer-events: auto;
    }

    .spatial-card.far-left {
      transform: translate3d(-150%, 28px, -260px) rotateY(55deg) scale(0.45);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    .spatial-card.far-right {
      transform: translate3d(150%, 28px, -260px) rotateY(-55deg) scale(0.45);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    .pod-icon-box {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: radial-gradient(circle at 35% 35%, rgba(245, 166, 35, 0.25), rgba(0, 0, 0, 0.85));
      border: 1.5px solid rgba(245, 166, 35, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 10px;
      transform: translateZ(50px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.9), 0 0 20px rgba(245, 166, 35, 0.35);
      flex-shrink: 0;
    }

    .pod-tag {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: var(--amber);
      letter-spacing: 2px;
      margin-bottom: 4px;
      transform: translateZ(25px);
    }

    .pod-category {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
      transform: translateZ(30px);
    }

    .pod-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(17px, 4.6vw, 21px);
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 6px;
      transform: translateZ(40px);
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }

    .pod-desc {
      font-size: clamp(11px, 2.8vw, 12px);
      color: var(--muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-width: 90%;
      transform: translateZ(20px);
    }

    .pod-counter {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: rgba(245, 166, 35, 0.75);
      margin-top: 8px;
      transform: translateZ(25px);
    }

    /* Active Tool Badge with Clickable Index Hint */
    .active-number-badge-container {
      position: fixed;
      bottom: calc(134px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .active-number-badge {
      background: rgba(26, 18, 11, 0.95);
      border: 1.5px solid rgba(245, 166, 35, 0.55);
      border-radius: 999px;
      padding: 6px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.85), 0 0 16px rgba(245, 166, 35, 0.3);
      cursor: pointer;
    }
    .active-number-badge:active {
      transform: scale(0.97);
    }

    .badge-number-chip {
      background: var(--amber);
      color: #040302;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .badge-name-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }

    .badge-all-hint {
      font-size: 10px;
      color: var(--amber-bright);
      font-family: 'Share Tech Mono', monospace;
    }

    /* Horizontal Strip for all 24 tools with Number & Name */
    .tools-nav-track-box {
      position: fixed;
      bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 440px;
      z-index: 100;
    }

    .numbers-scroll-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      padding: 4px 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    }
    .numbers-scroll-bar::-webkit-scrollbar { display: none; }

    .tool-num-btn {
      flex-shrink: 0;
      height: 32px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(22, 16, 10, 0.88);
      border: 1px solid rgba(245, 166, 35, 0.28);
      color: var(--muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tool-num-btn .pill-num {
      font-family: 'Share Tech Mono', monospace;
      color: var(--amber);
      font-weight: 800;
      font-size: 11px;
    }
    .tool-num-btn.active {
      background: var(--amber);
      color: #040302;
      border-color: #ffbe53;
      font-weight: 800;
      box-shadow: 0 0 14px var(--amber-glow);
      transform: scale(1.05);
    }
    .tool-num-btn.active .pill-num {
      color: #040302;
    }

    /* Bottom Controller Console */
    .bottom-hud-bar {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 100;
    }

    .hud-arrow-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(20, 15, 10, 0.92);
      border: 1.5px solid rgba(245, 166, 35, 0.45);
      color: var(--amber);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.8);
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }
    .hud-arrow-btn:active {
      background: var(--amber);
      color: #000;
      transform: scale(0.92);
    }

    .btn-launch-center {
      flex: 1;
      height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffc875 0%, #f5a623 55%, #d97706 100%);
      border: 2px solid #ffffff;
      color: #050403;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.8px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 25px rgba(245, 166, 35, 0.7), 0 8px 25px rgba(0,0,0,0.8);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .btn-launch-center:active {
      transform: scale(0.96);
    }

    /* ========================================================
       MODAL: FULL 24 TOOLS NUMBERED DIRECTORY (INDEX DRAWER)
       ======================================================== */
    .tools-catalog-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 3, 2, 0.85);
      backdrop-filter: blur(10px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .catalog-modal-content {
      width: min(92vw, 420px);
      max-height: 80vh;
      background: linear-gradient(160deg, #18110a 0%, #0a0704 100%);
      border: 2px solid #ffbe53;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 45px rgba(245, 166, 35, 0.4), 0 20px 50px rgba(0,0,0,0.95);
    }
    .catalog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(245, 166, 35, 0.25);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .catalog-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }
    .catalog-title span { color: var(--amber); }
    .catalog-close-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
    }
    .catalog-grid {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }
    .catalog-item-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(26, 18, 11, 0.8);
      border: 1px solid rgba(245, 166, 35, 0.2);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .catalog-item-row:hover, .catalog-item-row.is-active {
      background: rgba(245, 166, 35, 0.2);
      border-color: #ffbe53;
      transform: translateX(4px);
    }
    .catalog-idx {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      font-weight: 800;
      color: var(--amber);
      min-width: 32px;
    }
    .catalog-icon {
      font-size: 18px;
    }
    .catalog-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex: 1;
    }

    .telemetry-hint {
      position: fixed;
      bottom: 4px;
      left: 0;
      width: 100vw;
      text-align: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9.5px;
      color: rgba(245, 166, 35, 0.45);
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-header">
    <a href="../" class="brand-group">
      <div class="brand-badge">⚡</div>
      <div class="brand-text">FormReady <span>3D</span></div>
    </a>
    <div class="header-actions">
      <button class="btn-catalog-toggle" onclick="toggleCatalog(true)">📑 ALL 24</button>
      <a href="../" class="switch-btn">◀ 2D</a>
    </div>
  </div>

  <!-- 3D Spatial Deck Stage -->
  <div class="stage-3d">
    <div class="deck-container" id="deckContainer">
      <div id="deck"></div>
    </div>
  </div>

  <!-- Active Tool Number & Name Badge (Tapping Opens All 24 Index) -->
  <div class="active-number-badge-container">
    <div class="active-number-badge" onclick="toggleCatalog(true)" title="Click to view all 24 tools">
      <span class="badge-number-chip" id="badgeNumber">#19 OF 24</span>
      <span class="badge-name-text" id="badgeName">Case Converter (aA)</span>
      <span class="badge-all-hint">📑 ALL ▼</span>
    </div>
  </div>

  <!-- Number + Tool Name Interactive Strip -->
  <div class="tools-nav-track-box">
    <div class="numbers-scroll-bar" id="numScrollBar"></div>
  </div>

  <!-- Bottom Console -->
  <div class="bottom-hud-bar">
    <button class="hud-arrow-btn" onclick="stepSlide(-1)" title="Previous Tool">◀</button>
    <a href="#" class="btn-launch-center" id="launchBtn">
      <span>⚡</span>
      OPEN TOOL
    </a>
    <button class="hud-arrow-btn" onclick="stepSlide(1)" title="Next Tool">▶</button>
  </div>

  <!-- Modal: Complete 24 Numbered Tools Index -->
  <div class="tools-catalog-modal" id="catalogModal" onclick="closeCatalog(event)">
    <div class="catalog-modal-content">
      <div class="catalog-header">
        <div class="catalog-title">FORMREADY <span>TOOLS INDEX (1–24)</span></div>
        <button class="catalog-close-btn" onclick="toggleCatalog(false)">✕</button>
      </div>
      <div class="catalog-grid" id="catalogGrid"></div>
    </div>
  </div>

  <div class="telemetry-hint">
    [ 60 FPS ULTRA-LIGHT // SWIPE OR TAP INDEX TO SWITCH ]
  </div>

<script>
const TOOLS = [
  { slug: "aadhaar-pan-resizer", name: "ID Card to A4 Print", icon: "🪪", cat: "Govt Utility", desc: "Auto-crop front & back sides into clean top-aligned A4 print-ready PDF." },
  { slug: "background-remover", name: "AI Background Remover", icon: "🪄", cat: "Photo AI", desc: "Make photo background white or transparent in 1-click for exam forms." },
  { slug: "photo-sheet", name: "Passport Photo Sheet", icon: "🖨️", cat: "Photo Suite", desc: "Generate 6, 8, or 16 photo studio passport sheets ready to print." },
  { slug: "document-scanner", name: "HD Cam Scanner", icon: "📷", cat: "Govt Utility", desc: "Scan certificates via mobile camera with auto black & white filter." },
  { slug: "pdf-editor", name: "PDF Editor & Markup", icon: "📝", cat: "PDF Suite", desc: "Annotate, highlight, draw signatures and modify PDF pages offline." },
  { slug: "photo-compressor", name: "Photo Compressor (KB)", icon: "🗜️", cat: "Optimization", desc: "Compress image file size up to 80% without losing sharpness." },
  { slug: "photo-cropper", name: "Photo Cropper Ratios", icon: "✂️", cat: "Optimization", desc: "Crop photos with custom aspect ratios (1:1, 3.5x4.5cm) effortlessly." },
  { slug: "image-converter", name: "Image Format Converter", icon: "🔄", cat: "Optimization", desc: "Lossless conversion between JPG, PNG, WEBP, and ICO formats." },
  { slug: "barcode-generator", name: "Barcode Studio & Scan", icon: "🏷️", cat: "Text & Utilities", desc: "Generate Code128 barcodes or scan codes live with camera." },
  { slug: "qr-generator", name: "HD QR Code Generator", icon: "📱", cat: "Text & Utilities", desc: "Create high-res QR codes for URLs, WiFi logins, and UPI links." },
  { slug: "pdf-organizer", name: "PDF Page Organizer", icon: "📑", cat: "PDF Suite", desc: "Drag-and-drop to reorder, rotate or delete pages in any PDF document." },
  { slug: "age-calculator", name: "Sarkari Age Calculator", icon: "🎂", cat: "Smart Calculator", desc: "Calculate exact age on cut-off eligibility dates in Years, Months, Days." },
  { slug: "emi-calculator", name: "Loan EMI & Interest", icon: "💳", cat: "Smart Calculator", desc: "Calculate monthly installments and visual payment proportions." },
  { slug: "discount-calculator", name: "Discount & Percentage", icon: "🏷️", cat: "Smart Calculator", desc: "Calculate festive shopping discounts, money saved and final price." },
  { slug: "bmi-calculator", name: "BMI & Health Status", icon: "⚖️", cat: "Smart Calculator", desc: "Calculate Body Mass Index with gradient meter and healthy weight target." },
  { slug: "date-gap-calculator", name: "Date Gap & Working Days", icon: "📅", cat: "Smart Calculator", desc: "Count total days between dates and exclude weekends automatically." },
  { slug: "unit-converter", name: "Land & Unit Converter", icon: "🌾", cat: "Smart Calculator", desc: "Convert Indian land units (Bigha, Guntha, Acre, Gaj) and metrics." },
  { slug: "text-cleaner", name: "Text Cleaner & Fixer", icon: "🧹", cat: "Text & Utilities", desc: "Remove duplicate spaces, line breaks, and messy form formatting." },
  { slug: "case-converter", name: "Case Converter (aA)", icon: "🔠", cat: "Text & Utilities", desc: "Convert text to UPPERCASE, lowercase, Title Case or camelCase." },
  { slug: "word-counter", name: "Word & Essay Counter", icon: "📊", cat: "Text & Utilities", desc: "Real-time character count, word density and reading time stats." },
  { slug: "text-to-pdf", name: "Text to PDF Generator", icon: "📄", cat: "PDF Suite", desc: "Convert notes and code snippets into printable A4 PDFs." },
  { slug: "signature-maker", name: "Digital Signature Draw", icon: "🖊️", cat: "Govt Utility", desc: "Draw ultra-smooth signature on mobile and get transparent PNG." },
  { slug: "gst-calculator", name: "GST Calculator (CGST)", icon: "💰", cat: "Smart Calculator", desc: "Calculate GST Inclusive & Exclusive amounts across tax slabs." },
  { slug: "currency-converter", name: "Live Currency Converter", icon: "💱", cat: "Smart Calculator", desc: "Quick live conversion estimates for USD, EUR, GBP to INR rates." }
];

let currentIndex = 18; // Case Converter (#19)
const deck = document.getElementById("deck");
const launchBtn = document.getElementById("launchBtn");
const numScrollBar = document.getElementById("numScrollBar");
const badgeNumber = document.getElementById("badgeNumber");
const badgeName = document.getElementById("badgeName");
const catalogGrid = document.getElementById("catalogGrid");
const catalogModal = document.getElementById("catalogModal");
const deckContainer = document.getElementById("deckContainer");

const total = TOOLS.length;
let cardEls = [];
let pillEls = [];

function initDeck() {
  deck.innerHTML = "";
  numScrollBar.innerHTML = "";
  catalogGrid.innerHTML = "";

  TOOLS.forEach((tool, i) => {
    // 3D Card
    const card = document.createElement("div");
    card.className = "spatial-card";
    card.id = `card-${i}`;
    card.innerHTML = `
      <div class="pod-tag">// SPATIAL NODE</div>
      <div class="pod-icon-box">${tool.icon}</div>
      <div class="pod-category">${tool.cat}</div>
      <div class="pod-title">${tool.name}</div>
      <div class="pod-desc">${tool.desc}</div>
      <div class="pod-counter">[ ${i + 1} / ${total} ]</div>
    `;
    card.onclick = () => {
      if (currentIndex === i) {
        window.location.href = `../tools/${tool.slug}/index.html`;
      } else {
        currentIndex = i;
        renderState();
      }
    };
    deck.appendChild(card);
    cardEls.push(card);

    // Number + Name Pill
    const btn = document.createElement("button");
    btn.className = "tool-num-btn";
    btn.innerHTML = `<span class="pill-num">#${i + 1}</span> ${tool.name}`;
    btn.onclick = () => {
      currentIndex = i;
      renderState();
    };
    numScrollBar.appendChild(btn);
    pillEls.push(btn);

    // Complete Directory Item Row
    const row = document.createElement("div");
    row.className = "catalog-item-row";
    row.id = `cat-row-${i}`;
    row.innerHTML = `
      <span class="catalog-idx">#${i + 1}</span>
      <span class="catalog-icon">${tool.icon}</span>
      <span class="catalog-name">${tool.name}</span>
    `;
    row.onclick = () => {
      currentIndex = i;
      renderState();
      toggleCatalog(false);
    };
    catalogGrid.appendChild(row);
  });

  renderState();
}

function renderState() {
  for (let i = 0; i < total; i++) {
    const card = cardEls[i];
    const pill = pillEls[i];
    const row = document.getElementById(`cat-row-${i}`);
    let offset = i - currentIndex;

    if (offset > total / 2) offset -= total;
    if (offset < -total / 2) offset += total;

    card.className = "spatial-card";
    if (row) row.classList.toggle("is-active", offset === 0);

    if (offset === 0) {
      card.classList.add("center");
      pill.className = "tool-num-btn active";
      // Auto-center active pill in scroll strip
      const pLeft = pill.offsetLeft;
      const pWidth = pill.offsetWidth;
      const sWidth = numScrollBar.clientWidth;
      numScrollBar.scrollTo({ left: pLeft - (sWidth / 2) + (pWidth / 2), behavior: "smooth" });
    } else if (offset === -1) {
      card.classList.add("left");
      pill.className = "tool-num-btn";
    } else if (offset === 1) {
      card.classList.add("right");
      pill.className = "tool-num-btn";
    } else if (offset < -1) {
      card.classList.add("far-left");
      pill.className = "tool-num-btn";
    } else {
      card.classList.add("far-right");
      pill.className = "tool-num-btn";
    }
  }

  const active = TOOLS[currentIndex];
  launchBtn.href = `../tools/${active.slug}/index.html`;

  // Update Center Badge
  badgeNumber.innerText = `#${currentIndex + 1} OF ${total}`;
  badgeName.innerText = active.name;
}

let isSliding = false;
function stepSlide(dir) {
  if (isSliding) return;
  isSliding = true;

  currentIndex = (currentIndex + dir + total) % total;
  renderState();

  setTimeout(() => { isSliding = false; }, 200);
}

// Full 24 Catalog Modal Toggle
function toggleCatalog(show) {
  catalogModal.style.display = show ? "flex" : "none";
  if (show) {
    const activeRow = document.getElementById(`cat-row-${currentIndex}`);
    if (activeRow) activeRow.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

function closeCatalog(e) {
  if (e.target.id === "catalogModal") toggleCatalog(false);
}

// Mobile Touch Swipe
let touchStartX = 0;
let touchStartY = 0;

window.addEventListener("touchstart", (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener("touchend", (e) => {
  const diffX = e.changedTouches[0].clientX - touchStartX;
  const diffY = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(diffX) > 28 && Math.abs(diffX) > Math.abs(diffY)) {
    stepSlide(diffX < 0 ? 1 : -1);
  }
}, { passive: true });

// Mouse Wheel
window.addEventListener("wheel", (e) => {
  e.preventDefault();
  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  stepSlide(delta > 0 ? 1 : -1);
}, { passive: false });

// Desktop Mouse Parallax
window.addEventListener("mousemove", (e) => {
  const tiltY = (e.clientX / window.innerWidth - 0.5) * 16;
  const tiltX = (e.clientY / window.innerHeight - 0.5) * -12;
  deckContainer.style.transform = `rotateY(${tiltY}deg) rotateX(${tiltX}deg)`;
});

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") stepSlide(1);
  if (e.key === "ArrowLeft") stepSlide(-1);
  if (e.key === "Escape") toggleCatalog(false);
  if (e.key === "Enter") {
    window.location.href = `../tools/${TOOLS[currentIndex].slug}/index.html`;
  }
});

initDeck();
</script>
</body>
</html>
