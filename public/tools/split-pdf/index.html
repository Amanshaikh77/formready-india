<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Split PDF | FormReady India</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:18px 20px;
  font-size:20px;
  font-weight:700;
}

.container{
  max-width:700px;
  margin:35px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:20px;
  padding:28px;
  box-shadow:0 10px 35px #00000012;
}

h1{
  margin-top:0;
  font-size:28px;
}

.sub{
  color:#64748b;
  margin-bottom:25px;
}

.drop{
  border:2px dashed #94a3b8;
  border-radius:16px;
  padding:35px 20px;
  text-align:center;
  cursor:pointer;
  background:#f8fafc;
}

.drop:hover{
  border-color:#2563eb;
  background:#eff6ff;
}

input[type=file]{
  display:none;
}

.file-name{
  margin-top:15px;
  font-weight:600;
  color:#2563eb;
  word-break:break-word;
}

.row{
  display:flex;
  gap:12px;
  margin-top:22px;
  flex-wrap:wrap;
}

input[type=number]{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
}

.field{
  flex:1;
  min-width:130px;
}

label{
  display:block;
  margin-bottom:7px;
  font-weight:600;
}

button{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  margin-top:18px;
  padding:12px;
  border-radius:10px;
  display:none;
}

.info{
  margin-top:22px;
  padding:15px;
  background:#f1f5f9;
  border-radius:12px;
  color:#475569;
  font-size:14px;
}

.back{
  display:inline-block;
  margin-top:20px;
  color:#2563eb;
  text-decoration:none;
  font-weight:600;
}

@media(max-width:600px){
  .container{margin:15px auto;padding:12px}
  .card{padding:20px}
}
</style>
</head>

<body>

<header>FormReady India</header>

<div class="container">

<div class="card">

<h1>Split PDF</h1>

<div class="sub">
Upload a PDF and extract the pages you need.
</div>

<label class="drop" for="pdfFile">
  <strong>📄 Choose PDF</strong>
  <br><br>
  Tap here to select your PDF file
</label>

<input id="pdfFile" type="file" accept="application/pdf">

<div id="fileName" class="file-name"></div>

<div class="row">

<div class="field">
<label>From page</label>
<input id="fromPage" type="number" min="1" value="1">
</div>

<div class="field">
<label>To page</label>
<input id="toPage" type="number" min="1" value="1">
</div>

</div>

<button id="splitBtn" disabled>
Split & Download PDF
</button>

<div id="status" class="status"></div>

<div class="info">
<b>How it works:</b><br>
Select your PDF → choose the starting and ending page → tap Split & Download.
Your PDF is processed directly in your browser.
</div>

<a class="back" href="/">← Back to Home</a>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>

const fileInput = document.getElementById("pdfFile");
const fileName = document.getElementById("fileName");
const splitBtn = document.getElementById("splitBtn");
const fromPage = document.getElementById("fromPage");
const toPage = document.getElementById("toPage");
const statusBox = document.getElementById("status");

let selectedFile = null;
let totalPages = 0;

fileInput.addEventListener("change", async function(){

  selectedFile = this.files[0];

  if(!selectedFile){
    splitBtn.disabled = true;
    return;
  }

  if(selectedFile.type !== "application/pdf"){
    showStatus("Please select a PDF file.", true);
    splitBtn.disabled = true;
    return;
  }

  fileName.textContent = "Selected: " + selectedFile.name;

  try{

    const bytes = await selectedFile.arrayBuffer();

    const pdf = await PDFLib.PDFDocument.load(bytes);

    totalPages = pdf.getPageCount();

    fromPage.max = totalPages;
    toPage.max = totalPages;

    fromPage.value = 1;
    toPage.value = totalPages;

    splitBtn.disabled = false;

    showStatus("PDF loaded successfully — " + totalPages + " pages.", false);

  }catch(error){

    console.error(error);

    showStatus("Could not read this PDF. It may be damaged or password protected.", true);

    splitBtn.disabled = true;
  }

});

splitBtn.addEventListener("click", async function(){

  if(!selectedFile) return;

  const start = parseInt(fromPage.value);
  const end = parseInt(toPage.value);

  if(
    isNaN(start) ||
    isNaN(end) ||
    start < 1 ||
    end > totalPages ||
    start > end
  ){
    showStatus("Please enter a valid page range.", true);
    return;
  }

  splitBtn.disabled = true;
  splitBtn.textContent = "Processing...";

  try{

    const bytes = await selectedFile.arrayBuffer();

    const sourcePdf =
      await PDFLib.PDFDocument.load(bytes);

    const newPdf =
      await PDFLib.PDFDocument.create();

    const pageNumbers = [];

    for(let i=start-1;i<end;i++){
      pageNumbers.push(i);
    }

    const copiedPages =
      await newPdf.copyPages(sourcePdf,pageNumbers);

    copiedPages.forEach(page=>{
      newPdf.addPage(page);
    });

    const output =
      await newPdf.save();

    const blob =
      new Blob([output],{type:"application/pdf"});

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    const original =
      selectedFile.name.replace(/\.pdf$/i,"");

    a.href = url;

    a.download =
      original +
      `-pages-${start}-${end}.pdf`;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(()=>{
      URL.revokeObjectURL(url);
    },1000);

    showStatus(
      `Done! Pages ${start}–${end} were extracted successfully.`,
      false
    );

  }catch(error){

    console.error(error);

    showStatus(
      "Something went wrong while splitting the PDF.",
      true
    );

  }

  splitBtn.disabled = false;
  splitBtn.textContent = "Split & Download PDF";

});

function showStatus(message,error){

  statusBox.style.display = "block";

  statusBox.textContent = message;

  statusBox.style.background =
    error ? "#fee2e2" : "#dcfce7";

  statusBox.style.color =
    error ? "#991b1b" : "#166534";
}

</script>

</body>
</html>
